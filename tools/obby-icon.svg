<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#26306b"/><stop offset="1" stop-color="#0c1130"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.28"/><stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="512" height="512"/></clipPath>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="sh2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- platform: rounded bar with a lit top lip and a darker body -->
    <g id="plat">
      <rect x="0" y="0" width="190" height="40" rx="20"/>
      <rect x="10" y="7" width="170" height="12" rx="6" fill="#fff" fill-opacity="0.35"/>
      <rect x="0" y="26" width="190" height="14" rx="7" fill="#000" fill-opacity="0.18"/>
    </g>
  </defs>
  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#dots)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- jump trail -->
    <path d="M262 298 C 266 270, 280 252, 300 240" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>

    <!-- platforms, low to high -->
    <use href="#plat" x="44"  y="392" fill="#5fd0ff" filter="url(#sh)"/>
    <use href="#plat" x="230" y="300" fill="#7cf09a" filter="url(#sh)"/>
    <use href="#plat" x="72"  y="208" fill="#5fd0ff" filter="url(#sh)"/>
    <use href="#plat" x="268" y="116" fill="#ffd35a" filter="url(#sh)"/>

    <!-- goal flag on the top platform -->
    <g filter="url(#sh2)">
      <rect x="418" y="40" width="7" height="80" rx="3.5" fill="#e9ecff"/>
      <path d="M425 44 L470 58 L425 74 Z" fill="#ff5d73"/>
      <circle cx="421.5" cy="40" r="6" fill="#ffd35a"/>
    </g>

    <!-- chicken mid-jump: same shapes and colours as the in-game Chicken (player 28.8 x 36.8) -->
    <g transform="translate(300 160) scale(3.3)" filter="url(#sh2)">
      <rect x="4.4" y="26.8" width="6" height="10" rx="2" fill="#ffd700"/>
      <rect x="12.4" y="26.8" width="6" height="10" rx="2" fill="#ffd700"/>
      <rect x="4" y="4" width="20.8" height="22.8" rx="10" fill="#fff9e6"/>
      <ellipse cx="22.8" cy="14" rx="5" ry="8" transform="rotate(17 22.8 14)" fill="#ffe082"/>
      <circle cx="11.4" cy="5" r="3" fill="#ff5252"/>
      <circle cx="15.4" cy="5" r="3" fill="#ff5252"/>
      <circle cx="19.4" cy="5" r="3" fill="#ff5252"/>
      <path d="M24.4 18 L30.4 21 L24.4 24 Z" fill="#ffa726"/>
      <ellipse cx="7.4" cy="15" rx="3.8" ry="4.3" fill="#fff"/>
      <ellipse cx="21.4" cy="15" rx="3.8" ry="4.3" fill="#fff"/>
      <ellipse cx="8.6" cy="15.5" rx="2.3" ry="2.8" fill="#333"/>
      <ellipse cx="22.6" cy="15.5" rx="2.3" ry="2.8" fill="#333"/>
      <circle cx="7.6" cy="14" r="0.8" fill="#fff" fill-opacity="0.8"/>
      <circle cx="21.6" cy="14" r="0.8" fill="#fff" fill-opacity="0.8"/>
      <ellipse cx="23.4" cy="24" rx="3" ry="4" fill="#ff5252"/>
    </g>

  </g>
</svg>
