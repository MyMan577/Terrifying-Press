<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#dfe5f3"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0000000f" stroke-width="2"/></pattern>
    <radialGradient id="red" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ff9a9a"/><stop offset=".45" stop-color="#e02020"/><stop offset="1" stop-color="#8a0d0d"/></radialGradient>
    <radialGradient id="blue" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#9ac4ff"/><stop offset=".45" stop-color="#2a6fe0"/><stop offset="1" stop-color="#0d2f7a"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a2440" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- motion trails -->
  <g fill="#e02020"><circle cx="70" cy="380" r="10" opacity=".18"/><circle cx="104" cy="352" r="16" opacity=".28"/><circle cx="140" cy="326" r="22" opacity=".4"/></g>
  <g fill="#2a6fe0"><circle cx="446" cy="132" r="10" opacity=".18"/><circle cx="412" cy="160" r="16" opacity=".28"/><circle cx="376" cy="186" r="22" opacity=".4"/></g>
  <!-- sword on red, held toward the middle -->
  <g filter="url(#sh)">
    <circle cx="190" cy="312" r="84" fill="url(#red)"/>
    <circle cx="190" cy="312" r="84" fill="none" stroke="#6a0808" stroke-width="5"/>
    <g transform="rotate(-50 190 312)">
      <rect x="182" y="96" width="18" height="150" rx="3" fill="#dfe4ee" stroke="#8a93a6" stroke-width="2"/><rect x="187" y="100" width="4" height="146" fill="#ffffff"/>
      <path d="M182 96 L191 64 L200 96 Z" fill="#dfe4ee" stroke="#8a93a6" stroke-width="2"/>
      <rect x="164" y="244" width="54" height="14" rx="6" fill="#c9a227"/><rect x="185" y="258" width="12" height="30" rx="4" fill="#6b3a1a"/>
    </g>
  </g>
  <!-- hammer on blue -->
  <g filter="url(#sh)">
    <circle cx="322" cy="200" r="84" fill="url(#blue)"/>
    <circle cx="322" cy="200" r="84" fill="none" stroke="#08205a" stroke-width="5"/>
    <g transform="rotate(-140 322 200)">
      <rect x="315" y="150" width="14" height="120" rx="5" fill="#8a5a2a"/>
      <rect x="282" y="250" width="80" height="46" rx="8" fill="#6f7884" stroke="#3e444d" stroke-width="2"/><rect x="284" y="252" width="76" height="10" rx="5" fill="#b8c0cc"/>
    </g>
  </g>
  <!-- clash spark -->
  <g transform="translate(256 256)">
    <path d="M0 -52 L12 -12 L52 0 L12 12 L0 52 L-12 12 L-52 0 L-12 -12 Z" fill="#ffd23a"/>
    <path d="M0 -28 L6 -6 L28 0 L6 6 L0 28 L-6 6 L-28 0 L-6 -6 Z" fill="#fff6c0"/>
  </g>
</svg>
