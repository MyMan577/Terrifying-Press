name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Put the web app in www
        run: |
          mkdir -p www
          cp index.html vocal-separator.js www/
          if [ -f update-options.js ]; then cp update-options.js www/; fi

      - name: Create the Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add the native ONNX plugin
        run: |
          for f in android-overrides/OnnxSeparatorPlugin.java android-overrides/MainActivity.java vocal-separator.js index.html; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in the repo: $f. Add it at that exact path (folder included) and run again."; exit 1; fi
          done
          PKG_DIR=android/app/src/main/java/com/pressplay/media
          mkdir -p "$PKG_DIR"
          cp android-overrides/OnnxSeparatorPlugin.java "$PKG_DIR"/
          cp android-overrides/MainActivity.java "$PKG_DIR"/
          sed -i '/^dependencies {/a\    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"' android/app/build.gradle
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: press-play-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
