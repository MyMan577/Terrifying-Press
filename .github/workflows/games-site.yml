name: Publish games website

# Publishes the games website on GitHub Pages: every game plus Points, quests, achievements, the shop,
# the Playground and the Disc Clicker, built from the app's own code by tools/build_games_site.py.
# Media-player features are left out there (window.__ppWeb).
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/games/**'
      - 'src/**'           # www/index.html is built from these parts; the Games screen and the Disc Clicker come from it
      - 'tools/assemble.py'
      - 'www/pp-*.js'
      - 'web/**'
      - 'tools/build_games_site.py'
      - '.github/workflows/games-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: games-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      # www/index.html is not stored in the repo: it is joined from the parts in src/.
      - name: Build the app files from their parts
        run: python3 tools/assemble.py

      # Fills web/index.html from the app's own Games code and copies the games and Points/Playground scripts.
      # Fails if a piece it needs has moved in www/index.html, or if any script has a syntax error.
      - name: Build the site
        run: python3 tools/build_games_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # The deploy step looks the artifact up straight after the upload; twice it was not visible yet
      # ("No artifacts named github-pages were found") and the site did not publish. Wait until it shows up.
      - name: Wait for the uploaded site to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" -ge 1 ]; then echo "artifact listed"; exit 0; fi
            echo "not listed yet ($i)"; sleep 5
          done
          echo "still not listed; trying the deploy anyway"
      - id: deployment
        uses: actions/deploy-pages@v4
