const WPN=[{n:'Bazooka',c:'bz',d:'Straight shot, pushed by wind'},{n:'Grenade',c:'gr',d:'Bounces and rolls, explodes after 3s'},{n:'Sticky bomb',c:'sb',d:'Sticks to anything. Smaller blast'},{n:'Fist',c:'fs',d:'Forward punch, low arc. Unlimited'},{n:'Bat',c:'bt',u:'ub',d:'Heavy hit that sends enemies flying far along your aim angle, with only a little built-in lift. Aim down to spike, up to pop them skyward. Starts with 2, +1 per kill'},{n:'Jetpack',c:'jp',u:'jj',d:'Arrows to fly, limited fuel. Toggle Hover to stay in the air (half the fuel of sideways flight). Drop a grenade or sticky bomb for a 5s retreat with unlimited fuel.'},{n:'Air strike',c:'as',u:'ua',d:'Aim sets target distance. A fighter jet drops 5 missiles in a tight, straight line. Explode on impact'},{n:'Dynamite',c:'dy',u:'ud',d:'Drops at your feet. 5s fuse, huge blast. Run!'},{n:'Thunder grenade',c:'hg',u:'uh',d:'Throw it like a grenade. Huge blast'},{n:'Popcorn bomb',c:'bn',u:'un',d:'Pops into 5 smaller bombs'},{n:'Shotgun',c:'sg',u:'us',d:'Two blasts of 8 pellets in a spread. Low damage per pellet but devastating up close. Short range'},{n:'Teleport',c:'tp',u:'ut',d:'Jump about 110px forward. Winds up for 0.6s as energy gathers around you, then you warp'},{n:'Drill',c:'dl',u:'ur',d:'Become a slow drill: tunnel along your aim (▲▼ steer) for about 8 seconds. Damages and shoves every enemy blob around you (3 dmg per pulse). Uses your turn'},{n:'Parachute',c:'pch',u:'uc',p:1,d:'Passive item. Opens automatically before a damaging fall and stays out until you land or hit a wall. Left/Right arrows nudge you sideways while it is open. One use each'},{n:'Bunker buster',c:'bb',u:'uk',d:'Tap the map. A heavy bomber drops it. Falls straight down (no wind), burrows 2s or until it hits something, then blasts. Max 30 dmg. Starts with 1'},{n:'Triple bunker buster',c:'tb',u:'ul',d:'A heavy bomber drops three bunker busters in a wide fan, landing at staggered times. Rare crate find'},{n:'Homing launcher',c:'ho',u:'u
