function fxRows0(){const m=S.mode,st=!!S.stack,dk=G.side==='D',c0=COLS[0],R=[],n=[];
 const stk=(t,x)=>st?t+' Stackable with another '+x+'.':t;

 else if(m==='flip'){

  else R.push([{c:c0,v:'r'},'Reverse','Flips the direction of play. With 2 players it acts as a Skip.'],[{c:c0,v:'e'},'Draw 5',stk('Next player draws 5 and is skipped.','Draw 5')],[{c:c0,v:'z'},'Skip All','Everyone else is skipped. You play again.'],[{c:c0,v:'l'},'Flip','Switch to the Light Side. Ends your turn.'],[{c:'k',v:'w'},'Wild','Play on anything. Choose the next color.'],[{c:'k',v:'h'},'Wild Draw Color','Choose a color. Next player draws until they get it, then is skipped.'])}
 else{
  R.push([{c:c0,v:'s'},'Skip','Next player loses their turn.'],[{c:c0,v:'r'},'Reverse','Flips the direction of play. With 2 players it acts as a Skip.'],[{c:c0,v:'d'},'Draw 2',stk('Next player draws 2 and is skipped.','Draw 2')],[{c:'k',v:'w'},'Wild','Play on anything. Choose the next color.'],[{c:'k',v:'f'},'Wild +4',stk('Choose a color. Next player draws 4 and is skipped.','+4')]);
    if(m==='open')n.push('Everyone\'s cards are face up. Read the table and plan your plays.');
  if(m==='bluff'){R.push([{c:'k',v:'p'},'Lie Detector','Wild card. If the card before it was a bluff, that player draws 2.']);n.push('With Bluff on, you may claim a card you are not playing. Challenge a claim you doubt: a caught liar takes the card back and draws 2.')}}
 if(S.sz){R.push([{c:c0,v:'7'},'7','Swap hands with any player.']);if(m!=='flip')R.push([{c:c0,v:'0'},'0','Everyone passes their hand to the next player.'])}

 return{R,n}}
