<style>
/* Layout: full-screen portrait canvas, HUD strip pinned to the top, card overlays centered for title / game over / stage clear. Single committed look (bright daytime toy world). */

<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-l"><div id="hearts" class="hearts" aria-label="Health"></div></div>
    <div class="hud-r">
      <div class="chip"><b class="cdot"></b><span id="coinN">0</span></div>
      <button id="mute" class="icon" type="button">Sound on</button>
    </div>
    <div class="hud-c">
      <div class="track" id="prog"><i id="progFill"></i></div>
      <div class="bossbar" id="bossBar" hidden><span id="bossName">Boss</span><div class="track boss"><i id="bossFill"></i></div></div>
    </div>
  </div>

  <div class="hint" id="hint" hidden>Tap to dash</div>
  <div class="coach" id="coach" role="status" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="wsw" id="wsw" hidden></div>

  <section class="screen" id="sTitle">
    <div class="card">
      <div class="menu" id="menu" hidden>
        <div class="mapw" id="mapC" hidden></div>
        <div class="shop" id="shopC" hidden></div>
        <div class="ups" id="upC" hidden></div>
        <div class="ups" id="achC" hidden></div>
        <div id="msg" role="status"></div>
      </div>
      <div class="bar">
        <div class="chip"><b class="cdot"></b><span id="tCoins">0</span></div>
        <button class="btn alt tab" id="bMap" type="button">Map</button>
        <button class="btn alt tab" id="bC" type="button">Knights</button>
        <button class="btn alt tab" id="bU" type="button">Shop</button>
        <button class="btn alt tab" id="bA" type="button" aria-label="Achievements">🏆</button>
      </div>

function buildStage(n){
  var rnd=mulberry32(4242+n*131),TH=4.2;
  var st={n:n,islands:[],blocks:[],solids:[],spikes:[],crushers:[],axes:[],enemies:[],arenaX:0,arenaEnd:0,arenaTop:0,
    jets:[],drops:[],bars:[],coins:[],cp:null,coinTotal:0};
  var diff=Math.min(n,10),WD=worldOf(n);
  var kinds=['walker','walker','hopper','hopper','leaper'];
  if(n>=2)kinds.push('shield','bomber','imp');
  if(n>=3)kinds.push('brute');
  if(n>=4)kinds.push('shield','leaper','hopper','imp');
  if(WD.enemy)kinds.push(WD.enemy,WD.enemy);
  if(n===1)kinds=['walker','walker','hopper'];   // stage 1 eases you in
  var pick=function(){return kinds[Math.floor(rnd()*kinds.length)];};
  var pats=[['cluster',4],['single',2],['steps',2],['spikes',2],['crusher',2],['swarm',2],['long',3]];
  if(n>=2)pats.push(['axe',2],['bombs',2]);
  if(n>=3)pats.push(['brutes',2]);
  if(WD.hazard)pats.push(['whaz',4]);
  if(WD.enemy)pats.push(['wfoe',3]);
  if(WD.castle)pats.push(['axe',1],['crusher',1]);
  if(n===1)pats=[['cluster',4],['single',2],['steps',3],['spikes',1],['long',2]];
  var sub=['cluster','swarm','spikes','crusher','single'];
  if(n>=2)sub.push('axe','bombs','cluster');
  if(n>=3)sub.push('brutes');
  if(WD.hazard)sub.push('whaz','whaz');
  if(WD.enemy)sub.push('wfoe');
  if(n===1)sub=['cluster','single','spikes'];
  var total=0;pats.forEach(function(p){total+=p[1];});
  var choose=function(){var r=rnd()*total;for(var i=0;i<pats.length;i++){r-=pats[i][1];if(r<=0)return pats[i][0];}return 'cluster';};
  var isle=function(x0,w,t){st.islands.push({x0:x0,x1:x0+w,y0:t-TH,y1:t,top:t,kind:'isle',ice:WD.hazard==='ice'&&st.islands.length>0&&rnd()<0.5});};
  // early stages get narrower gaps
  var gf=clamp(0.62+0.08*(n-1),0.62,1);
  var gap=function(){return Math.max(0.9,(1.2+Math.pow(rnd(),1.3)*2.6+Math.min(diff,6)*0.05)*gf);};
  var coin=function(cx,cy){st.coins.push({x:cx,y:cy,got:false});};
  var sn=function(v){return Math.round(v*2)/2;};
  var L=62+Math.min(n,8)*7,x=9,top=0,prev='',pat,i;
  var put=function(pat,ix,top){
    var w=2,i;
    if(pat==='cluster'){
      var c=Math.min(8,3+Math.floor(rnd()*(2+diff*0.5))),sp=1.1+rnd()*0.4;
      for(i=0;i<c;i++)st.enemies.push(mkEnemy(pick(),ix+i*sp,top,rnd));
      w=c*sp;
    }else if(pat==='swarm'){
      var m=5+Math.floor(rnd()*3);
      for(i=0;i<m;i++)st.enemies.push(mkEnemy('imp',ix+i*0.75,top,rnd));
      w=m*0.75+0.5;
    }else if(pat==='brutes'){
      st.enemies.push(mkEnemy('brute',ix+1,top,rnd),mkEnemy('walker',ix+2.6,top,rnd),mkEnemy('walker',ix+3.8,top,rnd));
      if(rnd()<0.5)st.enemies.push(mkEnemy('brute',ix+5.4,top,rnd));
      w=6.5;
    }else if(pat==='single'){
      var t=n===1?['hopper']:['hopper','leaper'];if(n>=2)t.push('shield');
      st.enemies.push(mkEnemy(t[Math.floor(rnd()*t.length)],ix+1,top,rnd));w=2;
    }else if(pat==='spikes'){
      var sc=1+Math.floor(rnd()*2);
      st.spikes.push({x0:ix,x1:ix+sc,y:top});w=sc;
      if(rnd()<0.6){st.enemies.push(mkEnemy('walker',ix+sc+1.3,top,rnd));w=sc+1.8;}
    }else if(pat==='crusher'){
      st.crushers.push({x:ix+1,w:1.5,P:2.8+rnd()*0.6,ph:rnd()*3,y:top});w=2.5;
      if(rnd()<0.5){st.enemies.push(mkEnemy('walker',ix+3.4,top,rnd));w=4;}
    }else if(pat==='axe'){
      st.axes.push({x:ix+1.5,ay:top+4.4,len:3.3,amp:1.25+rnd()*0.2,fr:1.5+rnd()*0.5,ph:rnd()*6});w=3;
    }else if(pat==='bombs'){
      ['walker','bomber','walker','walker'].forEach(function(tp,k){st.enemies.push(mkEnemy(tp,ix+k*1.25,top,rnd));});
      w=5;
    }else if(pat==='wfoe'){
      var fc=2+Math.floor(rnd()*2),fsp=WD.enemy==='bat'?1.7:1.45;
      for(i=0;i<fc;i++){var ft=(i===fc-1&&rnd()<0.4)?pick():WD.enemy;st.enemies.push(mkEnemy(ft,ix+i*fsp,ft==='bat'?top+1.5:top,rnd));}
      w=fc*fsp;
    }else if(pat==='whaz'){
      if(WD.hazard==='jet'){
        st.jets.push({x:ix+1,y:top,P:2.6+rnd()*0.6,ph:rnd()*3});w=2.2;
        if(rnd()<0.6){st.jets.push({x:ix+2.9,y:top,P:2.6+rnd()*0.6,ph:rnd()*3});w=4;}
      }else if(WD.hazard==='ice'||WD.hazard==='rocks'){
        var dc=2+Math.floor(rnd()*2);
        for(i=0;i<dc;i++)st.drops.push({x:ix+0.9+i*1.6,y:top+4.4,state:'hang',t:0,vy:0,dy:0});
        w=dc*1.6+0.6;
      }else if(WD.hazard==='firebar'){
        st.bars.push({x:ix+1.7,y:top+1.7,n:4,sp:(rnd()<0.5?-1:1)*(1.4+rnd()*0.5),ph:rnd()*6});w=3.4;
      }
    }
    return w;
  };
  isle(-2,11,0);x+=gap();
  while(x<L){
    pat=choose();
    if(pat===prev&&(pat==='crusher'||pat==='axe'||pat==='steps'||pat==='long'))pat='cluster';
    prev=pat;
    top=sn(clamp(top+[-2.5,-1.5,-1,0,1,1.5,2][Math.floor(rnd()*7)],0,6));
    if(pat==='steps'){
      for(i=0;i<3;i++){
        if(i)top=sn(clamp(top+[-1.5,1.5,1][Math.floor(rnd()*3)],0,6));
        isle(x,2.6,top);coin(x+1.3,top+1.3);x+=2.6+gap();
      }
      continue;
    }
    if(!st.cp&&n>0&&x>L*0.45)st.cp={x:x+0.9,y:top};
    var pad=1.8,ix=x+pad,w;
    if(pat==='long'){
      var segs=3+Math.floor(rnd()*2),cx=ix;
      for(i=0;i<segs;i++)cx+=put(sub[Math.floor(rnd()*sub.length)],cx,top)+1.2+rnd()*1.6;
      w=cx-ix;
    }else w=put(pat,ix,top);
    var iw=Math.max(7,w+pad*2)+rnd()*3;
    isle(x,iw,top);
    if(rnd()<0.55)for(i=0;i<3;i++)coin(x+iw-1.6-i*0.6,top+1.25);
    var gw=gap();x+=iw+gw;
    if(gw>1.6&&rnd()<0.6)coin(x-gw/2,top+1.6);
  }
  top=sn(clamp(top+[-1,0,1][Math.floor(rnd()*3)],0,5));
  st.arenaX=x;st.arenaTop=top;st.arenaEnd=x+18;
  isle(x,21.6,top);
  if(bossType(n)==='charger')[4,8,12].forEach(function(o){st.blocks.push({x0:x+o,x1:x+o+1.2,y0:top,y1:top+2.4,kind:'block'});});
  st.solids=st.islands.concat(st.blocks);
  st.coinTotal=st.coins.length;
  return st;
}
function mkBoss(n,stg){
  var type=bossType(n),hp=Math.min(40,10+3*(n-1));
  var D={slam:['Crusher King',2.6,2.6,stg.arenaX+12.5],leap:['Leaper King',2.6,2.6,stg.arenaX+12.5],charger:['Ram King',2.6,2.1,stg.arenaX+16.5],bomber:['Mad Bomber',2.2,2.4,stg.arenaEnd-3],summoner:['Necro King',2.2,2.6,stg.arenaX+14.5]}[type];
  return {type:type,name:D[0],x:D[3],y:stg.arenaTop,vx:0,vy:0,w:D[1],h:D[2],
    hp:hp,maxhp:hp,state:'idle',st:1.4,tx:0,flash:0,hitCd:0,dead:false,airborne:false,minions:false,phase:0,cx:0,dir:-1,n:0,t:0};
}
var G=null,mode='title',last=0;
function startStage(n,paused,fromCp){
  var stg=buildStage(n),mh=maxHearts(),x0=2,y0=0;
  if(fromCp&&stg.cp){
    x0=stg.cp.x;y0=stg.cp.y;
    stg.enemies=stg.enemies.filter(function(e){return e.x>x0+3;});
    stg.coins.forEach(function(c){if(c.x<x0+1)c.got=true;});
  }
  G={n:n,stg:stg,wait:true,time:0,cam:Math.max(0,x0-2.8),camY:y0,floorY:y0,coins:0,tapCd:0,hitStop:0,shake:0,arena:false,leftLock:0,end:null,
    p:{x:x0,y:y0,vx:0,vy:0,w:.65,h:.65,hp:mh,maxhp:mh,invul:0,grounded:true,dead:false,lastSafe:{x:x0,y:y0},rot:0,wallCd:0,climb:0},
    enemies:stg.enemies,parts:[],texts:[],waves:[],shots:[],ebombs:[],earrows:[],fireCd:0,boss:mkBoss(n,stg),
    banner:{t:2.2,text:fromCp?'Back at the flag':'Stage '+n,sub:fromCp?'':worldName(n)},
    pickups:0,hurt:false,bossHurt:false,runT:0,par:Math.round(stg.arenaX/3.4+35),fromCp:!!fromCp,cpHit:!!fromCp,combo:0,slow:0,onIce:false,zaps:[]};
  applyLoadout();
  mode=paused?'title':'play';
}
/* ---------- fx ---------- */
function burst(g,x,y,color,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,s=(0.5+Math.random())*(spd||5);
    g.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.abs(Math.sin(a))*s+2,life:0.5+Math.random()*0.3,t:0,c:color,s:0.12+Math.random()*0.12});
  }
  if(g.parts.length>320)g.parts.splice(0,g.parts.length-320);
}
function puff(g,x,y,color,n){burst(g,x,y+0.1,color,n,2.2);}
function floatText(g,x,y,s,c){g.texts.push({x:x,y:y,s:s,c:c,t:0});}

/* ---------- world queries ---------- */
function floorAt(g,x,oy,hw){
  hw=hw||0;var f=-1e9,s=g.stg.solids,o,i;floorAt.o=null;
  for(i=0;i<s.length;i++){o=s[i];if(x>=o.x0&&x<=o.x1&&o.y1<=oy+0.3&&o.y1>f){f=o.y1;floorAt.o=o;}}
  return f;
}
function stepY(g,e,dt){
  var oy=e.y,s=g.stg.solids,i,o;
  e.vy-=GRAV*dt;e.y+=e.vy*dt;
  if(e.vy>0){
    for(i=0;i<s.length;i++){o=s[i];if(e.x>=o.x0&&e.x<=o.x1&&oy+e.h<=o.y0+0.1&&e.y+e.h>o.y0){e.y=o.y0-e.h;e.vy=0;}}
    return false;
  }
  var f=floorAt(g,e.x,oy);
  if(e.y<=f){e.y=f;return true;}
  return false;
}
function solidPush(g,e,ox){
  var s=g.stg.solids,hit=0,o,i;
  for(i=0;i<s.length;i++){
    o=s[i];
    if(e.x+e.w/2<=o.x0||e.x-e.w/2>=o.x1)continue;
    if(e.y>=o.y1-0.12||e.y+e.h<=o.y0)continue;
    if(e.x+e.w/2-o.x0<o.x1-(e.x-e.w/2)){e.x=o.x0-e.w/2;hit=1;}else{e.x=o.x1+e.w/2;hit=-1;}
  }
  return hit;
}
function supported(){return true;}
function ehTop(e){return e.y+(e.type==='leaper'&&e.state==='crouch'?e.h*0.75:e.h);}
function nearWall(g,p){
  var s=g.stg.solids,i,o,gp;
  for(i=0;i<s.length;i++){
    o=s[i];gp=o.x0-(p.x+p.w/2);
    if(gp>=-0.05&&gp<0.3&&p.y<o.y1-0.12&&p.y+p.h>o.y0)return true;
  }
  return false;
}

function crusherBH(c,t){
  var P=c.P,ct=(t+c.ph)%P;
  if(ct<0.35)return lerp(0,2.6,ct/0.35);
  if(ct<P-1.1)return 2.6;
  if(ct<P-0.5)return 2.6;
  if(ct<P-0.4)return lerp(2.6,0,(ct-(P-0.5))/0.1);
  return 0;
}
function crusherWarn(c,t){var P=c.P,ct=(t+c.ph)%P;return ct>=P-1.1&&ct<P-0.4;}
function axePos(a,t){
  var ang=a.amp*Math.sin(a.fr*t+a.ph);
  return {x:a.x+a.len*Math.sin(ang),y:a.ay-a.len*Math.cos(ang),dir:Math.cos(a.fr*t+a.ph)>=0?1:-1};
}
function circRect(cx,cy,r,rx,ry,rw,rh){
  var nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh),dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}

/* ---------- damage ---------- */
function hurtPlayer(g,n,dir){
  var p=g.p;
  if(p.invul>0||p.dead)return;
  if(g.guard>0){
    g.guard=0;p.invul=1.1;p.vx=(dir||-1)*4;p.vy=4;p.grounded=false;
    floatText(g,p.x,p.y+1.2,'Blocked!','#9fd8ff');burst(g,p.x,p.y+0.45,'#9fd8ff',8,4);beep(700,.12,'triangle',.06,.6);
    return;
  }
  p.hp-=n;p.invul=g.fx.starpin?1.8:1.1;p.vx=(dir||-1)*5.5;p.vy=5;p.grounded=false;
  g.hurt=true;if(g.arena)g.bossHurt=true;
  g.hitStop=0.07;g.shake=Math.min(1,g.shake+0.6);
  burst(g,p.x,p.y+0.45,'#ff4d4d',8,5);
  beep(120,.22,'sawtooth',.07,.4);
  if(p.hp<=0&&!tryRevive(g))killPlayer(g);
}
function tryRevive(g){
  if(!g.phoenix)return false;
  var p=g.p;g.phoenix=0;p.hp=1;p.invul=2;
  floatText(g,p.x,p.y+1.3,'Phoenix!','#ff8a1f');burst(g,p.x,p.y+0.4,'#ff8a1f',16,6);burst(g,p.x,p.y+0.4,GOLD,10,5);
  beep(500,.2,'triangle',.07,2);
  return true;
}
function killPlayer(g){
  var p=g.p;p.dead=true;p.vy=Math.max(p.vy,7);p.vx=-3;
  if(!g.end)g.end={t:1.2,kind:'over'};
}
function explode(g,x,y,safe){
  burst(g,x,y,'#ffb02e',18,8);burst(g,x,y,'#2d3140',10,6);
  g.shake=Math.min(1.2,g.shake+0.7);g.hitStop=Math.max(g.hitStop,0.06);
  beep(80,.35,'sawtooth',.09,.3);
  var R=2.4;
  g.enemies.forEach(function(o){
    if(o.gone||o.dying)return;
    var dx=o.x-x,dy=(o.y+o.h/2)-y;
    if(dx*dx+dy*dy<R*R){hurtEnemy(g,o,2);o.vx=(dx>=0?1:-1)*8;o.vy=Math.max(o.vy,4);}
  });
  var p=g.p,dx=p.x-x,dy=(p.y+p.h/2)-y;
  if(!safe&&dx*dx+dy*dy<R*R)hurtPlayer(g,1,dx>=0?1:-1);
}
function hurtEnemy(g,e,dmg){
  if(e.dying||e.gone)return;
  if(e.type==='bomber'){if(e.fuse<0){e.fuse=0.5;beep(700,.1,'square',.05);}e.flash=.15;return;}
  e.hp-=dmg;e.flash=.15;
  if(e.hp<=0)killEnemy(g,e,true);
}
function killEnemy(g,e,fly){
  if(e.dying||e.gone)return;
  var gain=e.coins+(Math.random()<g.luck?1:0);
  g.coins+=gain;
  g.combo++;if(g.combo>=5)unlockAch('combo5');
  floatText(g,e.x,e.y+e.h+0.3,'+'+gain,GOLD);
  beep(520,.1,'square',.05,1.8);
  if(fly){e.dying=true;e.dyT=0.75;e.vy=Math.max(e.vy,4);}
  else{
    e.gone=true;burst(g,e.x,e.y+e.h/2,e.color,10,5);
    if(e.type==='bomber')explode(g,e.x,e.y+0.45);
  }
}

/* ---------- player attack ---------- */
function playerAttack(g,wp){
  var p=g.p,f=p.face||1;
  if(p.dead||p.vx*f<3.5)return;
  var reach=wp.reach*(g.fx.bracer&&!wp.shot?1.3:1)+0.12*upl('dash');
  // the hit zone sits in front of the knight, on whichever side it faces
  var hx0=f>0?p.x+p.w/2-0.15:p.x-p.w/2-reach,hx1=f>0?p.x+p.w/2+reach:p.x-p.w/2+0.15,ty=wp.tall||0,thru=wp.through||1,cnt=0,j,o;
  for(var i=0;i<g.enemies.length;i++){
    var e=g.enemies[i];
    if(e.gone||e.dying||e.hitCd>0)continue;
    if(e.x+e.w/2<hx0||e.x-e.w/2>hx1)continue;
    if(e.y>p.y+p.h-0.05+ty||e.y+e.h<p.y+0.05-ty)continue;
    e.hitCd=0.2;cnt++;
    hurtEnemy(g,e,pdmg(g,wp.dmg+(wp.armor&&(e.type==='shield'||e.type==='brute')?wp.armor:0),e.x,e.y+e.h+0.8));
    var bare=wkey()==='none';
    e.vx=f*(bare?1.2:Math.max(6.5,p.vx*f*wp.kb*1.25));e.vy=Math.max(e.vy,3.2);
    if(wp.lift){e.vx=3*f;e.vy=wp.lift;}
    if(wp.splash){for(j=0;j<g.enemies.length;j++){o=g.enemies[j];if(o===e||o.gone||o.dying||o.hitCd>0)continue;if(Math.abs(o.x-e.x)<wp.splash&&Math.abs(o.y-e.y)<wp.splash){o.hitCd=0.2;hurtEnemy(g,o,1);o.vx=f*Math.max(o.vx*f,6);o.vy=Math.max(o.vy,3);burst(g,o.x,o.y+o.h/2,o.color,4,4);}}}
    burst(g,e.x-f*e.w/2,e.y+e.h/2,e.color,5,4);
    if(wp.lunge){p.vy=wp.lunge;p.grounded=false;}
    if(!bare&&(e.dying||e.gone||cnt<thru))p.vx*=wp.keep;else p.vx=0;
    g.hitStop=0.05;g.shake=Math.min(1,g.shake+0.22);
    beep(180+Math.random()*60,.09,'square',.06,.5);
    if(p.vx*f<3.5)break;
  }
  var b=g.boss;
  if(b&&!b.dead&&b.state!=='dying'&&b.hitCd<=0&&p.vx*f>=3.5){
    if(!(b.x+b.w/2<hx0||b.x-b.w/2>hx1)&&!(b.y>p.y+p.h||b.y+b.h<p.y)){
      b.hitCd=0.3;
      if(f>0)p.x=Math.min(p.x,b.x-b.w/2-p.w/2-0.02);else p.x=Math.max(p.x,b.x+b.w/2+p.w/2+0.02);
      p.vx=-4.5*f;p.vy=3.5;p.grounded=false;
      if(b.state==='daze'){
        var d=pdmg(g,wp.dmg*2,b.x,b.y+b.h+1.1);b.hp-=d;b.flash=0.15;
        floatText(g,b.x,b.y+b.h+0.4,'-'+d,'#ff4d4d');
        burst(g,b.x-b.w/2,b.y+b.h*0.6,'#ffc233',10,6);
        g.hitStop=0.09;g.shake=Math.min(1.2,g.shake+0.5);
        beep(140,.2,'square',.08,.5);
        if(b.hp<=0){
          b.hp=0;b.state='dying';b.st=1.4;
          g.coins+=20+5*g.n;floatText(g,b.x,b.y+b.h+1,'+'+(20+5*g.n),GOLD);
          g.waves.length=0;
          if(!g.end)g.end={t:1.8,kind:'clear'};
        }
      }else{
        burst(g,b.x-b.w/2,b.y+b.h*0.5,'#ffffff',6,5);
        beep(600,.08,'triangle',.06,.7);g.shake=Math.min(1,g.shake+0.15);
      }
    }
  }
}

/* ---------- thrown weapons ---------- */
function fire(g,k){
  var p=g.p,f=p.face||1,x=p.x+f*p.w/2,y=p.y+p.h*0.55,i,n0=g.shots.length,pv=Math.max(0,p.vx*f);
  if(k==='knife'){g.shots.push({k:'knife',x:x,y:y,vx:15,vy:0,t:0,life:0.9});beep(900,.06,'triangle',.04,.6);}

// lightning: jumps to up to three foes ahead, nearest first
function zap(g,x,y){

    }

    hurtEnemy(g,best,pdmg(g,1,cx,cy+0.9));best.vx=(g.p.face||1)*Math.max(best.vx*(g.p.face||1),3);best.vy=Math.max(best.vy,2.5);burst(g,cx,cy,'#ffe14a',5,4);
  }

function updShots(g,dt){
  var i,j,s,e,b=g.boss,done,boom;
  for(i=g.shots.length-1;i>=0;i--){
    s=g.shots[i];s.t+=dt;done=s.t>s.life||s.y<-6;boom=false;
    if(s.k==='bomb'&&!s.flat)s.vy-=GRAV*0.8*dt;
    if(s.k==='jav')s.vy-=GRAV*0.3*dt;
    if(s.k==='boom'){
      var sd=s.dir||1;
      s.vx-=26*sd*dt;s.vy=(g.p.y+g.p.h*0.55-s.y)*2;
      if(s.vx*sd<0&&!s.back){s.back=true;s.hits=[];}
      if(s.back&&(s.x-g.p.x)*sd<0.2)done=true;
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(!done){
      for(j=0;j<g.enemies.length;j++){
        e=g.enemies[j];
        if(e.gone||e.dying)continue;
        if(s.hits&&s.hits.indexOf(e)>=0)continue;
        if(Math.abs(s.x-e.x)<e.w/2+0.12&&s.y>e.y-0.1&&s.y<ehTop(e)+0.1){
          if(s.k==='bomb'){boom=true;}
          else{
            hurtEnemy(g,e,pdmg(g,s.d||1,e.x,e.y+e.h+0.8));
            if(s.frz&&!e.gone&&!e.dying){e.frozen=s.frz;burst(g,s.x,s.y,'#b8f0ff',6,3);}
            else{e.vx=s.vx<0?Math.min(e.vx,-4):Math.max(e.vx,4);e.vy=Math.max(e.vy,2.5);}
            burst(g,s.x,s.y,e.color,4,4);beep(240,.06,'square',.05,.6);
            if(s.hits&&s.pierce>0){s.pierce--;s.hits.push(e);}else done=true;
          }
          break;
        }
      }
    }
    if(!done&&!boom&&b&&!b.dead&&b.state!=='dying'&&Math.abs(s.x-b.x)<b.w/2+0.1&&s.y>b.y&&s.y<b.y+b.h){
      if(s.k==='bomb')boom=true;

      else{shotBoss(g,b,pdmg(g,s.d||1,b.x,b.y+b.h+1.1));done=true;}
    }
    if(!done&&!boom&&s.k==='bomb'){
      if(s.t>=s.life)boom=true;
      else if(s.vy<0&&s.y<=floorAt(g,s.x,s.y)+0.05)boom=true;
    }
    if(!done&&s.k==='jav'&&s.y<=floorAt(g,s.x,s.y)+0.05){burst(g,s.x,s.y,'#ffffff',3,3);done=true;}
    if(!done&&!boom&&s.k!=='boom'){
      var sl=g.stg.solids,q,so;
      for(q=0;q<sl.length;q++){so=sl[q];
        if(s.x>=so.x0&&s.x<=so.x1&&s.y>so.y0&&s.y<so.y1-0.3){
          if(s.k==='bomb')boom=true;else{burst(g,s.x,s.y,'#ffffff',3,3);done=true;}

    }
    if(!boom&&s.k==='bomb'&&s.t>=s.life)boom=true;
    if(boom){

      done=true;
    }
    if(done)g.shots.splice(i,1);
  }
}

/* ---------- entity updates ---------- */
function updEnemy(g,e,dt){
  var p=g.p;
  e.hitCd-=dt;e.chainCd-=dt;e.flash-=dt;e.axeCd-=dt;e.phase+=dt;
  if(e.frozen>0){
    e.frozen-=dt;
    if(e.frozen<=0&&e.type==='bat')e.baseY=e.y+0.6;
  }
  if(e.type==='bat'&&!e.dying&&!(e.frozen>0)){
    // flies: drifts toward you once you're close, bobbing up and down
    var bd=e.x-p.x;
    if(bd>0&&bd<6&&!p.dead)e.x-=1.7*dt;
    e.x+=e.vx*dt;e.vx*=Math.exp(-3*dt);
    e.y=e.baseY+Math.sin(e.phase*2.6)*0.55;e.vy=0;e.grounded=false;
    return;
  }
  var wasG=e.grounded,eox=e.x,eland=stepY(g,e,dt);
  e.x+=e.vx*dt;
  if(eland){if(!wasG&&e.vy<-4)puff(g,e.x,e.y,'#ffffff',3);e.vy=0;e.grounded=true;}else e.grounded=false;
  e.vx*=Math.exp(-(e.grounded?4:0.5)*dt);
  var eh=solidPush(g,e,eox);if((eh===1&&e.vx>0)||(eh===-1&&e.vx<0))e.vx*=-0.3;
  if(e.x<-1.4){e.x=-1.4;e.vx=Math.abs(e.vx)*0.3;}
  if(e.x>g.stg.arenaEnd-0.5){e.x=g.stg.arenaEnd-0.5;e.vx=-Math.abs(e.vx)*0.3;}
  if(e.y<-4){e.gone=true;return;}
  if(e.dying){
    e.dyT-=dt;e.rot+=dt*(e.vx>=0?1:-1)*9;
    if(e.dyT<=0){e.gone=true;burst(g,e.x,e.y+e.h/2,e.color,10,5);}
    return;
  }
  if(e.frozen>0){if(e.state==='air'||e.state==='slide'||e.state==='draw'||e.state==='crouch'||e.state==='prep')e.state='idle';return;}
  var slow=Math.abs(e.vx)<1.2;
  if(e.type==='hopper'||e.type==='imp'){
    var im=e.type==='imp';
    if(e.grounded&&slow){e.hopT-=dt;if(e.hopT<=0){e.vy=im?e.power*0.65:e.power;e.hopT=im?e.period*0.55:e.period;e.grounded=false;}}
  }else if(e.type==='leaper'){
    var dx=e.x-p.x;
    if(e.state==='idle'){
      if(e.grounded&&slow&&dx>0&&dx<5.5&&Math.abs(p.y-e.y)<2.5&&!p.dead){e.state='crouch';e.st=0.5;}
    }else if(e.state==='crouch'){
      e.st-=dt;
      if(!slow||!e.grounded)e.state='idle';
      else if(e.st<=0){var T=0.72;e.vy=GRAV*T/2;e.vx=clamp((p.x-e.x)/T,-8,2);e.state='air';e.grounded=false;}
    }else if(e.state==='air'){
      if(e.grounded){e.state='rest';e.st=1;}
    }else if(e.state==='rest'){
      e.st-=dt;if(e.st<=0)e.state='idle';
    }
  }else if(e.type==='bomber'&&e.fuse>=0){
    e.fuse-=dt;
    if(e.fuse<0){e.gone=true;explode(g,e.x,e.y+0.45);}
  }else if(e.type==='mummy'){
    // shuffles toward you, but never off its ledge
    var md=e.x-p.x;
    if(e.grounded&&slow&&md>0.9&&md<7&&!p.dead&&floorAt(g,e.x-e.w/2-0.1,e.y+0.2)>=e.y-0.3)e.x-=0.9*dt;
  }else if(e.type==='penguin'){
    var pd=e.x-p.x;
    if(e.state==='idle'){if(e.grounded&&slow&&pd>0&&pd<6.5&&Math.abs(p.y-e.y)<1.6&&!p.dead){e.state='prep';e.st=0.5;}}
    else if(e.state==='prep'){e.st-=dt;if(e.st<=0){e.state='slide';e.st=1.3;e.vx=-7.5;}}
    else if(e.state==='slide'){e.st-=dt;if(e.vx<0)e.vx=Math.min(e.vx,-6.5);if(e.st<=0||e.vx>=0){e.state='rest';e.st=1.4;}}
    else if(e.state==='rest'){e.st-=dt;if(e.st<=0)e.state='idle';}
  }else if(e.type==='archer'){
    var ad=e.x-p.x;e.st-=dt;
    if(e.state==='draw'){if(e.st<=0){g.earrows.push({x:e.x-e.w/2,y:e.y+e.h*0.55,vx:-6.5,t:0});beep(520,.08,'triangle',.04,.5);e.state='idle';e.st=2.1;}}
    else if(e.st<=0&&ad>0.9&&ad<9&&Math.abs(p.y-e.y)<3&&!p.dead){e.state='draw';e.st=0.6;}

function chainHits(g){

    var a=E[i];if(a.gone)continue;

function updBoss(g,dt){

  }else if(b.state==='tele'){

/* ---------- world hazards, coins, checkpoint ---------- */
function jetPhase(j,t){var c=(t+j.ph)%j.P;return c<0.75?'on':(c>j.P-0.75?'warn':'off');}
function barBalls(b,t){var a=b.ph+b.sp*t,out=[];for(var k=1;k<=b.n;k++)out.push({x:b.x+Math.cos(a)*k*0.55,y:b.y+Math.sin(a)*k*0.55});return out;}
function updWorld(g,dt){
  var p=g.p,stg=g.stg,i,e;
  // checkpoint flag
  if(stg.cp&&!g.cpHit&&p.x>=stg.cp.x&&!p.dead){
    g.cpHit=true;g.banner={t:1.6,text:'Checkpoint!'};

    coach('cp','Checkpoint! If you lose all your hearts, you can carry on from here.',true);
  }
  // coins (pulled in by the magnet upgrade)
  var mr=[0,1.6,3][upl('magnet')]+(g.fx.charm?1.4:0);
  stg.coins.forEach(function(c){
    if(c.got||p.dead)return;
    var dx=p.x-c.x,dy=(p.y+p.h/2)-c.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(mr&&d<mr){var m=Math.min(d,11*dt);c.x+=dx/d*m;c.y+=dy/d*m;}
    if(d<0.6){c.got=true;g.coins++;g.pickups++;burst(g,c.x,c.y,GOLD,5,3);beep(1040+g.pickups%4*60,.06,'square',.035,1.4);}
  });
  // fire jets
  stg.jets.forEach(function(j){

    if(ph==='warn'&&Math.random()<0.25)g.parts.push({x:j.x+(Math.random()-.5)*0.3,y:j.y+0.1,vx:(Math.random()-.5),vy:2+Math.random()*2,life:0.5,t:0,c:'#9a8f86',s:0.14});
    if(ph!=='on')return;
    if(Math.random()<0.6)g.parts.push({x:j.x+(Math.random()-.5)*0.4,y:j.y+0.3,vx:(Math.random()-.5)*1.5,vy:6+Math.random()*4,life:0.35,t:0,c:Math.random()<.5?'#ffb02e':'#ff4d2e',s:0.18});
    if(!p.dead&&Math.abs(p.x-j.x)<0.5&&p.y<j.y+2.4&&p.y+p.h>j.y)hurtPlayer(g,1,p.x<j.x?-1:1);
    g.enemies.forEach(function(en){if(!en.gone&&!en.dying&&Math.abs(en.x-j.x)<0.45&&en.y<j.y+2.2&&en.y+en.h>j.y)killEnemy(g,en,true);});
  });
  // icicles / stalactites: shake when you pass under, then drop
  stg.drops.forEach(function(d){

    }else if(d.state==='shake'){
      d.t-=dt;if(d.t<=0){d.state='fall';d.vy=0;}
    }else if(d.state==='fall'){
      d.vy-=GRAV*dt;d.dy+=d.vy*dt;
      var yy=d.y+d.dy,hitP=!p.dead&&Math.abs(p.x-d.x)<0.42&&yy<p.y+p.h&&yy+0.9>p.y;
      if(hitP){hurtPlayer(g,1,p.x<d.x?-1:1);d.state='gone';burst(g,d.x,yy+0.3,worldOf(g.n).dirt[0],10,4);return;}
      g.enemies.forEach(function(en){if(d.state==='fall'&&!en.gone&&!en.dying&&Math.abs(en.x-d.x)<en.w/2+0.2&&yy<en.y+en.h&&yy>en.y){killEnemy(g,en,true);}});

  });
  // archers' arrows: dash into one to knock it away

      if(p.vx>=3.5){burst(g,ar.x,ar.y,'#e8f1f7',6,4);floatText(g,ar.x,ar.y+0.6,'Parry!','#fff');beep(880,.08,'square',.05,1.2);}
      else hurtPlayer(g,1,-1);
      g.earrows.splice(i,1);continue;
    }
    if(ar.t>3||ar.y<floorAt(g,ar.x,ar.y)+0.05)g.earrows.splice(i,1);
  }
  if(!g.wait&&!p.dead&&mode==='play')coachChecks(g);
}

/* ---------- coaching: a short tip the first time you meet something ---------- */
var coachAt=-9;
function coach(key,text,force){
  if(save.seen[key]||!G||mode!=='play')return false;
  if(!force&&G.time-coachAt<3.6)return false;
  save.seen[key]=1;persist();coachAt=G.time;
  var c=$('#coach');c.textContent=text;c.hidden=false;
  clearTimeout(coach.t);coach.t=setTimeout(function(){c.hidden=true;},3400);
  G.slow=1.2;   // brief slow motion so you can react
  return true;
}
var FOE_TIPS={hopper:['hop','Hoppers hurt while in the air. Hit them as they land.'],imp:['hop','Hoppers hurt while in the air. Hit them as they land.'],
  shield:['shield','Shield guards take three hits.'],bomber:['bomber','Bombers blow up after a hit. Get clear!'],brute:['brute','Brutes take five hits. Keep dashing!'],
  leaper:['leaper','Leapers crouch, then jump at you.'],mummy:['mummy','Mummies take two hits and keep coming.'],
  penguin:['penguin','Penguins slide at you. Hit them before they go.'],bat:['bat','Bats swoop at you. Dash through them.'],
  archer:['archer','Archers shoot. Dash into an arrow to knock it away.']};
function coachChecks(g){
  var p=g.p,stg=g.stg,i,e,near=function(x,r){return x>p.x-0.3&&x<p.x+(r||4.5);};
  if(g.arena&&!save.seen.back&&coach('back','Tap the left side of the screen to dash backwards.'))return;
  if(!save.seen.gap){
    floorAt(g,p.x,p.y+0.1);var isl=floorAt.o;
    if(isl&&isl.kind==='isle'&&isl.x1-p.x<2.4&&isl.x1-p.x>0.2&&!stg.solids.some(function(o){return o!==isl&&o.x0<=isl.x1+0.05&&o.x1>isl.x1;}))
      if(coach('gap','Gap ahead! Tap to dash across while you hop.'))return;
  }
  if(!save.seen.wall&&nearWall(g,p)&&coach('wall','A wall! Tap right next to it to climb up.'))return;
  for(i=0;i<g.enemies.length;i++){
    e=g.enemies[i];if(e.gone||e.dying||!near(e.x,4.5))continue;
    if(!save.seen.foe){if(coach('foe','Dash into foes to knock them out.'))return;continue;}
    var t=FOE_TIPS[e.type];if(t&&!save.seen[t[0]]&&coach(t[0],t[1]))return;
  }
  if(g.onIce&&coach('ice','Ice! A dash carries you much further.'))return;
  var H=[['spikes',stg.spikes,'x0','Spikes hurt. Hop over them.'],['crusher',stg.crushers,'x','Crushers flash red just before they slam.'],
    ['axe',stg.axes,'x','Time your dash past the swinging axe.'],['jet',stg.jets,'x','Fire jets puff smoke before they blast.'],
    ['drop',stg.drops,'x',worldOf(g.n).hazard==='ice'?'Icicles drop when you pass under. Keep moving!':'Loose rocks drop when you pass under. Keep moving!'],
    ['bar',stg.bars,'x','Fire bars spin. Slip through a gap.']];
  for(i=0;i<H.length;i++){
    if(save.seen[H[i][0]])continue;
    var list=H[i][1],k=H[i][2];
    for(var j=0;j<list.length;j++)if(near(list[j][k],4.5)){if(coach(H[i][0],H[i][3]))return;break;}
  }
}

/* ---------- main update ---------- */
function update(dt){
  var g=G,p=g.p,stg=g.stg,wp=WEAPONS[wkey()],i,e;
  g.time+=dt;g.tapCd-=dt;g.fireCd-=dt;if(p.thrust>0)p.thrust-=dt;
  if(!g.wait&&!g.end)g.runT+=dt;
  if(g.banner&&g.banner.t>0)g.banner.t-=dt;
  g.shake=Math.max(0,g.shake-dt*2.2);

  // player physics
  var fx=p.x,fy=p.y,was=p.grounded,pox=p.x,land=stepY(g,p,dt);
  p.x+=p.vx*dt;p.invul-=dt;p.wallCd-=dt;
  // enemy heads and crusher slabs are platforms: land on them like cubes
  var onE=false;
  if(!land&&p.vy<=0&&!p.dead){
    var best=-1e9,et,bestE=null;
    for(i=0;i<g.enemies.length;i++){
      e=g.enemies[i];
      if(e.gone||e.dying)continue;
      et=ehTop(e);
      if(Math.abs(p.x-e.x)<(p.w+e.w)/2-0.08&&fy>=et-0.3-Math.max(0,e.vy)*dt&&p.y<=et&&et>best){best=et;onE=true;bestE=e;}
    }
    stg.crushers.forEach(function(c){
      var stt=c.y+crusherBH(c,g.time)+1.6;
      if(Math.abs(p.x-c.x)<c.w/2+p.w/2-0.08&&fy>=stt-0.3&&p.y<=stt&&stt>best){best=stt;onE=true;bestE=null;}
    });
    if(onE){
      p.y=best;land=true;burst(g,p.x,p.y,'#ffffff',3,3);beep(380,.05,'triangle',.04,1.4);
      if(bestE&&g.fx.spikes&&bestE.hitCd<=0){bestE.hitCd=0.3;hurtEnemy(g,bestE,1);floatText(g,bestE.x,bestE.y+bestE.h+0.6,'Stomp!','#fff');}
    }
  }
  if(land){
    var fo=onE?null:floorAt.o;
    if(!was&&p.vy<-5)puff(g,p.x,p.y,'#ffffff',5);
    p.vy=0;p.grounded=true;
    if(fo){g.floorY=fo.y1;if(fo.kind==='isle'&&!p.dead&&p.x>fo.x0+0.8&&p.x<fo.x1-0.8)p.lastSafe={x:p.x,y:p.y};}
    g.onIce=!!(fo&&fo.ice);
  }else p.grounded=false;
  // ice keeps your dash going much longer
  p.vx*=Math.exp(-(p.grounded?(g.onIce?1.1:6):(g.onIce?1.6:2.6))*dt);
  var wh=solidPush(g,p,pox);p.climb-=dt;
  if(wh&&!p.dead){
    if(wh===1){p.vx=p.climb>0?3:0;}
    else if(p.vx<0)p.vx=0;
  }
  if(p.grounded&&!p.dead&&!g.wait){p.vy=JUMP*(g.fx.spring?1.12:1);p.grounded=false;puff(g,p.x,p.y,'#ffffff',2);}
  if(g.wait){p.x=fx;p.y=fy;p.vx=0;p.vy=0;p.grounded=true;}
  var minX=Math.max(-1.2,g.leftLock);
  if(p.x<minX){p.x=minX;if(p.vx<0)p.vx=0;}
  if(p.x>stg.arenaEnd-0.6){p.x=stg.arenaEnd-0.6;if(p.vx>0)p.vx*=-0.2;}
  if(!g.arena&&p.x>stg.arenaX+1.5){
    g.arena=true;g.leftLock=stg.arenaX+0.4;g.banner={t:2.4,text:g.boss.name};
    beep(90,.5,'sawtooth',.07,.5);
    coach('boss','Bosses only take damage while dazed (X eyes). Dodge, then strike!',true);
  }
  if(p.dead)p.rot+=dt*8;
  if(p.y<-5&&!p.dead){
    p.hp-=1;g.shake=0.6;beep(140,.3,'sawtooth',.06,.4);g.hurt=true;if(g.arena)g.bossHurt=true;
    floatText(g,p.lastSafe.x,p.lastSafe.y+1.4,'-1 ♥','#ff4d4d');
    if(p.hp<=0&&!tryRevive(g)){killPlayer(g);p.vy=0;}
    else{p.x=p.lastSafe.x;p.y=p.lastSafe.y+0.2;p.vx=0;p.vy=0;p.invul=1.3;g.floorY=p.lastSafe.y;}
  }

  // enemies
  for(i=0;i<g.enemies.length;i++)updEnemy(g,g.enemies[i],dt);
  playerAttack(g,wp);
  chainHits(g);

  // player vs enemies: static ones are solid, airborne hoppers and leapers hurt
  if(!p.dead){
    for(i=0;i<g.enemies.length;i++){
      e=g.enemies[i];
      if(e.gone||e.dying)continue;
      var ox=Math.abs(p.x-e.x)<(p.w+e.w)/2-0.1,oy=p.y<ehTop(e)-0.3&&p.y+p.h>e.y+0.1;
      if(!ox||!oy)continue;
      var danger=!(e.frozen>0)&&(((e.type==='hopper'||e.type==='imp')&&!e.grounded)||(e.type==='leaper'&&e.state==='air')||e.type==='bat'||(e.type==='penguin'&&e.state==='slide'));
      if(danger&&p.invul<=0)hurtPlayer(g,1,p.x<e.x?-1:1);
      else if(p.x<e.x){p.x=e.x-(p.w+e.w)/2+0.1;if(p.vx>0)p.vx=0;}
    }
  }

  // spikes
  stg.spikes.forEach(function(s){
    g.enemies.forEach(function(en){
      if(en.gone)return;
      if(en.y<s.y+0.4&&en.y>s.y-0.8&&en.x>s.x0-0.1&&en.x<s.x1+0.1){if(en.dying){en.gone=true;burst(g,en.x,s.y+0.3,en.color,8,4);}else killEnemy(g,en,false);}
    });
    if(!p.dead&&p.y<s.y+0.35&&p.y>s.y-0.8&&p.x>s.x0-0.25&&p.x<s.x1+0.25)hurtPlayer(g,1,-1);
  });
  // crushers
  stg.crushers.forEach(function(c){
    var bh=crusherBH(c,g.time);
    if(bh>0.6)return;
    g.enemies.forEach(function(en){
      if(en.gone)return;
      var rel=en.y-c.y;
      if(Math.abs(en.x-c.x)<c.w/2+en.w*0.3&&rel<bh+1.6&&rel>-1){if(en.dying){en.gone=true;burst(g,en.x,en.y+0.4,en.color,8,4);}else killEnemy(g,en,false);}
    });
  });
  // crusher slabs are solid walls: blocked from the side, crushed if one lands on you, then shoved out to the nearest side so you can never get stuck inside
  stg.crushers.forEach(function(c){
    if(p.dead)return;
    var bh=crusherBH(c,g.time),sb=c.y+bh,stt=sb+1.6,hw=c.w/2+p.w/2,dx=p.x-c.x;
    if(Math.abs(dx)>=hw||p.y>=stt-0.12||p.y+p.h<=sb+0.02)return;
    if(Math.abs(dx)<c.w/2+p.w*0.1)hurtPlayer(g,1,dx<0?-1:1);
    if(dx<0){p.x=c.x-hw;if(p.vx>0)p.vx=0;}else{p.x=c.x+hw;if(p.vx<0)p.vx=0;}
  });
  // axes

  });
  // shockwaves
  for(i=g.waves.length-1;i>=0;i--){
    var wv=g.waves[i];
    wv.x+=wv.dir*8*dt;wv.life-=dt;
    if(!p.dead&&Math.abs(wv.x-p.x)<0.6&&p.y<stg.arenaTop+0.45)hurtPlayer(g,1,wv.dir);

  }
  updBoss(g,dt);
  updEbombs(g,dt);
  updShots(g,dt);

  // cleanup
  g.enemies=g.enemies.filter(function(en){return !en.gone;});
  for(i=g.parts.length-1;i>=0;i--){

    if(pt.t>pt.life)g.parts.splice(i,1);
  }
  for(i=g.texts.length-1;i>=0;i--){g.texts[i].t+=dt;if(g.texts[i].t>0.9)g.texts.splice(i,1);}
  for(i=g.zaps.length-1;i>=0;i--){g.zaps[i].t+=dt;if(g.zaps[i].t>0.18)g.zaps.splice(i,1);}

  // camera
  var viewW=W/S,target=clamp(p.x-2.8,0,Math.max(0,stg.arenaEnd+1.2-viewW));
  if(g.arena)target=Math.max(target,g.leftLock-0.6);
  g.cam+=(target-g.cam)*(1-Math.exp(-8*dt));
  var ty=clamp(Math.min(g.floorY,p.y+2.5),-2,9);g.camY+=(ty-g.camY)*(1-Math.exp(-4*dt));

  if(g.end){g.end.t-=dt;if(g.end.t<=0){var k=g.end.kind;g.end=null;endRun(k);}}
}

/* ---------- input ---------- */
function dash(back){
  if(mode!=='play'||!G)return;
  var g=G,p=g.p;
  if(p.dead||g.tapCd>0)return;
  g.tapCd=0.08;
  if(g.wait){g.wait=false;show('#none');}
  var wp=WEAPONS[wkey()];
  // in the boss arena you can dash backwards; the knight and everything it holds turn round
  p.face=back&&g.arena?-1:1;
  if(p.face<0){
    p.vx=-wp.dash*(1+0.07*upl('dash'))*g.dashM;p.thrust=0.22;g.combo=0;
    if(wp.shot&&g.fireCd<=0){fire(g,wp.shot);g.fireCd=wp.cd*(g.fx.quiver?0.65:1);}
    beep(300,.07,'triangle',.05,1.6);
    puff(g,p.x+0.3,p.y,'#ffffff',3);
    $('#hint').hidden=true;return;
  }
  if(nearWall(g,p)){
    p.vy=WALLJ;p.vx=3;p.climb=0.7;p.grounded=false;
    burst(g,p.x+p.w/2,p.y+0.3,'#ffffff',5,3);beep(420,.09,'triangle',.05,1.7);
    $('#hint').hidden=true;return;
  }
  p.vx=wp.dash*(1+0.07*upl('dash'))*g.dashM;p.thrust=0.22;g.combo=0;
  if(wp.shot&&g.fireCd<=0){fire(g,wp.shot);g.fireCd=wp.cd*(g.fx.quiver?0.65:1);}
  beep(300,.07,'triangle',.05,1.6);
  puff(g,p.x-0.3,p.y,'#ffffff',3);
  $('#hint').hidden=true;

function drawSheet(ts){
  var c=$('#chCv'),x=c.getContext('2d'),cw=c.width,ch=c.height,oc=ctx,t=ts/1000,k=SH.k,wk=CHARS[k].weapons[SH.w],d=cw/(c.clientWidth||1);
  if(cw<2)return;
  ctx=x;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cw,ch);
  // keep the knight between the stats (left) and the weapon sockets (right)
  var L=SH.L||cw*0.35,R=SH.R||cw*0.65,kx=cw/2;
  var pw=Math.min((R-L)*0.6,ch*0.2),gy=ch*0.5+pw*0.95,S2=pw/0.65,bob=Math.abs(Math.sin(t*3))*pw*0.12,yb=gy-pw*0.18-bob;
  // light rays and glow
  var cy=ch*0.5,col=CHARS[k].color;
  x.save();x.translate(kx,cy);x.rotate(t*0.25);
  for(var i=0;i<12;i++){x.rotate(Math.PI/6);x.fillStyle=i%2?'rgba(255,255,255,.07)':'rgba(255,236,170,.10)';x.beginPath();x.moveTo(0,0);x.lineTo(ch*0.9,-ch*0.1);x.lineTo(ch*0.9,ch*0.1);x.closePath();x.fill();}
  x.restore();
  var gl=x.createRadialGradient(kx,cy,0,kx,cy,pw*2.2);gl.addColorStop(0,'rgba(255,240,190,.55)');gl.addColorStop(1,'rgba(255,240,190,0)');
  x.fillStyle=gl;x.fillRect(0,0,cw,ch);
  // fade the rays out before the canvas edge so there is no hard box
  var fm=x.createRadialGradient(kx,cy,0,kx,cy,Math.min(cw,ch)*0.62);fm.addColorStop(0.55,'#000');fm.addColorStop(1,'rgba(0,0,0,0)');
  x.globalCompositeOperation='destination-in';x.fillStyle=fm;x.fillRect(0,0,cw,ch);x.globalCompositeOperation='source-over';
  // pedestal
  var pr=Math.min(pw*1.1,(R-L)*0.5),ph=pw*0.18;
  x.lineWidth=3*d;x.strokeStyle=INK;
  var top=gy-ph*0.9;
  x.fillStyle='#4a5878';x.beginPath();x.ellipse(kx,gy,pr,ph,0,0,6.283);x.fill();x.stroke();
  x.fillRect(kx-pr,top,pr*2,gy-top);
  x.beginPath();x.moveTo(kx-pr,top);x.lineTo(kx-pr,gy);x.moveTo(kx+pr,top);x.lineTo(kx+pr,gy);x.stroke();
  x.fillStyle='#8fa0c2';x.beginPath();x.ellipse(kx,gy-ph*0.9,pr,ph,0,0,6.283);x.fill();x.stroke();
  x.fillStyle=col;x.globalAlpha=0.5;x.beginPath();x.ellipse(kx,gy-ph*0.9,pr*0.7,ph*0.6,0,0,6.283);x.fill();x.globalAlpha=1;
  x.fillStyle='rgba(28,42,57,.35)';x.beginPath();x.ellipse(kx,gy-ph*0.9,pw*(0.55-bob/pw*0.6),ph*0.35,0,0,6.283);x.fill();
  knightDraw(k,kx-pw/2,yb-pw,pw,pw,{t:t,vx:2+Math.sin(t*1.3)*1.5,hurt:false});
  if(wk!=='none'){
    var hx=kx+pw/2-S2*0.05,hy=yb-pw*0.45,ang=WREST[wk]+Math.sin(t*2)*0.06,Ln=WLEN[wk]||1;
    var ws=Math.min(S2*0.8,(R+10*d-hx)/(Ln*Math.abs(Math.cos(ang))+0.2),(hy-6*d)/(Ln*Math.abs(Math.sin(ang))+0.35));
    x.save();x.translate(hx,hy);x.rotate(ang);weaponShape(wk,ws);x.restore();
  }
  ctx=oc;
}

  });
}
function drawParts(g){
  g.parts.forEach(function(pt){
    ctx.globalAlpha=clamp(1-pt.t/pt.life,0,1);ctx.fillStyle=pt.c;
    ctx.fillRect(sx(g,pt.x)-pt.s*S/2,sy(pt.y)-pt.s*S/2,pt.s*S,pt.s*S);
  });
  ctx.globalAlpha=1;
  ctx.font=Math.round(S*0.5)+'px "Lilita One",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.lineJoin='round';
  g.texts.forEach(function(t){
    var x=sx(g,t.x),y=sy(t.y)-t.t*S*1.2;
    ctx.globalAlpha=clamp(1.2-t.t/0.9,0,1);ctx.strokeText(t.s,x,y);ctx.fillStyle=t.c;ctx.fillText(t.s,x,y);
  });
  ctx.globalAlpha=1;
}
function drawBanner(g){
  var b=g.banner;if(!b||b.t<=0||mode==='title'||!$('#menu').hidden)return;
  ctx.globalAlpha=clamp(b.t*2,0,1);
  var fs=Math.min(S*1.15,W*0.8/Math.max(4,b.text.length*0.55));
  ctx.font=Math.round(fs)+'px "Lilita One",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(5,S*0.14);ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.fillStyle='#fff';
  var y=H*0.3,x=W/2;
  ctx.strokeText(b.text,x,y);ctx.fillText(b.text,x,y);
  if(b.sub){
    ctx.font=Math.round(S*0.55)+'px "Lilita One",system-ui,sans-serif';ctx.lineWidth=Math.max(4,S*0.1);
    ctx.fillStyle=worldOf(g.n).accent;ctx.strokeText(b.sub,x,y+fs*0.85);ctx.fillText(b.sub,x,y+fs*0.85);
  }
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var WDs=G?worldOf(G.n):WORLDS[0];
  var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,WDs.sky[0]);sky.addColorStop(1,WDs.sky[1]);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  var g=G;if(!g)return;
  ctx.save();
  if(g.shake>0)ctx.translate((Math.random()-.5)*g.shake*12,(Math.random()-.5)*g.shake*12);
  drawBg(g);drawIslands(g);drawFlag(g);drawTelegraphs(g);drawSpikes(g);drawJets(g);drawCoins(g);
  g.enemies.forEach(function(e){if(!e.gone){drawEnemy(g,e);drawFrozen(g,e);}});
  drawCrushers(g);drawAxes(g);drawBars(g);drawDrops(g);drawBoss(g);drawPlayer(g);drawShots(g);drawZaps(g);drawEbombs(g);drawEArrows(g);drawWaves(g);drawParts(g);
  ctx.restore();
  drawBanner(g);
}

/* ---------- loop ---------- */
function frame(ts){
  var raw=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  if(G){
    if(G.hitStop>0)G.hitStop-=raw;
    else if(mode==='play'||mode==='title'){
      var sc=1;if(G.slow>0){G.slow-=raw;sc=0.35;}
      update(raw*sc/2);update(raw*sc/2);
    }
    render();hud();
  }
  if(SH.open)drawSheet(ts);
  requestAnimationFrame(frame);
}
resize();
setMuteLabel();
goTitle();
requestAnimationFrame(frame);
})();
</script>
