<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dashcube Knight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-screen portrait canvas, HUD strip pinned to the top, card overlays centered for title / game over / stage clear. Single committed look (bright daytime toy world). */
:root{
  --sky:#62bfe8; --sky-lo:#eaf7e3;
  --grass:#82d65c; --grass-dk:#45a23f; --dirt:#8f5b35;
  --ink:#1c2a39; --coin:#ffc233; --hurt:#ff4d4d; --card:#ffffff; --muted:#5b6b7b;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--sky-lo);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-l,.hud-r{display:flex;align-items:center;gap:8px;min-width:0}
.hud-c{order:3;flex:1 1 100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.hearts{display:flex;gap:2px;font-size:30px;line-height:1;font-variant-emoji:text;color:var(--hurt);text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.hearts .off{color:#fff;opacity:.35}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:18px;line-height:1.3;font-variant-numeric:tabular-nums}
.cdot{width:14px;height:14px;border-radius:50%;background:var(--coin);border:3px solid var(--ink);box-sizing:border-box;flex:none}
.icon{pointer-events:auto;font-family:var(--display);font-size:14px;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.icon:focus-visible,.btn:focus-visible,.item:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.track{width:min(240px,70%);height:14px;background:var(--card);border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-sizing:content-box}
.track i{display:block;height:100%;width:0;background:var(--grass-dk);transition:width .15s linear}
.bossbar{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.bossbar span{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.track.boss{width:min(300px,80%);height:16px}
.track.boss i{background:var(--hurt)}

.hint{position:absolute;left:0;right:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);pointer-events:none;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(28,42,57,.38)}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:18px;width:min(100%,400px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1;text-wrap:balance}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;text-wrap:balance}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;line-height:1.4;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:24px;background:var(--coin);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:9px 18px;cursor:pointer;flex:1 1 auto;min-width:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;font-size:20px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.item{font-family:var(--body);text-align:left;background:#f4f8fb;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.item b{font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:center;gap:6px}
.item small{color:var(--muted);font-size:13px;line-height:1.25}
.item .tag{font-size:13px;font-weight:700}
.item.on{background:var(--coin)}
.item.on small{color:var(--ink)}
.sw{width:16px;height:16px;border:3px solid var(--ink);border-radius:4px;box-sizing:border-box;flex:none}
#sTitle{align-items:flex-end;background:none;padding:0;pointer-events:none}
#sTitle .card{pointer-events:none;background:none;border:0;box-shadow:none;overflow:visible;width:min(100%,460px);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));gap:8px}
.bar{display:flex;gap:8px;align-items:center;pointer-events:auto}
.bar .btn{font-size:18px;padding:8px 10px;flex:1 1 0}
.menu{pointer-events:auto;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
#sTitle h3{font-size:12px}
#sTitle .shop{gap:6px}
#shopC{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding-bottom:4px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#shopC::-webkit-scrollbar{display:none}
#shopC,#shopC .item{touch-action:pan-x}
#sTitle #shopC .item{flex:0 0 96px;scroll-snap-align:start}
.item canvas{position:static;inset:auto;width:52px;height:52px;display:block}
#sTitle .item .wp{display:block;font-size:11px;color:var(--muted);font-weight:700}
#sTitle .item.on .wp{color:var(--ink)}
#sTitle .item{padding:5px 4px;align-items:center;text-align:center}
#sTitle .item b{font-size:14px;justify-content:center;flex-wrap:wrap}
#sTitle .item small{display:none}
#sTitle .item .tag{font-size:11px}
.menu{max-height:58vh;overflow-y:auto}
.wsw{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:104px;display:flex;gap:10px}
.wb{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--card);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.8}
.wb.on{background:var(--coin);opacity:1;box-shadow:0 3px 0 var(--ink)}
.wb canvas{position:static;inset:auto;width:44px;height:44px;display:block}
#sTitle .item .wp{text-align:center}
#msg{min-height:1.2em;font-weight:700;color:var(--hurt);font-size:14px}
</style>

<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-l"><div id="hearts" class="hearts" aria-label="Health"></div></div>
    <div class="hud-r">
      <div class="chip"><b class="cdot"></b><span id="coinN">0</span></div>
      <button id="mute" class="icon" type="button">Sound on</button>
    </div>
    <div class="hud-c">
      <div class="track" id="prog"><i id="progFill"></i></div>
      <div class="bossbar" id="bossBar" hidden><span id="bossName">Boss</span><div class="track boss"><i id="bossFill"></i></div></div>
    </div>
  </div>

  <div class="hint" id="hint" hidden>Tap to dash</div>
  <div class="wsw" id="wsw" hidden></div>

  <section class="screen" id="sTitle">
    <div class="card">
      <div class="menu" id="menu" hidden>
        <div class="shop" id="shopC"></div>
        <div id="msg" role="status"></div>
      </div>
      <div class="bar">
        <div class="chip"><b class="cdot"></b><span id="tCoins">0</span></div>
        <button class="btn alt" id="bC" type="button">Knights</button>
      </div>
    </div>
  </section>

  <section class="screen" id="sOver" hidden>
    <div class="card">
      <h2>Cube down</h2>
      <p id="oText">You made it to stage 1.</p>
      <div class="row"><button class="btn" id="bRetry" type="button">Retry stage</button><button class="btn alt" id="bMenuO" type="button">Knights</button></div>
    </div>
  </section>

  <section class="screen" id="sClear" hidden>
    <div class="card">
      <h2 id="cTitle">Stage clear</h2>
      <p id="cText">The king is down.</p>
      <div class="row"><button class="btn" id="bNext" type="button">Next stage</button><button class="btn alt" id="bMenuC" type="button">Knights</button></div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var INK='#1c2a39', GOLD='#ffc233';
var cv=$('#cv'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,S=44,groundY=0;
var GRAV=24,JUMP=8.5,WALLJ=12;

function resize(){
  var r=cv.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));
  S=Math.max(34,Math.min(60,W/9));
  groundY=H*0.68;
}
window.addEventListener('resize',resize);

/* ---------- data ---------- */
var WEAPONS={
  none:{name:'Headbutt',desc:'Ram them with your helmet.',dmg:1,reach:0,dash:9.5,kb:1,keep:0.55},
  sword:{name:'Sword',desc:'Quick and balanced.',dmg:1,reach:0.95,dash:9.5,kb:1,keep:0.55},
  spear:{name:'Lance',desc:'Long reach, keeps its speed.',dmg:1,reach:2.0,dash:9.2,kb:0.8,keep:0.8},
  hammer:{name:'War Hammer',desc:'Hits for 2, huge knockback.',dmg:2,reach:1.15,dash:8.2,kb:1.5,keep:0.3},
  axe:{name:'Axe',desc:'Hits for 2 and cleaves through two foes.',dmg:2,reach:1.05,dash:9.0,kb:0.9,keep:0.7,through:2},
  knives:{name:'Knives',desc:'Fast dash. Throws a knife each tap.',dmg:1,reach:0.45,dash:10.5,kb:0.6,keep:0.9,shot:'knife',cd:0.28},
  bomb:{name:'Bomb',desc:'Lobs a bomb that blasts a crowd.',dmg:1,reach:0.25,dash:9.2,kb:0.8,keep:0.55,shot:'bomb',cd:0.9},
  gun:{name:'Blunderbuss',desc:'Short-range spread shot.',dmg:1,reach:0.3,dash:8.8,kb:0.8,keep:0.6,shot:'spread',cd:0.8},
  katana:{name:'Katana',desc:'Never stops. Slices through every foe in its path.',dmg:1,reach:1.2,dash:10.5,kb:0.8,keep:0.92,through:99},
  mace:{name:'Mace',desc:'Each hit also smashes foes around the target.',dmg:1,reach:1.0,dash:8.8,kb:1.2,keep:0.5,splash:1.6},
  scythe:{name:'Scythe',desc:'Hits for 2. Wide arc reaches foes above and below.',dmg:2,reach:1.6,dash:8.6,kb:0.7,keep:0.75,tall:1.4},
  bow:{name:'Bow',desc:'Arrows pierce through two foes.',dmg:1,reach:0.3,dash:9.8,kb:0.8,keep:0.6,shot:'arrow',cd:0.45},
  rapier:{name:'Rapier',desc:'Long thrust. Every hit vaults you into the air.',dmg:1,reach:1.5,dash:10.2,kb:0.5,keep:0.95,lunge:6},
  trident:{name:'Trident',desc:'Hits for 2 and launches foes skyward.',dmg:2,reach:1.8,dash:8.8,kb:0.8,keep:0.7,lift:10},
  shuriken:{name:'Shuriken',desc:'Throws two spinning stars per tap.',dmg:1,reach:0.3,dash:10.2,kb:0.6,keep:0.8,shot:'star',cd:0.35},
  crossbow:{name:'Crossbow',desc:'Slow, hard-hitting bolt for 2.',dmg:1,reach:0.3,dash:8.8,kb:0.8,keep:0.6,shot:'bolt',cd:0.8},
  firestaff:{name:'Fire Staff',desc:'Fireball that blasts a crowd on impact.',dmg:1,reach:0.4,dash:9.0,kb:0.8,keep:0.55,shot:'fire',cd:0.85}
};
var CHARS={
  page:{name:'Page',color:'#b98a5a',weapons:['none'],cost:0},
  knight:{name:'Knight',color:'#aab7c4',weapons:['sword','katana'],cost:30},
  lancer:{name:'Lancer',color:'#4a8fe0',weapons:['spear'],cost:40},
  viking:{name:'Viking',color:'#8a6a4a',weapons:['axe','knives','scythe'],cost:60},
  sapper:{name:'Sapper',color:'#3a3f52',weapons:['bomb'],cost:70},
  crusader:{name:'Crusader',color:'#f4f0e6',weapons:['hammer','mace'],cost:90},
  musketeer:{name:'Musketeer',color:'#7a4fb0',weapons:['gun','sword'],cost:110},
  prince:{name:'Prince',color:'#c63a3a',weapons:['sword','spear','bow'],cost:140},
  ranger:{name:'Ranger',color:'#3f8a4a',weapons:['bow','crossbow'],cost:100},
  pirate:{name:'Pirate',color:'#2f6f8f',weapons:['rapier','gun'],cost:120},
  ninja:{name:'Ninja',color:'#2b2f3a',weapons:['shuriken','katana'],cost:150},
  atlantean:{name:'Atlantean',color:'#1f9a9a',weapons:['trident','spear'],cost:160},
  wizard:{name:'Wizard',color:'#6b3fa0',weapons:['firestaff','bomb'],cost:180}
};
var ET={
  walker:{hp:1,w:.65,h:.65,c:'#ee5a5a',coins:1},
  hopper:{hp:1,w:.65,h:.65,c:'#a06cf0',coins:2},
  leaper:{hp:1,w:.65,h:.65,c:'#ff8f2d',coins:2},
  shield:{hp:3,w:.8,h:.8,c:'#6f8aa3',coins:4},
  bomber:{hp:1,w:.65,h:.65,c:'#2d3140',coins:2},
  brute:{hp:5,w:1.1,h:1.1,c:'#8a4a32',coins:6},
  imp:{hp:1,w:.45,h:.45,c:'#ff7ad9',coins:1}
};
var BOSSES=['slam','leap','charger','bomber','summoner'];
function bossType(n){return BOSSES[(n-1)%BOSSES.length];}

var SAVE_KEY='dashcube-knight-v1';
var save={coins:0,best:0,stage:1,chars:['page'],char:'page',mute:false};
try{var raw=JSON.parse(localStorage.getItem(SAVE_KEY));if(raw&&typeof raw==='object')save=Object.assign(save,raw);}catch(e){}
if(!Array.isArray(save.chars)){
  var OLDW={sword:'knight',spear:'lancer',hammer:'crusader'};
  save.chars=['page'];save.char='page';
  if(raw&&Array.isArray(raw.weapons))raw.weapons.forEach(function(w){if(OLDW[w])save.chars.push(OLDW[w]);});
  if(raw&&OLDW[raw.weapon])save.char=OLDW[raw.weapon];
}
save.chars=save.chars.filter(function(k){return CHARS[k];});
if(save.chars.indexOf('page')<0)save.chars.unshift('page');
if(!CHARS[save.char]||save.chars.indexOf(save.char)<0)save.char='page';
if(!save.wsel||typeof save.wsel!=='object')save.wsel={};
function wi(){var a=CHARS[save.char].weapons;return Math.min(save.wsel[save.char]||0,a.length-1);}
function wkey(){return CHARS[save.char].weapons[wi()];}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var shadeCache={};
function shade(hex,a){
  var k=hex+a;if(shadeCache[k])return shadeCache[k];
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,t=a<0?0:255,p=Math.abs(a);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);
  return (shadeCache[k]='rgb('+r+','+g+','+b+')');
}

var ac=null;
function beep(f,d,type,vol,slide){
  if(save.mute)return;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- stage building ---------- */
function mkEnemy(type,x,y,rnd){
  var t=ET[type];
  return {type:type,x:x,y:y,vx:0,vy:0,hp:t.hp,maxhp:t.hp,w:t.w,h:t.h,color:t.c,coins:t.coins,grounded:true,
    state:'idle',st:0,hopT:rnd()*1.2,period:1+rnd()*0.8,power:6.5+rnd()*3.8,hitCd:0,chainCd:0,flash:0,
    fuse:-1,dying:false,dyT:0,rot:0,gone:false,phase:rnd()*6,axeCd:0};
}
function buildStage(n){
  var rnd=mulberry32(4242+n*131),TH=4.2;
  var st={n:n,islands:[],blocks:[],solids:[],spikes:[],crushers:[],axes:[],enemies:[],arenaX:0,arenaEnd:0,arenaTop:0};
  var diff=Math.min(n,10);
  var kinds=['walker','walker','hopper','hopper','leaper'];
  if(n>=2)kinds.push('shield','bomber','imp');
  if(n>=3)kinds.push('brute');
  if(n>=4)kinds.push('shield','leaper','hopper','imp');
  var pick=function(){return kinds[Math.floor(rnd()*kinds.length)];};
  var pats=[['cluster',4],['single',2],['steps',2],['spikes',2],['crusher',2],['swarm',2],['long',3]];
  if(n>=2)pats.push(['axe',2],['bombs',2]);
  if(n>=3)pats.push(['brutes',2]);
  var sub=['cluster','swarm','spikes','crusher','single'];
  if(n>=2)sub.push('axe','bombs','cluster');
  if(n>=3)sub.push('brutes');
  var total=0;pats.forEach(function(p){total+=p[1];});
  var choose=function(){var r=rnd()*total;for(var i=0;i<pats.length;i++){r-=pats[i][1];if(r<=0)return pats[i][0];}return 'cluster';};
  var isle=function(x0,w,t){st.islands.push({x0:x0,x1:x0+w,y0:t-TH,y1:t,top:t,kind:'isle'});};
  var gap=function(){return 1.2+Math.pow(rnd(),1.3)*2.6+Math.min(diff,6)*0.05;};
  var sn=function(v){return Math.round(v*2)/2;};
  var L=62+Math.min(n,8)*7,x=9,top=0,prev='',pat,i;
  var put=function(pat,ix,top){
    var w=2,i;
    if(pat==='cluster'){
      var c=Math.min(8,3+Math.floor(rnd()*(2+diff*0.5))),sp=1.1+rnd()*0.4;
      for(i=0;i<c;i++)st.enemies.push(mkEnemy(pick(),ix+i*sp,top,rnd));
      w=c*sp;
    }else if(pat==='swarm'){
      var m=5+Math.floor(rnd()*3);
      for(i=0;i<m;i++)st.enemies.push(mkEnemy('imp',ix+i*0.75,top,rnd));
      w=m*0.75+0.5;
    }else if(pat==='brutes'){
      st.enemies.push(mkEnemy('brute',ix+1,top,rnd),mkEnemy('walker',ix+2.6,top,rnd),mkEnemy('walker',ix+3.8,top,rnd));
      if(rnd()<0.5)st.enemies.push(mkEnemy('brute',ix+5.4,top,rnd));
      w=6.5;
    }else if(pat==='single'){
      var t=['hopper','leaper'];if(n>=2)t.push('shield');
      st.enemies.push(mkEnemy(t[Math.floor(rnd()*t.length)],ix+1,top,rnd));w=2;
    }else if(pat==='spikes'){
      var sc=1+Math.floor(rnd()*2);
      st.spikes.push({x0:ix,x1:ix+sc,y:top});w=sc;
      if(rnd()<0.6){st.enemies.push(mkEnemy('walker',ix+sc+1.3,top,rnd));w=sc+1.8;}
    }else if(pat==='crusher'){

      o.chainCd=0.25;h.chainCd=0.15;
      hurtEnemy(g,o,1);
      o.vx=(h.vx>0?1:-1)*Math.max(5,Math.abs(h.vx)*0.85);o.vy=Math.max(o.vy,2.5);
      h.vx*=0.4;
      g.shake=Math.min(1,g.shake+0.12);
      burst(g,(h.x+o.x)/2,o.y+o.h/2,o.color,4,4);
      beep(240+Math.random()*80,.07,'square',.05,.6);
    }
  }
}
function bossLand(g,b){
  var p=g.p;
  g.shake=Math.min(1.4,g.shake+0.9);g.hitStop=Math.max(g.hitStop,0.06);
  burst(g,b.x,b.y+0.1,'#ffffff',16,6);
  beep(60,.4,'sawtooth',.1,.4);
  if(b.type==='slam'){
    g.waves.push({x:b.x-b.w/2,dir:-1,life:0.9},{x:b.x+b.w/2,dir:1,life:0.9});
  }
  if(Math.abs(p.x-b.x)<b.w/2+(b.type==='slam'?0.9:1.4)&&p.y<b.y+1.0)hurtPlayer(g,1,p.x<b.x?-1:1);
  if(b.type==='leap'&&!b.minions&&b.hp<=b.maxhp/2){
    b.minions=true;
    g.enemies.push(mkEnemy('walker',g.stg.arenaX+5,g.stg.arenaTop,Math.random),mkEnemy('walker',g.stg.arenaX+6.4,g.stg.arenaTop,Math.random));
  }
  b.state='daze';b.st=1.6;
}
function updBoss(g,dt){
  var b=g.boss,p=g.p;
  if(!b||b.state==='dead')return;
  b.hitCd-=dt;b.flash-=dt;b.phase+=dt;
  b.vy-=GRAV*dt;b.y+=b.vy*dt;b.x+=b.vx*dt;
  if(b.y<=g.stg.arenaTop&&b.vy<=0){b.y=g.stg.arenaTop;b.vy=0;b.vx=0;if(b.airborne){b.airborne=false;bossLand(g,b);}}
  if(b.state==='dying'){
    b.st-=dt;
    if(Math.random()<0.5)burst(g,b.x+(Math.random()-.5)*b.w,b.y+Math.random()*b.h,Math.random()<.5?'#ffc233':'#ff4d4d',3,6);
    if(b.st<=0){b.state='dead';b.dead=true;}
    g.ebombs.length=0;
    return;
  }
  if(p.x<g.stg.arenaX-3)return;
  if(b.type==='charger'||b.type==='bomber'||b.type==='summoner')updBoss2(g,b,dt);
  else if(b.state==='idle'){
    b.st-=dt;
    if(b.st<=0){b.state='tele';b.st=0.7;b.tx=clamp(p.x+(b.type==='slam'?2.9:2.5),g.stg.arenaX+2,g.stg.arenaEnd-2);beep(300,.25,'sawtooth',.05,.5);}
  }else if(b.state==='tele'){
    b.st-=dt;
    if(b.st<=0){var T=b.type==='slam'?1.05:0.8;b.vy=GRAV*T/2;b.vx=(b.tx-b.x)/T;b.state='air';b.airborne=true;}
  }else if(b.state==='daze'){
    b.st-=dt;
    if(b.st<=0){b.state='idle';b.st=0.8+0.9*(b.hp/b.maxhp);}
  }
  // body contact and solid push
  if(!p.dead&&b.state!=='dying'){
    var ox=Math.abs(p.x-b.x)<(p.w+b.w)/2-0.1,oy=p.y<b.y+b.h-0.2&&p.y+p.h>b.y+0.1;
    if(ox&&oy&&b.state!=='daze'&&b.state!=='ret'&&p.invul<=0)hurtPlayer(g,1,p.x<b.x?-1:1);
    var lim=b.x-(p.w+b.w)/2+0.1;
    if(p.x>lim&&p.y<b.y+b.h-0.1&&b.state!=='charge'){p.x=lim;if(p.vx>0)p.vx=0;}
  }
}

function updBoss2(g,b,dt){
  var p=g.p,A=g.stg,ph2=b.hp<=b.maxhp/2,i,e,o;
  if(b.type==='charger'){
    if(b.state==='idle'){b.st-=dt;if(b.st<=0){b.state='tele';b.st=ph2?0.6:0.9;b.dir=-1;b.tx=A.arenaX+1.6;beep(260,.3,'sawtooth',.05,.5);}}
    else if(b.state==='tele'){b.st-=dt;if(b.st<=0){b.state='charge';b.cx=(ph2?17:14)*b.dir;}}
    else if(b.state==='charge'){
      b.x+=b.cx*dt;
      if(Math.random()<0.6)burst(g,b.x+b.w/2,b.y+0.1,'#d9c9a8',2,3);
      var fx=b.x+b.dir*b.w/2,hit=null,bl=A.blocks;
      for(i=0;i<bl.length;i++){o=bl[i];if(fx<=o.x1&&b.x>o.x0){hit=o;break;}}
      if(hit||fx<=A.arenaX+0.3){
        if(hit){A.blocks.splice(A.blocks.indexOf(hit),1);A.solids.splice(A.solids.indexOf(hit),1);burst(g,hit.x1,hit.y0+1.2,'#9aa7b3',18,7);}
        b.x=Math.max(b.x,A.arenaX+b.w/2+0.3);b.cx=0;b.state='daze';b.st=ph2?2.4:3.0;
        g.shake=Math.min(1.4,g.shake+1);g.hitStop=Math.max(g.hitStop,0.08);beep(60,.4,'sawtooth',.1,.4);
        burst(g,fx,b.y+0.6,'#ffffff',14,6);
        for(i=0;i<8&&A.blocks.length<3;i++){
          var nx=A.arenaX+3+Math.random()*(A.arenaEnd-A.arenaX-8);
          if(Math.abs(p.x-nx)>2.2&&Math.abs(b.x-nx)>b.w/2+1.6){var nb={x0:nx,x1:nx+1.2,y0:A.arenaTop,y1:A.arenaTop+2.4,kind:'block'};A.blocks.push(nb);A.solids.push(nb);}
        }
      }
    }
    else if(b.state==='daze'){b.st-=dt;if(b.st<=0){var T=0.9;b.state='ret';b.vy=GRAV*T/2;b.vx=(A.arenaX+16.5-b.x)/T;}}
    else if(b.state==='ret'){if(b.vy===0&&b.vx===0){b.state='idle';b.st=0.6+0.8*(b.hp/b.maxhp);}}
  }else if(b.type==='bomber'){
    if(b.state==='idle'){b.st-=dt;if(b.st<=0){b.state='volley';b.n=ph2?7:4;b.t=0.3;}}
    else if(b.state==='volley'){
      b.t-=dt;
      if(b.t<=0&&b.n>0){
        b.n--;b.t=ph2?0.38:0.55;
        var tx=clamp(p.x+clamp(p.vx,0,5)*0.5+(Math.random()-.5)*1.6,A.arenaX+0.8,A.arenaEnd-1.2),T2=1.0,y0=b.y+b.h*0.8;
        g.ebombs.push({x:b.x-0.6,y:y0,vx:(tx-(b.x-0.6))/T2,vy:(A.arenaTop-y0)/T2+GRAV*T2/2,tx:tx,t:0});
        beep(240,.12,'triangle',.06,1.4);
      }
      if(b.n<=0&&b.t<=0){b.state='wait';b.st=1.2;}
    }
    else if(b.state==='wait'){b.st-=dt;if(b.st<=0){b.state='daze';b.st=2.8;}}
    else if(b.state==='daze'){b.st-=dt;if(b.st<=0){b.state='idle';b.st=0.8+0.8*(b.hp/b.maxhp);}}
  }else if(b.type==='summoner'){
    if(b.state==='idle'){b.st-=dt;if(b.st<=0){b.state='tele';b.st=1.0;beep(200,.5,'sine',.06,.6);}}
    else if(b.state==='tele'){
      b.st-=dt;
      if(b.st<=0){
        var cnt=ph2?5:3,pool=ph2?['leaper','hopper','shield','bomber']:['walker','hopper','leaper'],x0=A.arenaX+3,span=b.x-2.8-x0;
        for(i=0;i<cnt;i++){
          e=mkEnemy(pool[Math.floor(Math.random()*pool.length)],x0+i*span/cnt,A.arenaTop+4,Math.random);
          e.summoned=true;e.grounded=false;g.enemies.push(e);burst(g,e.x,A.arenaTop+4,'#b07aff',8,4);
        }
        b.state='adds';b.t=0;beep(120,.4,'sawtooth',.07,.5);
      }
    }
    else if(b.state==='adds'){
      b.t+=dt;
      var alive=g.enemies.some(function(q){return q.summoned&&!q.gone&&!q.dying;});
      if(!alive||b.t>16){b.state='daze';b.st=2.8;floatText(g,b.x,b.y+b.h+0.6,'Shield down!','#b07aff');beep(700,.2,'triangle',.07,.8);}
    }
    else if(b.state==='daze'){b.st-=dt;if(b.st<=0){b.state='idle';b.st=0.6+0.6*(b.hp/b.maxhp);}}
  }
}
function updEbombs(g,dt){
  var p=g.p,i,s;
  for(i=g.ebombs.length-1;i>=0;i--){
    s=g.ebombs[i];s.t+=dt;s.vy-=GRAV*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if((s.vy<0&&s.y<=g.stg.arenaTop+0.1)||(!p.dead&&Math.abs(s.x-p.x)<0.4&&Math.abs(s.y-(p.y+0.3))<0.45)){
      explode(g,s.x,Math.max(s.y,g.stg.arenaTop+0.2),false);g.ebombs.splice(i,1);
    }
  }
}

/* ---------- main update ---------- */
function update(dt){
  var g=G,p=g.p,stg=g.stg,wp=WEAPONS[wkey()],i,e;
  g.time+=dt;g.tapCd-=dt;g.fireCd-=dt;if(p.thrust>0)p.thrust-=dt;
  if(g.banner&&g.banner.t>0)g.banner.t-=dt;
  g.shake=Math.max(0,g.shake-dt*2.2);

  // player physics
  var fx=p.x,fy=p.y,was=p.grounded,pox=p.x,land=stepY(g,p,dt);
  p.x+=p.vx*dt;p.invul-=dt;p.wallCd-=dt;
  // enemy heads and crusher slabs are platforms: land on them like cubes
  var onE=false;
  if(!land&&p.vy<=0&&!p.dead){
    var best=-1e9,et;
    for(i=0;i<g.enemies.length;i++){
      e=g.enemies[i];
      if(e.gone||e.dying)continue;
      et=ehTop(e);
      if(Math.abs(p.x-e.x)<(p.w+e.w)/2-0.08&&fy>=et-0.3-Math.max(0,e.vy)*dt&&p.y<=et&&et>best){best=et;onE=true;}
    }
    stg.crushers.forEach(function(c){
      var stt=c.y+crusherBH(c,g.time)+1.6;
      if(Math.abs(p.x-c.x)<c.w/2+p.w/2-0.08&&fy>=stt-0.3&&p.y<=stt&&stt>best){best=stt;onE=true;}
    });
    if(onE){p.y=best;land=true;burst(g,p.x,p.y,'#ffffff',3,3);beep(380,.05,'triangle',.04,1.4);}
  }
  if(land){
    var fo=onE?null:floorAt.o;
    if(!was&&p.vy<-5)puff(g,p.x,p.y,'#ffffff',5);
    p.vy=0;p.grounded=true;
    if(fo){g.floorY=fo.y1;if(fo.kind==='isle'&&!p.dead&&p.x>fo.x0+0.8&&p.x<fo.x1-0.8)p.lastSafe={x:p.x,y:p.y};}
  }else p.grounded=false;
  p.vx*=Math.exp(-(p.grounded?6:2.6)*dt);
  var wh=solidPush(g,p,pox);p.climb-=dt;
  if(wh&&!p.dead){
    if(wh===1){p.vx=p.climb>0?3:0;}
    else if(p.vx<0)p.vx=0;
  }
  if(p.grounded&&!p.dead&&!g.wait){p.vy=JUMP;p.grounded=false;puff(g,p.x,p.y,'#ffffff',2);}
  if(g.wait){p.x=fx;p.y=fy;p.vx=0;p.vy=0;p.grounded=true;}
  var minX=Math.max(-1.2,g.leftLock);
  if(p.x<minX){p.x=minX;if(p.vx<0)p.vx=0;}
  if(p.x>stg.arenaEnd-0.6){p.x=stg.arenaEnd-0.6;if(p.vx>0)p.vx*=-0.2;}
  if(!g.arena&&p.x>stg.arenaX+1.5){
    g.arena=true;g.leftLock=stg.arenaX+0.4;g.banner={t:2.4,text:g.boss.name};
    beep(90,.5,'sawtooth',.07,.5);
  }
  if(p.dead)p.rot+=dt*8;
  if(p.y<-5&&!p.dead){
    p.hp-=1;g.shake=0.6;beep(140,.3,'sawtooth',.06,.4);
    if(p.hp<=0){killPlayer(g);p.vy=0;}
    else{p.x=p.lastSafe.x;p.y=p.lastSafe.y+0.2;p.vx=0;p.vy=0;p.invul=1.3;g.floorY=p.lastSafe.y;}
  }

  // enemies
  for(i=0;i<g.enemies.length;i++)updEnemy(g,g.enemies[i],dt);
  playerAttack(g,wp);
  chainHits(g);

  // player vs enemies: static ones are solid, airborne hoppers and leapers hurt
  if(!p.dead){
    for(i=0;i<g.enemies.length;i++){
      e=g.enemies[i];
      if(e.gone||e.dying)continue;
      var ox=Math.abs(p.x-e.x)<(p.w+e.w)/2-0.1,oy=p.y<ehTop(e)-0.3&&p.y+p.h>e.y+0.1;
      if(!ox||!oy)continue;
      var danger=((e.type==='hopper'||e.type==='imp')&&!e.grounded)||(e.type==='leaper'&&e.state==='air');
      if(danger&&p.invul<=0)hurtPlayer(g,1,p.x<e.x?-1:1);
      else if(p.x<e.x){p.x=e.x-(p.w+e.w)/2+0.1;if(p.vx>0)p.vx=0;}
    }
  }

  // spikes
  stg.spikes.forEach(function(s){
    g.enemies.forEach(function(en){
      if(en.gone)return;
      if(en.y<s.y+0.4&&en.y>s.y-0.8&&en.x>s.x0-0.1&&en.x<s.x1+0.1){if(en.dying){en.gone=true;burst(g,en.x,s.y+0.3,en.color,8,4);}else killEnemy(g,en,false);}
    });
    if(!p.dead&&p.y<s.y+0.35&&p.y>s.y-0.8&&p.x>s.x0-0.25&&p.x<s.x1+0.25)hurtPlayer(g,1,-1);
  });
  // crushers
  stg.crushers.forEach(function(c){
    var bh=crusherBH(c,g.time);
    if(bh>0.6)return;
    g.enemies.forEach(function(en){
      if(en.gone)return;
      var rel=en.y-c.y;
      if(Math.abs(en.x-c.x)<c.w/2+en.w*0.3&&rel<bh+1.6&&rel>-1){if(en.dying){en.gone=true;burst(g,en.x,en.y+0.4,en.color,8,4);}else killEnemy(g,en,false);}
    });
  });
  // crusher slabs are solid walls: blocked from the side, crushed if one lands on you, then shoved out to the nearest side so you can never get stuck inside
  stg.crushers.forEach(function(c){
    if(p.dead)return;
    var bh=crusherBH(c,g.time),sb=c.y+bh,stt=sb+1.6,hw=c.w/2+p.w/2,dx=p.x-c.x;
    if(Math.abs(dx)>=hw||p.y>=stt-0.12||p.y+p.h<=sb+0.02)return;
    if(Math.abs(dx)<c.w/2+p.w*0.1)hurtPlayer(g,1,dx<0?-1:1);
    if(dx<0){p.x=c.x-hw;if(p.vx>0)p.vx=0;}else{p.x=c.x+hw;if(p.vx<0)p.vx=0;}
  });
  // axes
  stg.axes.forEach(function(a){
    var bp=axePos(a,g.time),R=0.62;
    g.enemies.forEach(function(en){
      if(en.gone||en.dying||en.axeCd>0)return;
      if(circRect(bp.x,bp.y,R,en.x-en.w/2,en.y,en.w,en.h)){
        en.axeCd=0.5;hurtEnemy(g,en,1);en.vx=bp.dir*9;en.vy=Math.max(en.vy,3);
        burst(g,bp.x,bp.y,'#dfe8ef',5,4);beep(200,.08,'square',.05,.5);
      }
    });
    if(!p.dead&&circRect(bp.x,bp.y,R,p.x-p.w/2,p.y,p.w,p.h))hurtPlayer(g,1,p.x<bp.x?-1:1);
  });
  // shockwaves
  for(i=g.waves.length-1;i>=0;i--){
    var wv=g.waves[i];
    wv.x+=wv.dir*8*dt;wv.life-=dt;
    if(!p.dead&&Math.abs(wv.x-p.x)<0.6&&p.y<stg.arenaTop+0.45)hurtPlayer(g,1,wv.dir);
    if(wv.life<=0)g.waves.splice(i,1);
  }
  updBoss(g,dt);
  updEbombs(g,dt);
  updShots(g,dt);

  // cleanup
  g.enemies=g.enemies.filter(function(en){return !en.gone;});
  for(i=g.parts.length-1;i>=0;i--){
    var pt=g.parts[i];pt.t+=dt;pt.vy-=18*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;
    if(pt.t>pt.life)g.parts.splice(i,1);
  }
  for(i=g.texts.length-1;i>=0;i--){g.texts[i].t+=dt;if(g.texts[i].t>0.9)g.texts.splice(i,1);}

  // camera
  var viewW=W/S,target=clamp(p.x-2.8,0,Math.max(0,stg.arenaEnd+1.2-viewW));
  if(g.arena)target=Math.max(target,g.leftLock-0.6);
  g.cam+=(target-g.cam)*(1-Math.exp(-8*dt));
  var ty=clamp(Math.min(g.floorY,p.y+2.5),-2,9);g.camY+=(ty-g.camY)*(1-Math.exp(-4*dt));

  if(g.end){g.end.t-=dt;if(g.end.t<=0){var k=g.end.kind;g.end=null;endRun(k);}}
}

/* ---------- input ---------- */
function dash(){
  if(mode!=='play'||!G)return;
  var g=G,p=g.p;
  if(p.dead||g.tapCd>0)return;
  g.tapCd=0.08;
  if(g.wait){g.wait=false;show('#none');}
  var wp=WEAPONS[wkey()];
  if(nearWall(g,p)){
    p.vy=WALLJ;p.vx=3;p.climb=0.7;p.grounded=false;
    burst(g,p.x+p.w/2,p.y+0.3,'#ffffff',5,3);beep(420,.09,'triangle',.05,1.7);
    $('#hint').hidden=true;return;
  }
  p.vx=wp.dash;p.thrust=0.22;
  if(wp.shot&&g.fireCd<=0){fire(g,wp.shot);g.fireCd=wp.cd;}
  beep(300,.07,'triangle',.05,1.6);
  puff(g,p.x-0.3,p.y,'#ffffff',3);
  $('#hint').hidden=true;
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();dash();});
window.addEventListener('keydown',function(e){
  if(e.code==='KeyQ'&&!e.repeat)cycleW();
  if(e.code==='Space'||e.code==='ArrowRight'||e.code==='KeyD'){
    if(mode==='play'){e.preventDefault();if(!e.repeat)dash();}
  }
});

/* ---------- screens, shop, hud ---------- */

function endRun(kind){

  }else{
    $('#oText').textContent='You fell on stage '+g.n+' and banked '+g.coins+' coins on the way.';
    $('#bRetry').textContent='Retry stage '+g.n;

}
function goTitle(){beginPlay(save.stage);}

function setW(i){save.wsel[save.char]=i;persist();renderSwitch();beep(520,.05,'triangle',.04,1.3);}
function cycleW(){var a=CHARS[save.char].weapons;if(a.length>1&&G&&(mode==='play'||mode==='title'))setW((wi()+1)%a.length);}

function say(t){var m=$('#msg');m.textContent=t;clearTimeout(say.t);say.t=setTimeout(function(){m.textContent='';},2200);}
function renderShop(){
  $('#tCoins').textContent=save.coins;
  var box=$('#shopC'),sl=box.scrollLeft;box.innerHTML='';
  Object.keys(CHARS).forEach(function(key){
    var d=CHARS[key],owned=save.chars.indexOf(key)>=0,eq=save.char===key;

    b.type='button';b.className='item'+(eq?' on':'');
