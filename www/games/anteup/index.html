      if (!inDeck) status = inHandIds.has(card.id) ? "hand" : "used";
      row.appendChild(DeckMiniCard(card, status, inDeck));
    });
    section.appendChild(row);
    grid.appendChild(section);
  });

  overlay.appendChild(grid);

  const backRow = document.createElement("div");
  backRow.className = "deck-modal-back-row";
  const backBtn = document.createElement("button");
  backBtn.className = "deck-modal-back-btn";
  backBtn.textContent = "Back";
  backBtn.onclick = () => {
    state.deckOverlayOpen = false;
    render();
  };
  backRow.appendChild(backBtn);
  overlay.appendChild(backRow);

  return overlay;
}

/* ============================== FLIP ANIMATION HELPERS ==============================
   Captures on-screen positions of hand cards before a re-render, then after the new
   DOM is built, replays the movement from old->new position (FLIP technique) so cards
   glide to their new spot instead of snapping. Cards with no prior position (newly
   dealt) get a deal-in entrance instead. */
function captureCardRects() {
  const rects = {};
  document.querySelectorAll(".hand-fan .card[data-card-id]").forEach((el) => {
    rects[el.dataset.cardId] = el.getBoundingClientRect();
  });
  return rects;
}
function applyCardFlip(oldRects, isFullDeal) {
  const DEAL_STAGGER_MS = 70; // gap between each card's dealing animation start
  const DEAL_DURATION_MS = 420;

  document.querySelectorAll(".hand-fan .card[data-card-id]").forEach((el) => {
    const id = el.dataset.cardId;
    const finalTransform = el.dataset.finalTransform || "";
    const old = oldRects[id];
    if (old) {
      const newRect = el.getBoundingClientRect();
      const dx = old.left - newRect.left;
      const dy = old.top - newRect.top;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px) ${finalTransform}`;
        void el.offsetWidth; // force reflow so the "from" state is committed
        requestAnimationFrame(() => {
          el.style.transition = "transform .38s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, opacity .28s ease";
          el.style.transform = finalTransform;
        });
      }
    } else if (isFullDeal) {
      // Fresh blind: cards fly in one-by-one from an imaginary deck above the
      // table, like they're being dealt out, instead of all popping in at once.
      const dealIndex = parseInt(el.dataset.dealIndex || "0", 10);
      const delay = dealIndex * DEAL_STAGGER_MS;
      const fromTransform = `translateY(-220px) translateX(${dealIndex % 2 === 0 ? -18 : 18}px) rotate(${dealIndex % 2 === 0 ? -30 : 30}deg) scale(.7)`;

      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = fromTransform;
      el.style.zIndex = 50 + dealIndex;
      void el.offsetWidth;

      setTimeout(() => {
        el.style.transition = `transform ${DEAL_DURATION_MS}ms cubic-bezier(.16,.9,.3,1), opacity .18s ease`;
        el.style.opacity = "1";
        el.style.transform = finalTransform;
        el.classList.remove("card-dealing");
        void el.offsetWidth;
        el.classList.add("card-dealing");
        setTimeout(() => {
          // restore the normal transition + stacking so hover/select feel right again
          el.style.transition = "transform .38s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, opacity .28s ease";
          el.style.zIndex = el.dataset.finalZ || el.style.zIndex;
        }, DEAL_DURATION_MS);
      }, delay);
    } else {
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = `translateY(80px) scale(.8) ${finalTransform}`;
      void el.offsetWidth;
      requestAnimationFrame(() => {
        el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1), opacity .4s ease, box-shadow .18s ease";
        el.style.opacity = "1";
        el.style.transform = finalTransform;
      });
    }
  });
}

/* ============================== MAIN RENDER ============================== */
function render() {
  if (state.deckOverlayOpen && state.overlay !== "playing" && state.overlay !== "shop") state.deckOverlayOpen = false;
  const oldCardRects = captureCardRects();
  const app = document.getElementById("app");
  app.innerHTML = "";

  const fanLayout = computeFanLayout();
  const cardScale = fanLayout.scale;
  const fanOverlapPx = fanLayout.overlap * fanLayout.scale;
  const target = targetForAnte(state.ante, state.blindIdx);

  // ===== MENU (top right) =====
  const menuWrap = document.createElement("div");
  menuWrap.className = "menu-wrap";
  const menuBtn = document.createElement("button");
  menuBtn.className = "menu-btn";
  menuBtn.textContent = "☰";
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    state.menuOpen = !state.menuOpen;
    state.confirmingReset = false;
    render();
  };
  menuWrap.appendChild(menuBtn);
  if (state.menuOpen) {
    const dropdown = document.createElement("div");
    dropdown.className = "menu-dropdown";
    const resetBtn = document.createElement("button");
    resetBtn.className = "menu-dropdown-item";
    resetBtn.textContent = state.confirmingReset ? "Click again to confirm" : "Reset Run";
    resetBtn.style.color = state.confirmingReset ? "#E8A8A8" : "";
    resetBtn.onclick = (e) => {
      e.stopPropagation();
      if (!state.confirmingReset) {
        state.confirmingReset = true;
        render();
      } else {
        state.confirmingReset = false;
        state.menuOpen = false;
        resetRun();
      }
    };
    dropdown.appendChild(resetBtn);
    menuWrap.appendChild(dropdown);
  }
  app.appendChild(menuWrap);

  // ===== HEADER =====
  const header = document.createElement("div");
  header.className = "header";

  const left = document.createElement("div");
  left.innerHTML = `
    <div class="blind-label">ANTE ${state.ante} · ${BLIND_TYPES[state.blindIdx].label.toUpperCase()}</div>
    ${state.bossBlind ? `<div class="boss-blind-name serif${state.bossBlind.isFinal ? " boss-blind-final" : ""}" title="${state.bossBlind.desc}">${state.bossBlind.isFinal ? '<span class="boss-blind-final-tag">FINAL BOSS</span>' : ""}${state.bossBlind.name}</div><div class="boss-blind-desc">${state.bossBlind.desc}</div>` : ""}
    <div class="score-line serif">${state.roundScore.toLocaleString()} <span class="score-target">/ ${target.toLocaleString()}</span></div>
  `;
  const progressTrack = document.createElement("div");
  progressTrack.className = "progress-track";
  const progressFill = document.createElement("div");
  progressFill.className = "progress-fill";
  progressFill.style.width = `${Math.min(100, (state.roundScore / target) * 100)}%`;
  progressTrack.appendChild(progressFill);
  left.appendChild(progressTrack);
  header.appendChild(left);

  const statsRow = document.createElement("div");
  statsRow.className = "stats-row";
  statsRow.appendChild(Stat("Plays", state.playsLeft, "#3FA9A0"));
  statsRow.appendChild(Stat("Discards", state.discardsLeft, "#A23B3B"));
  statsRow.appendChild(Stat("$", state.money, "#C9A227"));
  if (state.runMultiplier !== 1) {
    statsRow.appendChild(Stat("Run Mult", `x${state.runMultiplier}`, "#A23B3B"));
  }
  if (state.nextHandChipBonus > 0) {
    statsRow.appendChild(Stat("Next Chips", `+${state.nextHandChipBonus}`, "#3FA9A0"));
  }
  if (state.nextHandDoubleChips) {
    statsRow.appendChild(Stat("Next Chips", "x2", "#4F7FBF"));
  }
  if (state.nextHandDoubleMult) {
    statsRow.appendChild(Stat("Next Mult", "x2", "#C9A227"));
  }
  if (state.nextHandMultX !== 1) {
    statsRow.appendChild(Stat("Next Mult", `x${state.nextHandMultX.toFixed(2)}`, "#C9574A"));
  }
  if (state.nextHandRetrigger) {
    statsRow.appendChild(Stat("Retrigger", "Yes", "#B05FA0"));
  }
  if (state.nextHandBalance) {
    statsRow.appendChild(Stat("Balanced", "Yes", "#9B8B6A"));
  }
  header.appendChild(statsRow);

  app.appendChild(header);

  // ===== PREVIEW BAR =====
  const previewBar = document.createElement("div");
  previewBar.className = "preview-bar";
  const selectedCards = state.hand.filter((c) => state.selected.includes(c.id));
  const previewBase = evaluateSelection(selectedCards);
  const preview = previewBase ? (() => {
    const r = applyBossBlindScoringEffects(
      applyCharmEffects(
        applyItemEffects(previewBase, previewBase.scoringCards, state.items),
        previewBase.scoringCards,
        state.charms
      ),
      previewBase.scoringCards
    );
    const chipsWithFortune = r.totalChips + state.nextHandChipBonus;
    const chips = state.nextHandDoubleChips ? chipsWithFortune * 2 : chipsWithFortune;
    return { ...r, totalChips: chips, score: Math.round(chips * r.totalMult * state.runMultiplier) };
  })() : null;
  if (preview) {
    const nameEl = document.createElement("div");
    nameEl.className = "preview-name serif";
    nameEl.textContent = preview.name;
    previewBar.appendChild(nameEl);
    previewBar.appendChild(ChipPill("chips", preview.totalChips, "#3FA9A0"));
    const x = document.createElement("span");
    x.style.color = "#9A917A";
    x.textContent = "×";
    previewBar.appendChild(x);
    previewBar.appendChild(ChipPill("mult", preview.totalMult, "#C9A227"));
    const eq = document.createElement("span");
    eq.style.color = "#9A917A";
    eq.textContent = "=";
    previewBar.appendChild(eq);
    const scoreEl = document.createElement("span");
    scoreEl.className = "serif";
    scoreEl.style.fontSize = "22px";
    scoreEl.style.fontWeight = "700";
    scoreEl.textContent = preview.score;
    previewBar.appendChild(scoreEl);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "preview-placeholder";
    placeholder.textContent = "Select cards to preview your hand";
    previewBar.appendChild(placeholder);
  }
  app.appendChild(previewBar);

  const spacer = document.createElement("div");
  spacer.className = "spacer";
  app.appendChild(spacer);

  if (state.bossBlindMessage) {
    const toast = document.createElement("div");
    toast.className = "boss-blind-toast";
    toast.textContent = state.bossBlindMessage;
    app.appendChild(toast);
  }

  // ===== BOTTOM BAR =====
  const bottomBar = document.createElement("div");
  bottomBar.className = "bottom-bar";

  const wasFullDeal = state.dealAnim;
  const handFan = document.createElement("div");
  handFan.className = "hand-fan";
  state.dealAnim = false;
  handFan.style.padding = `${Math.round(6 * cardScale)}px 8px 6px`;
  handFan.style.minHeight = Math.round(170 * cardScale) + "px";

  const sortedHand = getSortedHand();
  sortedHand.forEach((card, i) => {
    const cardEl = renderCard(card, {
      selected: state.selected.includes(card.id),
      scoring: state.scoringIds.includes(card.id),
      dimmed: state.scoringIds.length > 0 && !state.scoringIds.includes(card.id),
      scale: cardScale,
      marginLeft: i === 0 ? 0 : -Math.round(fanOverlapPx),
      arcIndex: i,
      arcCount: sortedHand.length,
      onClick: () => toggleSelect(card.id),
    });
    cardEl.dataset.dealIndex = i;
    handFan.appendChild(cardEl);
  });
  bottomBar.appendChild(handFan);

  const actionsRow = document.createElement("div");
  actionsRow.className = "actions-row";

  actionsRow.appendChild(
    ActionButton("Discard", `${state.discardsLeft} left`, "#A23B3B", false, discard, state.selected.length === 0 || state.discardsLeft === 0, cardScale)
  );
  actionsRow.appendChild(
    ActionButton("Play Hand", `${state.playsLeft} left`, "#C9A227", true, playHand, state.selected.length === 0 || state.playsLeft === 0, cardScale)
  );
  bottomBar.appendChild(actionsRow);

  const subRow = document.createElement("div");
  subRow.className = "sub-controls-row";

  if (state.overlay === "playing") {
    subRow.appendChild(renderDeckWidget());
  } else {
    subRow.appendChild(document.createElement("div"));
  }

  const sortWrap = document.createElement("div");
  sortWrap.className = "sort-toggle-wrap";
  sortWrap.innerHTML = `<div class="sort-toggle-label" style="font-size:${Math.round(7 * cardScale)}px">Sort</div>`;
  const sortToggle = document.createElement("div");
  sortToggle.className = "sort-toggle";
  ["rank", "suit", "manual"].forEach((key) => {
    const opt = document.createElement("button");
    opt.className = "sort-opt" + (state.sortMode === key ? " active" : "");
    opt.style.fontSize = Math.round(8.5 * cardScale) + "px";
    opt.style.padding = `${Math.round(4.5 * cardScale)}px ${Math.round(7 * cardScale)}px`;
    opt.textContent = key === "rank" ? "Rank" : key === "suit" ? "Suit" : "Move";
    opt.onclick = () => setSortMode(key);
    sortToggle.appendChild(opt);
  });
  sortWrap.appendChild(sortToggle);
  subRow.appendChild(sortWrap);

  bottomBar.appendChild(subRow);

  app.appendChild(bottomBar);

  const spacerBottom = document.createElement("div");
  spacerBottom.style.height = Math.round(170 * cardScale) + 70 + "px";
  app.appendChild(spacerBottom);

  // ===== SCORE POPUP =====
  if (state.popup) {
    const popup = document.createElement("div");
    popup.className = "score-popup";
    const p = state.popup;
    const detail = p.phase === "pinging"
      ? `${p.runningChips} <span style="color:#3FA9A0">chips</span>`
      : `${p.runningChips} <span style="color:#3FA9A0">chips</span> × ${p.totalMult} <span style="color:#C9A227">mult</span>${state.runMultiplier !== 1 ? ` × ${state.runMultiplier} <span style="color:#A23B3B">run</span>` : ""}`;
    const totalLine = p.phase === "pinging" ? "" : `<div class="score-popup-total serif">+${p.score}</div>`;
    popup.innerHTML = `
      <div class="score-popup-name serif">${p.name}</div>
      <div class="score-popup-detail">${detail}</div>
      ${totalLine}
    `;
    // The whole #app tree gets rebuilt on every render() call (e.g. when a
    // charm activation shows/hides while this popup is still on screen),
    // which would otherwise restart the popIn/popNameSlide/popTotalPunch
    // entrance animations from scratch each time, making the hand name
    // banner appear to flash repeatedly. Use the same negative
    // animation-delay technique used for charm activation so unrelated
    // renders resume the animation in place instead of replaying it.
    const popupElapsed = state.popupStartedAt ? Date.now() - state.popupStartedAt : 0;
    if (popupElapsed > 0) {
      const delay = `-${popupElapsed}ms`;
      popup.style.animationDelay = delay;
      popup.querySelector(".score-popup-name").style.animationDelay = delay;
      const totalEl = popup.querySelector(".score-popup-total");
      if (totalEl) totalEl.style.animationDelay = delay;
    }
    app.appendChild(popup);
  }

  // ===== OVERLAYS =====
  if (state.overlay === "cleared") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const { base, interest, leftover = 0 } = state.lastRoundEarnings;
    const parts = [`$${base}`];
    if (leftover > 0) parts.push(`$${leftover} unused hands`);
    if (interest > 0) parts.push(`$${interest} interest`);
    const earningsText = `earned ${parts.join(" + ")}`;
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#C9A227">Blind Cleared</div>
      <div class="overlay-sub" style="margin:8px 0 24px">${state.roundScore.toLocaleString()} / ${target.toLocaleString()} · ${earningsText}</div>
    `;
    overlay.appendChild(BigButton("Visit Shop", goToShop));
    app.appendChild(overlay);
  } else if (state.overlay === "victory") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const { base, interest, leftover = 0 } = state.lastRoundEarnings;
    const parts = [`$${base}`];
    if (leftover > 0) parts.push(`$${leftover} unused hands`);
    if (interest > 0) parts.push(`$${interest} interest`);
    const earningsText = `earned ${parts.join(" + ")}`;
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#E9C568">Final Boss Defeated</div>
      <div class="overlay-sub" style="margin:8px 0 12px">${state.roundScore.toLocaleString()} / ${target.toLocaleString()} · ${earningsText}</div>
      <div class="overlay-sub" style="margin:0 0 24px">You've beaten Ante ${FINAL_ANTE}. Bank the win, or keep climbing endless antes for a higher score.</div>
    `;
    overlay.appendChild(BigButton("Take the Win", takeTheWin));
    overlay.appendChild(BigButton("Continue Onward", goToShop));
    app.appendChild(overlay);
  } else if (state.overlay === "won") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#E9C568">Victory</div>
      <div class="overlay-sub" style="margin:8px 0 24px">You beat the final boss at Ante ${FINAL_ANTE} with $${state.money.toLocaleString()}. Run complete.</div>
    `;
    overlay.appendChild(BigButton("Start New Run", startGame));
    app.appendChild(overlay);
  } else if (state.overlay === "over") {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="overlay-title serif" style="font-size:34px;color:#A23B3B">Run Over</div>
      <div class="overlay-sub" style="margin:8px 0 24px">Fell short at Ante ${state.ante}, ${BLIND_TYPES[state.blindIdx].label} — ${state.roundScore.toLocaleString()} / ${target.toLocaleString()}</div>
    `;
    overlay.appendChild(BigButton("Try Again", startGame));
    app.appendChild(overlay);
  } else if (state.overlay === "shop") {
    app.appendChild(ShopOverlay());
  }

  // ===== CHARM ACTIVATION DISPLAY =====
  if (state.activeCharm) {
    const activation = document.createElement("div");
    activation.className = "charm-activation" + (state.activeCharmClosing ? " out" : "");
    // The whole #app tree gets rebuilt on every render() call, which would
    // normally restart this element's CSS slide-in animation from scratch
    // every time an unrelated render happens during the charm's display
    // window. Use a negative animation-delay based on how long the charm
    // has actually been showing so the animation resumes in place instead
    // of snapping back and replaying.
    if (!state.activeCharmClosing) {
      const elapsed = state.activeCharmStartedAt ? Date.now() - state.activeCharmStartedAt : 0;
      activation.style.animationDelay = `-${Math.max(0, elapsed)}ms`;
    }
    
    const orb = document.createElement("div");
    orb.className = "charm-activation-orb";
    orb.style.background = state.activeCharm.color;
    orb.innerHTML = activationIcon(state.activeCharm.name);
    activation.appendChild(orb);
    
    const text = document.createElement("div");
    text.className = "charm-activation-text";
    text.style.color = state.activeCharm.color;
    text.innerHTML = `<strong>${state.activeCharm.name}</strong><br>${state.activeCharm.desc}`;
    activation.appendChild(text);
    
    app.appendChild(activation);
  }

  // ===== ITEM SIDEBAR (available while playing or shopping) =====
  if (state.overlay === "playing" || state.overlay === "shop") {
    app.appendChild(ItemSidebar());
  }

  // ===== DECK PEEK MODAL =====
  if (state.deckOverlayOpen) {
    app.appendChild(renderDeckModal());
  }

  applyCardFlip(oldCardRects, wasFullDeal);
}

/* ============================== ITEM SIDEBAR UI ============================== */
function ItemSidebar() {
  const wrap = document.createElement("div");

  const tab = document.createElement("div");
  tab.className = "item-tab";
  tab.style.right = (state.sidebarProgress * SIDEBAR_PANEL_WIDTH) + "px";
  tab.style.top = state.sidebarY + "%";
  tab.innerHTML = `
    <div class="item-tab-grip"><span></span><span></span><span></span></div>
    <div class="item-tab-icon">✨</div>
    <div class="item-tab-label">GEAR</div>
    <div class="item-tab-count">${state.charms.length}/${state.charmSlots} + ${state.items.length}/${getEffectiveItemSlots()}</div>
  `;
  tab.onmousedown = sidebarDragStart;
  tab.ontouchstart = sidebarDragStart;
  wrap.appendChild(tab);

  const panel = document.createElement("div");
  panel.className = "item-panel";
  panel.style.top = state.sidebarY + "%";
  panel.style.transform = `translateY(-50%) translateX(${(1 - state.sidebarProgress) * 100}%)`;
  const title = document.createElement("div");
  title.className = "item-panel-title";
  title.innerHTML = `<span>Charms & Items</span><span class="item-panel-close">✕</span>`;
  title.querySelector(".item-panel-close").onclick = closeSidebar;
  panel.appendChild(title);

  // Charms section
  const charmsLabel = document.createElement("div");
  charmsLabel.style.fontSize = "11px";
  charmsLabel.style.fontWeight = "600";
  charmsLabel.style.letterSpacing = "1px";
  charmsLabel.style.color = "#C9A227";
  charmsLabel.style.marginTop = "12px";
  charmsLabel.style.marginBottom = "8px";
  charmsLabel.textContent = "CHARMS";
  panel.appendChild(charmsLabel);

  for (let i = 0; i < state.charmSlots; i++) {
    const charm = state.charms[i];
    const slot = document.createElement("div");
    slot.className = "item-slot" + (charm ? " filled" : "");
    if (charm) {
      slot.style.borderColor = charm.color + "88";
      slot.innerHTML = `
        <div class="item-slot-name" style="color:${charm.color}">${charm.name}</div>
        <div class="item-slot-desc">${charm.desc}${charm.effect.type === "ratchetBossMult" ? ` (currently +${charm.ratchetBonus || 0})` : ""}${charm.effect.type === "oracleCompoundMult" ? ` (currently X${(charm.oracleMultBonus || 1).toFixed(2)})` : ""}</div>
      `;
      const sellBtn = document.createElement("button");
      sellBtn.textContent = "Sell $" + Math.max(1, Math.floor(charm.price / 2));
      sellBtn.style.marginTop = "6px";
      sellBtn.style.fontFamily = "inherit";
      sellBtn.style.fontWeight = "700";
      sellBtn.style.fontSize = "9.5px";
      sellBtn.style.letterSpacing = "0.5px";
      sellBtn.style.textTransform = "uppercase";
      sellBtn.style.border = "1px solid " + charm.color + "88";
      sellBtn.style.borderRadius = "6px";
      sellBtn.style.background = "transparent";
      sellBtn.style.color = charm.color;
      sellBtn.style.padding = "3px 8px";
      sellBtn.style.cursor = "pointer";
      sellBtn.onclick = () => sellCharm(charm.uid);
      slot.appendChild(sellBtn);
    } else {
      slot.innerHTML = `<div class="item-slot-empty">Empty</div>`;
    }
    panel.appendChild(slot);
  }

  // Items section
  const itemsLabel = document.createElement("div");
  itemsLabel.style.fontSize = "11px";
  itemsLabel.style.fontWeight = "600";
  itemsLabel.style.letterSpacing = "1px";
  itemsLabel.style.color = "#C9A227";
  itemsLabel.style.marginTop = "12px";
  itemsLabel.style.marginBottom = "8px";
  itemsLabel.textContent = "CONSUMABLES";
  panel.appendChild(itemsLabel);

  const effectiveItemSlots = getEffectiveItemSlots();
  const itemRowCount = Math.max(effectiveItemSlots, state.items.length);
  for (let i = 0; i < itemRowCount; i++) {
    const item = state.items[i];
    const isOverflow = i >= effectiveItemSlots;
    const slot = document.createElement("div");
    slot.className = "item-slot" + (item ? " filled" : "");
    if (item) {
      slot.style.borderColor = item.color + "88";
      if (isOverflow) slot.style.borderColor = "#A23B3B";
      slot.innerHTML = `
        <div class="item-slot-name" style="color:${item.color}">${item.name}${isOverflow ? ' <span style="color:#A23B3B;font-size:8px;">(overflow)</span>' : ""}</div>
        <div class="item-slot-desc">${item.desc}</div>
      `;
      const useBtn = document.createElement("button");
      useBtn.textContent = "Use";
      useBtn.style.marginTop = "6px";
      useBtn.style.fontFamily = "inherit";
      useBtn.style.fontWeight = "700";
      useBtn.style.fontSize = "11px";
      useBtn.style.letterSpacing = "0.5px";
      useBtn.style.textTransform = "uppercase";
      useBtn.style.border = "1px solid " + item.color + "88";
      useBtn.style.borderRadius = "6px";
      useBtn.style.background = "transparent";
      useBtn.style.color = item.color;
      useBtn.style.padding = "4px 10px";
      useBtn.style.cursor = "pointer";
      useBtn.onclick = () => useItem(item.uid);
      slot.appendChild(useBtn);
    } else {
      slot.innerHTML = `<div class="item-slot-empty">Empty</div>`;
    }
    panel.appendChild(slot);
  }

  // Vouchers section
  if (state.vouchers.length > 0) {
    const vouchersLabel = document.createElement("div");
    vouchersLabel.style.fontSize = "11px";
    vouchersLabel.style.fontWeight = "600";
    vouchersLabel.style.letterSpacing = "1px";
    vouchersLabel.style.color = "#7FBA9A";
    vouchersLabel.style.marginTop = "12px";
    vouchersLabel.style.marginBottom = "8px";
    vouchersLabel.textContent = "VOUCHERS";
    panel.appendChild(vouchersLabel);

    state.vouchers.forEach((voucher) => {
      const slot = document.createElement("div");
      slot.className = "item-slot filled";
      slot.style.borderColor = voucher.color + "88";
      slot.innerHTML = `
        <div class="item-slot-name" style="color:${voucher.color}">${voucher.name}</div>
        <div class="item-slot-desc">${voucher.desc}</div>
      `;
      panel.appendChild(slot);
    });
  }

  wrap.appendChild(panel);
  return wrap;
}

/* ============================== SHOP UI ============================== */
function ShopOverlay() {
  const overlay = document.createElement("div");
  overlay.className = "shop-overlay";

  const hasStock = state.shopStock.some((item) => item);
  const shopDiscount = state.vouchers.filter((v) => v.effect.type === "shopDiscount").reduce((m, v) => m * v.effect.value, 1);

  // ===== HEADER: title/subtitle left, deck peek + money right ===== 
  const header = document.createElement("div");
  header.className = "shop-header-row";

  const headerLeft = document.createElement("div");
  headerLeft.className = "shop-header-left";
  const title = document.createElement("div");
  title.className = "shop-title serif";
  title.textContent = "The Shop";
  headerLeft.appendChild(title);
  const sub = document.createElement("div");
  sub.className = "shop-sub";
  sub.textContent = hasStock
    ? `${state.charmSlots} charm slots · ${getEffectiveItemSlots()} consumable slots`
    : "No items in stock";
  headerLeft.appendChild(sub);
  header.appendChild(headerLeft);

  const headerRight = document.createElement("div");
  headerRight.className = "shop-header-right";
  const deckCorner = document.createElement("div");
  deckCorner.className = "shop-deck-corner";
  deckCorner.appendChild(renderDeckWidget());
  headerRight.appendChild(deckCorner);
  const money = document.createElement("div");
  money.className = "shop-money serif";
  money.textContent = "$" + state.money;
  headerRight.appendChild(money);
  header.appendChild(headerRight);

  overlay.appendChild(header);

  if (!hasStock) {
    const empty = document.createElement("div");
    empty.className = "shop-empty";
    empty.textContent = "No items in stock";
    overlay.appendChild(empty);
    const row = document.createElement("div");
    row.className = "shop-continue-row";
    const rerollBtn = document.createElement("button");
    rerollBtn.className = "reroll-btn";
    rerollBtn.disabled = state.money < state.rerollCost;
    rerollBtn.innerHTML = `<span class="reroll-btn-icon">⟲</span> Reroll <span class="reroll-btn-cost">$${state.rerollCost}</span>`;
    rerollBtn.onclick = rerollShop;
    row.appendChild(rerollBtn);
    row.appendChild(BigButton("Continue to Next Blind", leaveShop));
    overlay.appendChild(row);
    return overlay;
  }

  // ===== THE COUNTER: vouchers laid on top, charms/items in recessed openings =====
  const counter = document.createElement("div");
  counter.className = "shop-counter";

  if (state.voucherStock.length > 0) {
    const voucherLabel = document.createElement("div");
    voucherLabel.className = "counter-section-label";
    voucherLabel.textContent = "Permanent Upgrades";
    counter.appendChild(voucherLabel);

    const voucherRow = document.createElement("div");
    voucherRow.className = "counter-vouchers";
    state.voucherStock.forEach((voucher, i) => {
      if (!voucher) return;
      const chit = document.createElement("div");
      chit.className = "voucher-chit";
      chit.style.setProperty("--glow", voucher.color);
      const disabled = state.money < voucher.price;
      chit.innerHTML = `
        <div class="voucher-chit-orb"></div>
        <div class="voucher-chit-name">${voucher.name}</div>
        <div class="voucher-chit-price">$${voucher.price}</div>
        <button class="voucher-chit-btn" ${disabled ? "disabled" : ""}>${disabled ? "Can't Afford" : "Buy"}</button>
      `;
      chit.querySelector(".voucher-chit-btn").onclick = (e) => { e.stopPropagation(); buyVoucher(i); };
      chit.addEventListener("click", (e) => {
        if (e.target.closest(".voucher-chit-btn")) return;
        openShopDetail("voucher", i);
      });
      voucherRow.appendChild(chit);
    });
    counter.appendChild(voucherRow);
  }

  const openingsLabel = document.createElement("div");
  openingsLabel.className = "counter-section-label";
  openingsLabel.textContent = "Charms & Consumables";
  counter.appendChild(openingsLabel);

  const openings = document.createElement("div");
  openings.className = "counter-openings";
  state.shopStock.forEach((item, i) => {
    const slot = document.createElement("div");
    slot.className = "opening-slot" + (!item ? " sold" : "");
    if (!item) {
      slot.innerHTML = `<div class="shop-item-orb"></div><div class="opening-name" style="color:#6E6350">Sold</div>`;
      openings.appendChild(slot);
      return;
    }
    slot.style.setProperty("--glow", item.color);
    const discountedPrice = Math.ceil(item.price * shopDiscount);
    const canAfford = state.money >= discountedPrice;
    const slotsFull = item.type === "charm"
      ? state.charms.length >= state.charmSlots
      : state.items.length >= getEffectiveItemSlots();
    const disabled = !canAfford || slotsFull;
    const typeLabel = item.type === "charm" ? "CHARM" : "CONSUMABLE";
    slot.innerHTML = `
      <div class="shop-item-orb"></div>
      <div class="opening-type-label">${typeLabel}</div>
      <div class="opening-name serif">${item.name}</div>
      <div class="opening-footer">
        <span class="opening-price">${shopDiscount < 1 ? `<s>$${item.price}</s> $${discountedPrice}` : `$${discountedPrice}`}</span>
        <button class="opening-buy-btn" ${disabled ? "disabled" : ""}>${slotsFull ? "Slots Full" : "Buy"}</button>
      </div>
    `;
    slot.querySelector(".opening-buy-btn").onclick = (e) => { e.stopPropagation(); buyItem(i); };
    slot.addEventListener("click", (e) => {
      if (e.target.closest(".opening-buy-btn")) return;
      openShopDetail("stock", i);
    });
    openings.appendChild(slot);
  });
  counter.appendChild(openings);

  overlay.appendChild(counter);

  const continueRow = document.createElement("div");
  continueRow.className = "shop-continue-row";
  const rerollBtn = document.createElement("button");
  rerollBtn.className = "reroll-btn";
  rerollBtn.disabled = state.money < state.rerollCost;
  rerollBtn.innerHTML = `<span class="reroll-btn-icon">⟲</span> Reroll <span class="reroll-btn-cost">$${state.rerollCost}</span>`;
  rerollBtn.onclick = rerollShop;
  continueRow.appendChild(rerollBtn);
  continueRow.appendChild(BigButton("Continue to Next Blind", leaveShop));
  overlay.appendChild(continueRow);

  // ===== DETAIL POPUP: full name/description for whichever slot was tapped =====
  if (state.shopDetail) {
    const { kind, index } = state.shopDetail;
    const entry = kind === "voucher" ? state.voucherStock[index] : state.shopStock[index];
    if (entry) {
      const backdrop = document.createElement("div");
      backdrop.className = "shop-detail-backdrop";
      backdrop.onclick = (e) => { if (e.target === backdrop) closeShopDetail(); };

      const card = document.createElement("div");
      card.className = "shop-detail-card";
      card.style.setProperty("--glow", entry.color);

      const isVoucher = kind === "voucher";
      const discountedPrice = isVoucher ? entry.price : Math.ceil(entry.price * shopDiscount);
      const disabled = isVoucher
        ? state.money < entry.price
        : (state.money < discountedPrice) || (entry.type === "charm"
            ? state.charms.length >= state.charmSlots
            : state.items.length >= getEffectiveItemSlots());
      const typeLabel = isVoucher ? "VOUCHER" : (entry.type === "charm" ? "CHARM" : "CONSUMABLE");
      const slotsFull = !isVoucher && entry.type === "charm"
        ? state.charms.length >= state.charmSlots
        : (!isVoucher && state.items.length >= getEffectiveItemSlots());

      // Set all static content in a single innerHTML assignment first — appending
      // the close button afterwards (rather than before, via +=) avoids the whole
      // card being re-serialized and re-parsed, which would silently strip any
      // JS-assigned onclick handler already attached to a live child element.
      card.innerHTML = `
        <div class="shop-detail-orb"></div>
        <div class="shop-detail-type">${typeLabel}</div>
        <div class="shop-detail-name serif">${entry.name}</div>
        <div class="shop-detail-desc">${entry.desc}</div>
        <div class="shop-detail-price">${!isVoucher && shopDiscount < 1 ? `<s>$${entry.price}</s> $${discountedPrice}` : `$${discountedPrice}`}</div>
        <button class="shop-detail-buy-btn" ${disabled ? "disabled" : ""}>${slotsFull ? "Slots Full" : disabled ? "Can't Afford" : "Buy"}</button>
      `;
      card.querySelector(".shop-detail-buy-btn").onclick = () => {
        if (isVoucher) buyVoucher(index); else buyItem(index);
        closeShopDetail();
      };

      const closeBtn = document.createElement("button");
      closeBtn.className = "shop-detail-close";
      closeBtn.textContent = "✕";
      closeBtn.onclick = closeShopDetail;
      card.appendChild(closeBtn);

      backdrop.appendChild(card);
      overlay.appendChild(backdrop);
    }
  }

  return overlay;
}

window.addEventListener("resize", render);
window.addEventListener("orientationchange", render);
document.addEventListener("click", (e) => {
  if (!state.menuOpen) return;
  if (e.target.closest(".menu-wrap")) return;
  state.menuOpen = false;
  render();
});

// Resume an in-progress run if one was saved; otherwise start a new one.
if (loadGame() && state.overlay !== "start") {
  // a run in progress picks up Pocket Money straight away
  const ppCash = PPHub.take('cash');
  if (ppCash) { state.money += ppCash; saveGame(); }
}
if (state.overlay === "start") startGame(); else render();
</script>
</body>
</html>
