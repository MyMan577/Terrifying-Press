function triggerCharmEffects(result, cards) {
  // Process each charm and trigger effects
  let cardsToReplay = [];
  const chanceMult = state.charms.some((c) => c.effect.type === "horseshoeDoubleChance") ? 2 : 1;

  state.charms.forEach((charm) => {
    if (charm.effect.type === "calculatorReplay") {
      if (Math.random() < Math.min(1, charm.effect.chance * chanceMult)) {
        // Trigger Calculator: replay scoring cards
        cardsToReplay = [...result.scoringCards];
        activateCharmSlide(charm, () => {
          // Charm effect was applied - cardsToReplay will be used
        });
      }
    }
  });
  
  return cardsToReplay;
}

// Spawns a floating "+N" chip label above a card element, positioned via a
// fixed-position node appended to <body> so it survives the next render()
// (which wipes and rebuilds #app) and can finish its own animation/removal.
function spawnChipFloat(el, amount) {
  if (!el || !amount) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.textContent = "+" + amount;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function playHand() {
  if (state.selected.length === 0 || state.playsLeft <= 0 || state.overlay !== "playing") return;
  const selectedCards = state.hand.filter((c) => state.selected.includes(c.id));
  const baseResult = evaluateSelection(selectedCards);

  // Boss Blind hand-type restrictions (The Echo / The Mirage) block the play
  // entirely, without spending a hand, if violated.
  const violation = bossBlindHandTypeViolation(baseResult.name);
  if (violation) {
    state.bossBlindMessage = violation;
    render();
    setTimeout(() => {
      state.bossBlindMessage = null;
      render();
    }, 1800);
    return;
  }
  if (!state.firstHandTypeThisRound) state.firstHandTypeThisRound = baseResult.name;
  state.handTypesPlayedThisRound = [...(state.handTypesPlayedThisRound || []), baseResult.name];
  state.handTypeCounts = state.handTypeCounts || {};
  state.handTypeCounts[baseResult.name] = (state.handTypeCounts[baseResult.name] || 0) + 1;
  if (state.bossBlind && state.bossBlind.moneyResetOnMostPlayed) {
    const maxCount = Math.max(...Object.values(state.handTypeCounts));
    if (state.handTypeCounts[baseResult.name] === maxCount) {
      state.money = 0;
    }
  }

  const handBaseChips = HAND_TABLE[baseResult.name].chips;
  const scoringCards = baseResult.scoringCards;
  const scoringIds = scoringCards.map((c) => c.id);
  const newPlaysLeft = state.playsLeft - 1;
  const PING_DELAY = 300;

  // Handle Monument: track consecutive hands without most played hand type
  const hasMonument = state.charms.some((c) => c.effect.type === "monumentHandTypeMult");
  if (hasMonument) {
    if (state.mostPlayedHandType === null) {
      state.mostPlayedHandType = baseResult.name;
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else if (baseResult.name === state.mostPlayedHandType) {
      state.consecutiveHandsWithoutMostPlayed = 0;
    } else {
      state.consecutiveHandsWithoutMostPlayed += 1;
    }
  }
  
  // Handle Mirror: if first hand of round is single card, duplicate it
  if (state.selected.length === 1) {
    const totalPlays = 4 + getExtraPlays(state.items);
    if (newPlaysLeft === totalPlays - 1) { // First hand of round
      const hasMirror = state.charms.some((c) => c.effect.type === "mirrorSingleCard");
      if (hasMirror) {
        const card = selectedCards[0];
        if (card) {
          const cardCopy = { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2) };
          state.deck.push(cardCopy);
        }
      }
    }
  }

  // Trigger random charm effects at start of hand
  state.rouletteBonus = 0;
  state.coinMultBonus = false;
  state.coinMoneyPenalty = 0;
  state.stampMoneyBonus = 0;
  
  state.charms.forEach((charm) => {
    if (charm.effect.type === "rouletteRandomBonus") {
      const chanceMult = state.charms.some((c) => c.effect.type === "horseshoeDoubleChance") ? 2 : 1;
      const chipsChance = Math.min(1, charm.effect.chipsChance * chanceMult);
      const moneyChance = Math.min(1 - chipsChance, charm.effect.moneyChance * chanceMult);
      const rand = Math.random();
      if (rand < chipsChance) {
        state.rouletteBonus = charm.effect.chipsValue;
      } else if (rand < chipsChance + moneyChance) {
        state.money += charm.effect.moneyValue;
      }
    }
    if (charm.effect.type === "coinFlip") {
      if (Math.random() < 0.5) {
        state.coinMultBonus = true;
      } else {
        state.money += charm.effect.moneyGain;
      }
    }
  });
  
  // Apply Roulette bonus chips
  if (state.rouletteBonus > 0) {
    state.nextHandChipBonus += state.rouletteBonus;
  }
  
  // Increment streak counter
  state.streakCounter += 1;

  // Increment run-wide hands-played counter and grow Oracle's permanent
  // multiplier every 3rd hand played this run (accumulates on the charm
  // instance itself, same pattern as Ratchet's boss-clear bonus).
  state.handsPlayedRun = (state.handsPlayedRun || 0) + 1;
  state.charms.forEach((charm) => {
    if (charm.effect.type === "oracleCompoundMult" && state.handsPlayedRun % charm.effect.everyN === 0) {
      charm.oracleMultBonus = (charm.oracleMultBonus || 1) * charm.effect.value;
    }
  });

  // Zenith: flag whether this is the last play of the round before scoring resolves
  state.isLastPlayThisRound = newPlaysLeft === 0;
  
  // Apply money for Chains charm
  state.charms.forEach((charm) => {
    if (charm.effect.type === "chainsMoneyPerHand") {
      state.money += charm.effect.value;
    }
  });

  state.scoringIds = scoringIds;
  state.popup = { name: baseResult.name, runningChips: handBaseChips, totalMult: null, score: null, phase: "pinging" };
  state.popupStartedAt = Date.now();
  render();

  // Pings each card id in order, one at a time, adding its chip value to the running
  // total as it goes and popping the card visually. Calls onDone with the final total
  // once every card in the list has fired. Used both for the initial count and again
  // for a full re-count if a retrigger effect activates afterward.
  // A Crimson-stamped card pings itself twice in place (chips + Gold stamp money both
  // fire twice); a Gold-stamped card pays $3 into state.stampMoneyBonus each time it pings.
  function pingCards(cardIds, startingChips, onDone) {
    let running = startingChips;
    let i = 0;
    function pingOnce(card, id, cb) {
      const debuffed = isCardDebuffed(card);
      const chipsAdded = debuffed ? 0 : rankChipValue(card.rank) + (card.sleeve === "sparkler" ? 20 : 0);
      running += chipsAdded;
      if (!debuffed && card.stamp === "gold") {
        state.stampMoneyBonus = (state.stampMoneyBonus || 0) + 3;
      }
      state.popup = { ...state.popup, runningChips: running };
      render();
      // render() rebuilds the hand-fan from scratch, so the shake/float must be
      // applied to the freshly created element AFTER render, not the stale one.
      const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
      if (el) {
        if (chipsAdded) spawnChipFloat(el, chipsAdded);
        if (!debuffed && card.stamp === "gold") {
          spawnSleeveFloat(el, "+$3", STAMP_COLORS.gold);
        }
        void el.offsetWidth;
        el.classList.add("card-ping");
      }
      setTimeout(cb, PING_DELAY);
    }
    function step() {
      if (i >= cardIds.length) { onDone(running); return; }
      const id = cardIds[i];
      const card = state.hand.find((c) => c.id === id) || scoringCards.find((c) => c.id === id);
      const pingsForThisCard = card.stamp === "crimson" ? 2 : 1;
      let pingsDone = 0;
      function nextPing() {
        if (pingsDone >= pingsForThisCard) { i++; step(); return; }
        pingsDone++;
        pingOnce(card, id, nextPing);
      }
      nextPing();
    }
    step();
  }

  pingCards(scoringIds, handBaseChips, (chipsAfterCards) => {
    // All scoring cards have been individually counted. Now resolve everything that
    // isn't a per-card ping: item/charm flat bonuses, the hand's mult, Fortune/Star
    // bonuses, and whether a retrigger effect (Calculator or The Empress) fires.
    const itemResult = applyItemEffects(
      { ...baseResult, totalChips: chipsAfterCards },
      scoringCards,
      state.items
    );
    const charmResult = applyCharmEffects(itemResult, scoringCards, state.charms);
    const bossResult = applyBossBlindScoringEffects(charmResult, scoringCards);
    const chipsWithFortune = bossResult.totalChips + state.nextHandChipBonus;
    let totalMult = bossResult.totalMult;
    const doubleChips = state.nextHandDoubleChips;
    // Star's "double chips" is applied here for the no-retrigger case. If a retrigger
    // fires below, we re-derive from the undoubled chip total so the doubling covers
    // retriggered chips too, not just the pre-retrigger subtotal (the fix for the bug
    // where retrigger chips weren't getting doubled by Star).
    let chipsWithBonus = doubleChips ? chipsWithFortune * 2 : chipsWithFortune;
    state.nextHandChipBonus = 0;
    state.nextHandDoubleChips = false;
    // Coin: doubles this hand's Mult, resolved before Justice's balance step
    // so Balance sees the post-Coin value like it does with Star's chip double.
    if (state.nextHandDoubleMult) {
      totalMult = totalMult * 2;
    }
    state.nextHandDoubleMult = false;
    // Dice: multiplies this hand's Mult by a random amount rolled when it was used
    if (state.nextHandMultX !== 1) {
      totalMult = totalMult * state.nextHandMultX;
    }
    state.nextHandMultX = 1;
    // Justice: averages this hand's Chips and Mult together, setting both to
    // the midpoint. Applied after all other chip/mult bonuses have resolved.
    if (state.nextHandBalance) {
      const balanced = (chipsWithBonus + totalMult) / 2;
      chipsWithBonus = balanced;
      totalMult = balanced;
    }
    state.nextHandBalance = false;
    
    // Calculate Bell charm money bonus (gain $1 per 35 BASE chips scored, before charm effects)
    state.bellMoneyBonus = 0;
    state.charms.forEach((charm) => {
      if (charm.effect.type === "bellMoneyPerChips") {
        state.bellMoneyBonus = Math.floor(itemResult.totalChips / charm.effect.chipsPerDollar);
      }
    });

    const scoreSoFar = Math.round(chipsWithBonus * totalMult * state.runMultiplier);
    state.popup = { name: baseResult.name, runningChips: chipsWithBonus, totalMult, score: scoreSoFar, phase: "totals" };
    render();

    setTimeout(() => {
      const cardsToReplay = triggerCharmEffects(baseResult, scoringCards);
      const empressFires = cardsToReplay.length === 0 && state.nextHandRetrigger;
      state.nextHandRetrigger = false;
      const idsToReping = (cardsToReplay.length > 0 ? cardsToReplay : scoringCards).map((c) => c.id);

      if (cardsToReplay.length > 0 || empressFires) {
        // Retrigger: seed the re-ping from the UNDOUBLED chip total (chipsWithFortune),
        // not chipsWithBonus, so Star's doubling — like totalMult — gets applied exactly
        // once at the very end, to the full chip total including retriggered cards.
        setTimeout(() => {
          pingCards(idsToReping, chipsWithFortune, (finalChipsUndoubled) => {
            const finalChips = doubleChips ? finalChipsUndoubled * 2 : finalChipsUndoubled;
            const finalScore = Math.round(finalChips * totalMult * state.runMultiplier);
            state.popup = { name: baseResult.name, runningChips: finalChips, totalMult, score: finalScore, phase: "done" };
            render();
            finishPlay(finalScore, newPlaysLeft);
          });
        }, 400);
      } else {
        state.popup = { ...state.popup, phase: "done" };
        render();
        finishPlay(scoreSoFar, newPlaysLeft);
      }
    }, 550);
  });
}

function finishPlay(finalScore, newPlaysLeft) {
  setTimeout(() => {
    // fly the scoring cards up and fade the popup before the hand refills
    const popupEl = document.querySelector(".score-popup");
    if (popupEl) popupEl.classList.add("popup-out");
    state.scoringIds.forEach((id) => {
      const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
      if (!el) return;
      el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
      el.style.transform = `${el.dataset.finalTransform} translateY(-70px) scale(1.15)`;
      el.style.opacity = "0";
    });

    setTimeout(() => {
      state.popup = null;
      state.popupStartedAt = null;
      
      // Handle Mirror sleeve clones - clone played Mirror cards before clearing scoringIds.
      // Use all played cards (not just scoringIds) since a card's sleeve applies whether
      // or not it ended up contributing to the scored hand (e.g. a kicker).
      const playedCardsForMirror = state.hand.filter((c) => state.selected.includes(c.id));
      const mirrorClones = playedCardsForMirror.map((card) => {
        if (card && card.sleeve === "mirror") {
          return { ...card, id: card.id + "_mirror_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined };
        }
        return null;
      }).filter(Boolean);
      
      state.scoringIds = [];
      const playedCards = state.hand.filter((c) => state.selected.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
      state.deck = [...newDeck, ...mirrorClones];
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...playedCards];

      // The Butcher: force-discard random cards from the freshly refilled hand.
      if (state.bossBlind && state.bossBlind.discardAfterPlay) {
        const shuffledHand = shuffleArray(state.hand);
        const forcedIds = shuffledHand.slice(0, Math.min(state.bossBlind.discardAfterPlay, state.hand.length)).map((c) => c.id);
        if (forcedIds.length) {
          const forcedDiscarded = state.hand.filter((c) => forcedIds.includes(c.id));
          const refill2 = refillHand(state.deck, state.hand, forcedIds);
          state.deck = refill2.newDeck;
          state.hand = refill2.newHand;
          state.usedCards = [...state.usedCards, ...forcedDiscarded];
        }
      }
      state.selected = [];
      state.roundScore = state.roundScore + finalScore;
      state.playsLeft = newPlaysLeft;
      state.money += getTollboothBonus(state.charms);
      if (state.bellMoneyBonus) {
        state.money += state.bellMoneyBonus;
        state.bellMoneyBonus = 0;
      }
      if (state.stampMoneyBonus) {
        state.money += state.stampMoneyBonus;
        state.stampMoneyBonus = 0;
      }
      if (state.coinMoneyPenalty > 0) {
        state.money -= state.coinMoneyPenalty;
        state.coinMoneyPenalty = 0;
      }
      state.coinMultBonus = false;

      // Apply Thorns penalty for unused plays
      state.charms.forEach((charm) => {
        if (charm.effect.type === "thornsMultPerCard") {
          const playsUsed = 4 + getExtraPlays(state.items) - state.playsLeft;
          const totalPlays = 4 + getExtraPlays(state.items);
          const unusedPlays = Math.max(0, totalPlays - playsUsed);
          const penalty = Math.min(unusedPlays * charm.effect.moneyLossPerUnusedPlay, charm.effect.maxLoss);
          state.money -= penalty;
        }
      });

      const target = targetForAnte(state.ante, state.blindIdx);
      if (state.roundScore >= target) {
        const interest = getInterestBonus(state.items, state.money);
        const base = 3 + state.blindIdx;
        const leftover = getLeftoverHandsBonus(state.playsLeft, state.discardsLeft);
        state.lastRoundEarnings = { base, interest, leftover };
        state.money = state.money + base + interest + leftover;
        state.overlay = (state.blindIdx === 2 && state.ante === FINAL_ANTE) ? "victory" : "cleared";
        PPHub.event('blind');
        PPHub.best('ante', state.ante);
        if (state.blindIdx === 2) PPHub.event('boss');
        if (state.overlay === "victory") PPHub.event('win');
        if (state.blindIdx === 2) {
          // Boss Blind cleared - Ratchet's bonus is permanent, so it accumulates
          // on the charm instance itself rather than being recomputed live.
          state.charms.forEach((c) => {
            if (c.effect.type === "ratchetBossMult") {
              c.ratchetBonus = (c.ratchetBonus || 0) + c.effect.value;
            }
          });
        }
      } else if (newPlaysLeft <= 0) {
        state.overlay = "over";
        PPHub.event('run');
      }

      // The hand's outcome (score, money, deck/hand state, and win/loss) is now
      // fully resolved. Persist it before it's ever rendered/revealed. A lost
      // run has no save to resume — wipe it instead of writing a dead one.
      if (state.overlay === "over") {
        clearSave();
      } else {
        saveGame();
      }
      render();
    }, 260);
  }, 950);
}

function discard() {
  if (state.selected.length === 0 || state.discardsLeft <= 0 || state.overlay !== "playing") return;
  // fly discarded cards downward and fade before refilling
  state.selected.forEach((id) => {
    const el = document.querySelector(`.hand-fan .card[data-card-id="${id}"]`);
    if (!el) return;
    el.style.transition = "transform .3s cubic-bezier(.4,0,.7,.3), opacity .3s ease";
    el.style.transform = `${el.dataset.finalTransform} translateY(130px) rotate(14deg) scale(.82)`;
    el.style.opacity = "0";
  });

  setTimeout(() => {
    // Check for Tithe sleeves and add money bonus
    const discardedCards = state.hand.filter(c => state.selected.includes(c.id));
    const titheBonus = discardedCards.filter(c => c.sleeve === "tithe").length * 5;
    
    const { newDeck, newHand } = refillHand(state.deck, state.hand, state.selected);
    state.deck = newDeck;
    state.hand = newHand;
    state.usedCards = [...state.usedCards, ...discardedCards];
    state.selected = [];
    state.discardsLeft -= 1;
    state.totalDiscardedRun = (state.totalDiscardedRun || 0) + discardedCards.length;
    state.money += getMoneyOnDiscard(state.items) + titheBonus;
    state.streakCounter = 0; // Reset Streak when discarding
    saveGame();
    render();
  }, 260);
}

/* ============================== ITEMS & SHOP ACTIONS ============================== */
function closeSidebar() {
  state.sidebarProgress = 0;
  render();
}

const SIDEBAR_PANEL_WIDTH = 132; // must match .item-panel width in CSS

let sidebarDrag = null;

function sidebarDragStart(e) {
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  sidebarDrag = {
    startX: point.clientX,
    startY: point.clientY,
    startYPct: state.sidebarY,
    startProgress: state.sidebarProgress,
    mode: null, // decided once the drag moves enough: "horizontal" (open/close) or "vertical" (reposition)
  };
  // Disable the CSS transition while live-dragging so the panel tracks the finger/cursor
  // 1:1 with no delay or eased "snap" motion; the transition comes back on the next render.
  const panel = document.querySelector(".item-panel");
  if (panel) panel.style.transition = "none";
  window.addEventListener("mousemove", sidebarDragMove);
  window.addEventListener("touchmove", sidebarDragMove, { passive: false });
  window.addEventListener("mouseup", sidebarDragEnd);
  window.addEventListener("touchend", sidebarDragEnd);
}

function sidebarDragMove(e) {
  if (!sidebarDrag) return;
  e.preventDefault();
  const point = e.touches ? e.touches[0] : e;
  const dx = point.clientX - sidebarDrag.startX;
  const dy = point.clientY - sidebarDrag.startY;

  if (!sidebarDrag.mode) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return; // ignore tiny jitter before committing to an axis
    sidebarDrag.mode = Math.abs(dx) > Math.abs(dy) ? "horizontal" : "vertical";
  }

  const tab = document.querySelector(".item-tab");
  const panel = document.querySelector(".item-panel");

  if (sidebarDrag.mode === "horizontal") {
    // Dragging the tab left reveals more of the panel. This is a direct 1:1 drag —
    // wherever you let go is exactly where it stays, no snapping to open/closed.
    const deltaProgress = -dx / SIDEBAR_PANEL_WIDTH;
    const progress = Math.max(0, Math.min(1, sidebarDrag.startProgress + deltaProgress));
    state.sidebarProgress = progress;
    if (tab) tab.style.right = (progress * SIDEBAR_PANEL_WIDTH) + "px";
    if (panel) panel.style.transform = `translateY(-50%) translateX(${(1 - progress) * 100}%)`;
  } else {
    const vh = window.innerHeight;
    const startPx = (sidebarDrag.startYPct / 100) * vh;
    const clampedPx = Math.max(36, Math.min(vh - 36, startPx + dy));
    const pct = (clampedPx / vh) * 100;
    state.sidebarY = pct;
    if (tab) tab.style.top = pct + "%";
    if (panel) panel.style.top = pct + "%";
  }
}

function sidebarDragEnd() {
  window.removeEventListener("mousemove", sidebarDragMove);
  window.removeEventListener("touchmove", sidebarDragMove);
  window.removeEventListener("mouseup", sidebarDragEnd);
  window.removeEventListener("touchend", sidebarDragEnd);
  sidebarDrag = null;
  render();
}

function goToShop() {
  // Calculate shop size from Overstock voucher
  const overstockBonus = state.vouchers.filter((v) => v.effect.type === "shopSizeBonus").reduce((s, v) => s + v.effect.value, 0);
  const shopSize = 6 + overstockBonus;
  
  state.shopStock = generateShopStock(shopSize);
  state.rerollCost = 5;
  state.shopDetail = null;
  
  // Generate voucher stock (up to 6 vouchers, vouchers that are already owned won't appear)
  const voucherPool = VOUCHERS.filter(v => !state.vouchers.some(owned => owned.id === v.id));
  state.voucherStock = [];
  for (let i = 0; i < Math.min(4, voucherPool.length); i++) {
    const randomIdx = Math.floor(Math.random() * voucherPool.length);
    state.voucherStock.push(voucherPool[randomIdx]);
    voucherPool.splice(randomIdx, 1);
  }
  
  state.overlay = "shop";
  saveGame();
  render();
}

// Rerolls the charm/item stock (not vouchers) for a price. Each reroll this
// shop visit doubles the cost of the next one; it resets back to base the
// next time the player enters a shop.
function rerollShop() {
  if (state.money < state.rerollCost) return;
  const overstockBonus = state.vouchers.filter((v) => v.effect.type === "shopSizeBonus").reduce((s, v) => s + v.effect.value, 0);
  const shopSize = 6 + overstockBonus;

  state.money -= state.rerollCost;
  state.shopStock = generateShopStock(shopSize);
  state.rerollCost = state.rerollCost * 2;
  state.shopDetail = null;
  saveGame();
  render();
}

// Tapping a charm/item opening or a voucher chit (anywhere but its Buy button)
// opens a popup with its full description. Tapping the backdrop, its own close
// button, or the same slot again closes it.
function openShopDetail(kind, index) {
  if (state.shopDetail && state.shopDetail.kind === kind && state.shopDetail.index === index) {
    state.shopDetail = null;
  } else {
    state.shopDetail = { kind, index };
  }
  render();
}
function closeShopDetail() {
  state.shopDetail = null;
  render();
}

function buyItem(shopIndex) {
  const item = state.shopStock[shopIndex];
  if (!item) return;
  
  // Calculate shop discount from Clearance Sale voucher
  const shopDiscount = state.vouchers.filter((v) => v.effect.type === "shopDiscount").reduce((m, v) => m * v.effect.value, 1);
  const discountedPrice = Math.ceil(item.price * shopDiscount);
  
  if (state.money < discountedPrice) return;
  
  if (item.type === "charm") {
    if (state.charms.length >= state.charmSlots) return;
    state.money -= discountedPrice;
    state.charms = [...state.charms, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  } else {
    if (state.items.length >= getEffectiveItemSlots()) return;
    state.money -= discountedPrice;
    state.items = [...state.items, { ...item, uid: Math.random().toString(36).slice(2, 9) }];
  }
  
  state.shopStock = state.shopStock.map((it, i) => (i === shopIndex ? null : it));
  saveGame();
  render();
}

function buyVoucher(voucherIndex) {
  const voucher = state.voucherStock[voucherIndex];
  if (!voucher) return;
  if (state.money < voucher.price) return;
  
  state.money -= voucher.price;
  state.vouchers = [...state.vouchers, { ...voucher }];
  state.voucherStock = state.voucherStock.map((v, i) => (i === voucherIndex ? null : v));
  saveGame();
  render();
}

function sellCharm(uid) {
  const idx = state.charms.findIndex((c) => c.uid === uid);
  if (idx === -1) return;
  const charm = state.charms[idx];
  
  // Check if this charm is Specter and if it has played 3+ blinds
  if (charm.effect.type === "specterDuplicate" && (charm.effect.blindCounter || 0) >= 3) {
    // Duplicate a random charm from current inventory (excluding the one being sold)
    const otherCharms = state.charms.filter((c) => c.uid !== uid);
    if (otherCharms.length > 0) {
      const targetCharm = otherCharms[Math.floor(Math.random() * otherCharms.length)];
      const charmDef = CHARM_DEFS.find((d) => d.id === targetCharm.id);
      if (charmDef) {
        const newCharm = { ...charmDef, uid: Math.random().toString(36).substring(7) };
        // Copy any accumulated state (like ratchet bonus)
        if (targetCharm.ratchetBonus !== undefined) {
          newCharm.ratchetBonus = targetCharm.ratchetBonus;
        }
        state.charms.push(newCharm);
        activateCharmSlide(charm, () => {});
      }
    }
  }
  
  state.money += Math.max(1, Math.floor(charm.price / 2));
  // Removing the charm updates getEffectiveItemSlots() automatically. If The Fool's
  // slot was occupied, the item in it stays put, it just becomes an overflow item
  // until it's used or a new slot is gained again.
  state.charms = state.charms.filter((c) => c.uid !== uid);
  saveGame();
  render();
}

// Removes an item from the item slots after it's been used, unless an equipped
// Camera charm rolls its preserve chance - in which case the item stays in its
// slot and Camera itself gets a little activation slide so the save is visible.
// Only counts as "destroyed" (for The Joker) if it actually got removed.
// Camera can preserve any single item instance at most 4 times - after that,
// the item is always consumed on use regardless of Camera's roll.
function tryConsumeItem(item, itemUid) {
  const cameraCharms = state.charms.filter((c) => c.effect.type === "cameraPreserve");
  const chanceMult = state.charms.some((c) => c.effect.type === "horseshoeDoubleChance") ? 2 : 1;
  const saveCount = item.cameraSaves || 0;
  let preservedBy = null;
  if (saveCount < 4) {
    for (const c of cameraCharms) {
      if (Math.random() < Math.min(1, c.effect.chance * chanceMult)) { preservedBy = c; break; }
    }
  }
  if (preservedBy) {
    setTimeout(() => activateCharmSlide(preservedBy, () => {}), 950);
    state.items = state.items.map((i) => (i.uid === itemUid ? { ...i, cameraSaves: saveCount + 1 } : i));
  } else {
    state.lastDestroyedItem = { ...item };
    state.items = state.items.filter((i) => i.uid !== itemUid);
  }
}

// Plays the "card gets sleeved" animation: the target card lifts up and glows
// while a floating label announces it, then settles back into place. Calls
// onComplete once finished so the caller can apply the actual state change,
// which is what makes the persistent sleeve visual (glow + badge) appear.
function playSleeveAnimation(cardId, sleeveType, onComplete) {
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = sleeveType === "sparkler" ? "#FFB84D" : "#C9A227";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Sleeved!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same as playSleeveAnimation but for stamps: lifts/glows the card in its
// stamp color, then applies the stamp via onComplete. Stamps and sleeves are
// independent properties, so this never touches card.sleeve.
function playStampAnimation(cardId, stampType, onComplete) {
  const el = document.querySelector(`.hand-fan .card[data-card-id="${cardId}"]`);
  if (!el) { onComplete(); return; }
  const base = el.dataset.finalTransform || "";
  const glowColor = STAMP_COLORS[stampType] || "#F2C94C";
  el.style.transition = "transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease";
  el.style.transform = `${base} translateY(-24px) scale(1.1)`;
  el.style.filter = `brightness(1.35) drop-shadow(0 0 10px ${glowColor})`;
  spawnSleeveFloat(el, "Stamped!", glowColor);
  setTimeout(() => {
    el.style.transform = base;
    el.style.filter = "brightness(1)";
    setTimeout(() => {
      el.style.transition = "";
      onComplete();
    }, 240);
  }, 250);
}

// Same fixed-position floating-label trick as spawnChipFloat, reusing its
// entrance/exit animation but with custom text and color.
function spawnSleeveFloat(el, text, color) {
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const float = document.createElement("div");
  float.className = "chip-float";
  float.style.color = color;
  float.style.textShadow = `0 2px 8px rgba(0,0,0,.55), 0 0 14px ${color}77`;
  float.textContent = text;
  float.style.left = (rect.left + rect.width / 2) + "px";
  float.style.top = rect.top + "px";
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function useItem(itemUid) {
  const idx = state.items.findIndex((i) => i.uid === itemUid);
  if (idx === -1) return;
  const item = state.items[idx];
  const eff = item.effect;

  if (eff.type === "eraserRemoveCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const idsToRemove = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      state.hand = state.hand.filter((c) => !idsToRemove.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToRemove.includes(c.id));
      state.usedCards = state.usedCards.filter((c) => !idsToRemove.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToRemove.includes(id));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "duplicatorCopyCard") {
    if (state.overlay !== "playing" || state.selected.length === 0) return;
    const targetId = state.selected[0];
    const source = state.hand.find((c) => c.id === targetId);
    if (!source) return;
    activateCharmSlide(item, () => {
      const clone = { ...source, id: source.id + "_dup_" + Date.now() + "_" + Math.random().toString(36).slice(2), sleeve: undefined, stamp: undefined };
      state.deck = [...state.deck, clone];
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "diceRandomMultX") {
    activateCharmSlide(item, () => {
      state.nextHandMultX = eff.min + Math.random() * (eff.max - eff.min);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "freshDealRedraw") {
    if (state.overlay !== "playing" || state.hand.length === 0) return;
    const allIds = state.hand.map((c) => c.id);
    activateCharmSlide(item, () => {
      const discardedCards = state.hand.filter((c) => allIds.includes(c.id));
      const { newDeck, newHand } = refillHand(state.deck, state.hand, allIds);
      state.deck = newDeck;
      state.hand = newHand;
      state.usedCards = [...state.usedCards, ...discardedCards];
      state.selected = [];
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "piggyBankDiscardsToMoney") {
    activateCharmSlide(item, () => {
      state.money += state.discardsLeft * eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "flatMoneyGain") {
    activateCharmSlide(item, () => {
      state.money += eff.value;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "hangedManSellCards") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToDestroy = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      const earned = idsToDestroy.length * eff.pricePerCard;
      state.hand = state.hand.filter((c) => !idsToDestroy.includes(c.id));
      state.deck = state.deck.filter((c) => !idsToDestroy.includes(c.id));
      state.selected = state.selected.filter((id) => !idsToDestroy.includes(id));
      state.money += earned;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "loversTransformSuit") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[visualHand.length - 1].id;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "strengthRankUp") {
    if (state.overlay !== "playing" || state.selected.length === 0) return; // needs cards selected in hand
    const idsToRaise = state.selected.slice(0, eff.maxCards);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => {
        if (!idsToRaise.includes(c.id)) return c;
        const nextIdx = (RANKS.indexOf(c.rank) + eff.value) % RANKS.length;
        return { ...c, rank: RANKS[nextIdx] };
      });
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "temperanceSetRank") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, rank: eff.rank } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "towerRerollRanks") {
    if (state.hand.length === 0) return;
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => ({ ...c, rank: RANKS[Math.floor(Math.random() * RANKS.length)] }));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "transformRandomSuit") {
    if (state.hand.length === 0) return;
    const targetIds = shuffleArray(state.hand).slice(0, eff.count).map((c) => c.id);
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) => (targetIds.includes(c.id) ? { ...c, suit: eff.suit } : c));
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "coinDoubleMult") {
    activateCharmSlide(item, () => {
      state.nextHandDoubleMult = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "justiceBalanceHand") {
    activateCharmSlide(item, () => {
      state.nextHandBalance = true;
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "judgementCreateCharm") {
    if (state.charms.length >= state.charmSlots) return;
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    const ownedCharmIds = hasRingmaster ? new Set() : new Set(state.charms.map((c) => c.id));
    const pool = CHARM_DEFS.filter((c) => !ownedCharmIds.has(c.id));
    if (pool.length === 0) return;
    const charmDef = pool[Math.floor(Math.random() * pool.length)];
    activateCharmSlide(item, () => {
      const newCharm = { ...charmDef, uid: Math.random().toString(36).slice(2, 9) };
      state.charms.push(newCharm);
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "emperorCreateItems") {
    const hasRingmaster = state.charms.some((c) => c.effect.type === "ringmasterDuplicates");
    activateCharmSlide(item, () => {
      const capacity = getEffectiveItemSlots();
      let currentCount = state.items.filter((i) => i.uid !== itemUid).length;
      const ownedItemIds = hasRingmaster ? new Set() : new Set(state.items.map((i) => i.id));
      for (let n = 0; n < eff.count; n++) {
        if (currentCount >= capacity) break;
        const pool = ITEM_DEFS.filter((i) => !ownedItemIds.has(i.id));
        if (pool.length === 0) break;
        const def = pool[Math.floor(Math.random() * pool.length)];
        const newItem = { ...def, uid: Math.random().toString(36).slice(2, 9) };
        state.items.push(newItem);
        ownedItemIds.add(def.id);
        currentCount++;
      }
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "deathCopyCard") {
    if (state.overlay !== "playing" || state.selected.length < 2) return; // needs at least 2 selected cards
    // Determine leftmost/rightmost among selected cards by their current visual position.
    const visualHand = getSortedHand();
    const selectedInOrder = visualHand.filter((c) => state.selected.includes(c.id));
    const leftmostId = selectedInOrder[0].id;
    const rightmostCard = selectedInOrder[selectedInOrder.length - 1];
    activateCharmSlide(item, () => {
      state.hand = state.hand.map((c) =>
        c.id === leftmostId ? { ...c, rank: rightmostCard.rank, suit: rightmostCard.suit, sleeve: rightmostCard.sleeve } : c
      );
      tryConsumeItem(item, itemUid);
      saveGame();
    });
    return;
  }

  if (eff.type === "magicianSleeveCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playSleeveAnimation(targetId, eff.sleeve, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, sleeve: eff.sleeve } : c));
        if (eff.sleeve === "molt") {
          state.moltTargets = { ...state.moltTargets, [targetId]: true };
        }
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "stampCard") {
    const visualHand = getSortedHand();
    if (visualHand.length === 0) return;
    const targetId = visualHand[0].id; // leftmost card in hand
    activateCharmSlide(item, () => {
      playStampAnimation(targetId, eff.stamp, () => {
        state.hand = state.hand.map((c) => (c.id === targetId ? { ...c, stamp: eff.stamp } : c));
        tryConsumeItem(item, itemUid);
        saveGame();
        render();
      });
    });
    return;
  }

  if (eff.type === "jokerTransform" && state.lastDestroyedItem) {
    activateCharmSlide(item, () => {
      const transformed = { ...state.lastDestroyedItem, uid: Math.random().toString(36).slice(2, 9) };
      state.items = state.items.map((it, i) => (i === idx ? transformed : it));
      // The Joker itself is consumed by transforming, not destroyed as "used" in the
      // traditional sense (it becomes something else), so we don't remove the slot
      // and we don't set lastDestroyedItem here.
      saveGame();
    });
    return;
  }

  activateCharmSlide(item, () => {
    if (eff.type === "devilMultiplier") {
      state.runMultiplier = Math.round(state.runMultiplier * eff.value * 100) / 100;
    } else if (eff.type === "fortuneNextHandChips") {
      state.nextHandChipBonus += eff.value;
    } else if (eff.type === "sunRefillDiscards") {
      state.discardsLeft = 4 + getExtraDiscards(state.items);
    } else if (eff.type === "empressRetrigger") {
      state.nextHandRetrigger = true;
    } else if (eff.type === "hermitDoubleMoney") {
      state.money += Math.min(state.money, eff.cap);
    } else if (eff.type === "starDoubleChips") {
      state.nextHandDoubleChips = true;
    }
    // No prior destroyed item for Joker to become - it just fizzles and is used up.

    // Track this item as the most recently destroyed/used item (for future Joker uses),
    // then remove it from the item slots since it has been consumed - unless a Camera
    // charm preserves it.
    tryConsumeItem(item, itemUid);
    saveGame();
  });
}

function leaveShop() {
  goNextBlind();
}

function takeTheWin() {
  state.overlay = "won";
  clearSave();
  render();
}

function goNextBlind() {
  let nextAnte = state.ante;
  let nextBlindIdx = state.blindIdx + 1;
  if (nextBlindIdx > 2) {
    nextBlindIdx = 0;
    nextAnte = state.ante + 1;
  }
  startNextBlind(nextAnte, nextBlindIdx);
}

function setSortMode(mode) {
  if (mode === "manual" && state.sortMode !== "manual") {
    // Seed manual order from whatever's currently displayed so the switch is seamless.
    state.handOrder = getSortedHand().map((c) => c.id);
  }
  state.sortMode = mode;
  render();
}

function getSortedHand() {
  if (state.sortMode === "manual") {
    syncHandOrder();
    return state.handOrder.map((id) => state.hand.find((c) => c.id === id)).filter(Boolean);
  }
  const arr = [...state.hand];
  if (state.sortMode === "suit") {
    arr.sort((a, b) => {
      const s = SUIT_KEYS.indexOf(a.suit) - SUIT_KEYS.indexOf(b.suit);
      return s !== 0 ? s : rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank);
    });
  } else {
    arr.sort((a, b) => rankStraightValueHigh(a.rank) - rankStraightValueHigh(b.rank));
  }
  return arr;
}

// Keeps handOrder in sync with state.hand: drops ids no longer in hand,
// appends any new ids (newly dealt/drawn cards) to the end.
function syncHandOrder() {
  const handIds = state.hand.map((c) => c.id);
  const stillValid = state.handOrder.filter((id) => handIds.includes(id));
  const missing = handIds.filter((id) => !stillValid.includes(id));
  state.handOrder = [...stillValid, ...missing];
}

// Reorders a card within the current visual order (used by drag-to-reorder).
// Works no matter which sortMode is active - dragging always switches to manual.
function moveCardToPosition(cardId, targetIndex) {
  const currentVisual = getSortedHand().map((c) => c.id);
  const fromIndex = currentVisual.indexOf(cardId);
  if (fromIndex === -1) return;
  currentVisual.splice(fromIndex, 1);
  const clampedIndex = Math.max(0, Math.min(targetIndex, currentVisual.length));
  currentVisual.splice(clampedIndex, 0, cardId);
  state.handOrder = currentVisual;
  state.sortMode = "manual";
}

/* ============================== DECK WIDGET ============================== */
// A small clickable deck pile + counter, docked bottom-left so it never sits
// over the hand fan, preview text, or action buttons. Clicking opens a modal
// showing every card in the 52-card deck: still-in-deck cards are shown face
// up at full opacity, while cards currently in hand or already played/
// discarded this blind are shown dimmed as sleeved card backs.
function renderDeckWidget() {
  const widget = document.createElement("div");
  widget.className = "deck-widget";

  const stack = document.createElement("div");
  stack.className = "deck-stack";
  const stackW = 26, stackH = 36;
  stack.style.width = stackW + "px";
  stack.style.height = stackH + "px";

  // Draw a few layered card-backs so the pile reads as a physical deck,
  // capped so an empty/near-empty deck doesn't look full.
  const layers = Math.max(1, Math.min(3, Math.ceil(state.deck.length / 17)));
  for (let i = 0; i < layers; i++) {
    const back = document.createElement("div");
    back.className = "deck-card-back";
    back.style.width = stackW + "px";
    back.style.height = stackH + "px";
    back.style.left = -i * 1 + "px";
    back.style.top = -i * 1 + "px";
    back.style.zIndex = i;
    const inner = document.createElement("div");
    inner.className = "deck-card-back-inner";
    back.appendChild(inner);
    stack.appendChild(back);
  }
  widget.appendChild(stack);

  const pill = document.createElement("div");
  pill.className = "deck-count-pill";
  pill.textContent = `${state.deck.length} left`;
  widget.appendChild(pill);

  const label = document.createElement("div");
  label.className = "deck-label";
  label.textContent = "Deck";
  widget.appendChild(label);

  widget.onclick = () => {
    state.deckOverlayOpen = true;
    render();
  };

  return widget;
}

    ).join("");
    overlay.appendChild(stampLegend);
  }

  const grid = document.createElement("div");
  grid.className = "deck-modal-grid";

  const inHandIds = new Set(state.hand.map((c) => c.id));
  const usedIds = new Set(state.usedCards.map((c) => c.id));
  // Include duplicate/cloned cards (from charms like Mirror/Larva) alongside
  // the base 52 so the modal reflects the deck's true current contents.
  const allCards = [...state.deck, ...state.hand, ...state.usedCards];

  SUIT_KEYS.forEach((suit) => {
    const suitCards = allCards
      .filter((c) => c.suit === suit)
      .sort((a, b) => RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank));
    if (suitCards.length === 0) return;

    const section = document.createElement("div");
    const rowLabel = document.createElement("div");
    rowLabel.className = "deck-suit-row-label";

    section.appendChild(rowLabel);

    const row = document.createElement("div");
    row.className = "deck-suit-row";

      const inDeck = !inHandIds.has(card.id) && !usedIds.has(card.id);
