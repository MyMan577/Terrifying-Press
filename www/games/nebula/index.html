  }
  function flockCell(g, x, y, z) {
    const ix = Math.max(0, Math.min(g.nx - 1, ((x + P.rc * 1.3) / FLOCK_CELL) | 0));
    const iy = Math.max(0, Math.min(g.ny - 1, ((y + P.hy * 1.3) / FLOCK_CELL) | 0));
    const iz = Math.max(0, Math.min(g.nz - 1, ((z + P.rc * 1.3) / FLOCK_CELL) | 0));
    return (iz * g.ny + iy) * g.nx + ix;
  }
  function flockCount(g, X, Y, Z, fallback) {
    return (X < 0 || Y < 0 || Z < 0 || X >= g.nx || Y >= g.ny || Z >= g.nz) ? fallback : g.sum[((Z * g.ny + Y) * g.nx + X) * 7];
  }
  function buildFlock() {
    const g = flockGrid();
    g.raw.fill(0);
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      if (pt.physEpoch !== physEpoch) continue;
      const o = flockCell(g, pt.wx, pt.wy, pt.wz) * 7;
      g.raw[o]++; g.raw[o + 1] += pt.wx; g.raw[o + 2] += pt.wy; g.raw[o + 3] += pt.wz;
      g.raw[o + 4] += pt.wvx; g.raw[o + 5] += pt.wvy; g.raw[o + 6] += pt.wvz;
    }
    // 3x3x3 box sum, done as three separable passes
    const { nx, ny, nz } = g;
    const pass = (src, dst, sx, sy, sz) => {
      for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
        const o = ((z * ny + y) * nx + x) * 7;
        for (let k = 0; k < 7; k++) dst[o + k] = src[o + k];
        for (let d = -1; d <= 1; d += 2) {
          const X = x + d * sx, Y = y + d * sy, Z = z + d * sz;
          if (X < 0 || Y < 0 || Z < 0 || X >= nx || Y >= ny || Z >= nz) continue;
          const q = ((Z * ny + Y) * nx + X) * 7;
          for (let k = 0; k < 7; k++) dst[o + k] += src[q + k];
        }
      }
    };
    pass(g.raw, g.tmp, 1, 0, 0);
    pass(g.tmp, g.sum, 0, 1, 0);
    pass(g.sum, g.tmp, 0, 0, 1);
    const t = g.sum; g.sum = g.tmp; g.tmp = t;
    // whole-flock centre and heading, so it moves as one body
    let n = 0, cx = 0, cy = 0, cz = 0, vx = 0, vy = 0, vz = 0;
    for (let i = 0; i < g.n; i++) { const o = i * 7; n += g.raw[o]; cx += g.raw[o + 1]; cy += g.raw[o + 2]; cz += g.raw[o + 3]; vx += g.raw[o + 4]; vy += g.raw[o + 5]; vz += g.raw[o + 6]; }
    n = Math.max(1, n);
    g.cx = cx / n; g.cy = cy / n; g.cz = cz / n; g.vx = vx / n; g.vy = vy / n; g.vz = vz / n;
  }

  function prepareFlowFrame(activePointers, dt, halfW, halfH) {
    P.T = simTime / 60;
    viewYaw += VIEW_TURN * flowIdleSpinMult * dt;
    P.cy = Math.cos(viewYaw); P.sy = Math.sin(viewYaw);
    P.cp = Math.cos(VIEW_PITCH); P.sp = Math.sin(VIEW_PITCH);
    // a cylinder around the vertical axis stays the same size as it turns
    P.rc = Math.min(halfW, halfH) * 1.15;
    P.hy = halfH * 1.05;
    P.hz = DEPTH;
    P.n = Math.min(5, activePointers.length);
    for (let i = 0; i < P.n; i++) {
      const p = activePointers[i], f = P.fingers[i];
      viewToWorld(p.x - halfW, halfH - p.y, 0, _v);
      f.x = _v.x; f.y = _v.y; f.z = _v.z;
      viewToWorld(p.vx, -p.vy, 0, _v);
      f.vx = _v.x; f.vy = _v.y; f.vz = _v.z;
      f.s = 1; // Magnet: all poles point up, so field lines chain from finger to finger
    }
    if (mode === 'Flock') buildFlock();
  }

  // One particle, one frame of 3D physics, then project it for drawing.
  function flowStep(pt, dt, activePointers, halfW, halfH, kick) {
    if (pt.physEpoch !== physEpoch) seedPhys(pt, halfW, halfH);
    const T = P.T, ts = touchStrength;
    let ax = 0, ay = 0, az = 0;
    const x = pt.wx, y = pt.wy, z = pt.wz;
    let light = 0;

    if (mode === 'Orbit 3D') {
      // Softened gravity toward each finger plus a sideways pull around the
      // particle's own tilted axis, so the swarm forms crossing orbits in every
      // plane (an atom, not a disc). Two fingers trade particles back and forth.
      const GM = 2600 * ts;
      for (let i = 0; i < P.n; i++) {
        const f = P.fingers[i];
        const dx = f.x - x, dy = f.y - y, dz = f.z - z;
        const r2 = dx * dx + dy * dy + dz * dz + 1225;
        const r = Math.sqrt(r2);
        const g = GM / (r2 * r);
        ax += dx * g; ay += dy * g; az += dz * g;
        // tangential: axis x (towards finger)
        const s = g * r * 0.32 / r;
        ax += (pt.oay * dz - pt.oaz * dy) * s;
        ay += (pt.oaz * dx - pt.oax * dz) * s;
        az += (pt.oax * dy - pt.oay * dx) * s;
      }
    } else if (mode === 'Tornado') {
      // Each finger stands a twister on the floor of the volume through its
      // point: suck in at the base, spin up the funnel, spill over the top,
      // rain back down outside and get pulled in again.
      for (let i = 0; i < P.n; i++) {
        const f = P.fingers[i];
        const dx = x - f.x, dz = z - f.z;
        const r = Math.sqrt(dx * dx + dz * dz) + 0.5;
        const ux = dx / r, uz = dz / r;
        const h = y - f.y;
        const rt = 16 + Math.max(0, h) * 0.34 + Math.max(0, -h) * 0.25;
        const wall = (r - rt) / 60;
        const near = Math.exp(-wall * wall);
        const reach = 1 / (1 + (r / 280) * (r / 280));
        // swirl: ease tangential speed toward a target
        const vt = -pt.wvx * uz + pt.wvz * ux;
        const want = (2.4 + 6.5 * near) * reach * ts;
        const tk = (want - vt) * 0.07;
        ax += -uz * tk; az += ux * tk;
        // lift inside the funnel; at the top it lets go and throws particles
        // outward, and outside the funnel they fall back down to the base
        const top = Math.min(P.hy * 0.6, f.y + P.hy * 0.9);
        const below = Math.max(0, Math.min(1, (top - y) / 120));
        // pull onto the funnel wall (only below the top, so spilled ones fall away)
        const pull = (-(r - rt) * 0.0035 - 0.05) * reach * ts * below;
        ax += ux * pull; az += uz * pull;
        // steer vertical speed: rise up the funnel wall, fall everywhere else
        const lift = near * below;
        const wantVy = (4.2 * lift - 2.6 * (1 - lift)) * ts;
        ay += (wantVy - pt.wvy) * 0.05 * Math.max(reach, 1 - lift);
        if (y > top - 40) { const o = 0.55 * Math.min(1, (y - top + 40) / 80); ax += ux * o; az += uz * o; }
        light += near * reach;
      }
    } else if (mode === 'Flock') {
      const g = P.flock;
      const c = flockCell(g, x, y, z) * 7;
      const s = g.sum, raw = g.raw;
      const n = s[c];
      if (n > 1) {
        const inv = 1 / n;
        // alignment and cohesion with the neighbourhood
        ax += (s[c + 4] * inv - pt.wvx) * 0.1; ay += (s[c + 5] * inv - pt.wvy) * 0.1; az += (s[c + 6] * inv - pt.wvz) * 0.1;
        ax += (s[c + 1] * inv - x) * 0.0012; ay += (s[c + 2] * inv - y) * 0.0012; az += (s[c + 3] * inv - z) * 0.0012;
        // separation: move down the crowding gradient, so dense knots spread

        const at = (X, Y, Z) => flockCount(g, X, Y, Z, n);
        const sep = 0.0005;
        ax -= (at(ix + 1, iy, iz) - at(ix - 1, iy, iz)) * sep;
        ay -= (at(ix, iy + 1, iz) - at(ix, iy - 1, iz)) * sep;
        az -= (at(ix, iy, iz + 1) - at(ix, iy, iz - 1)) * sep;
        // a little individual wobble so birds aren't in perfect lockstep
        ax += Math.sin(T * 2.1 + pt.wobble * 7) * 0.008; ay += Math.sin(T * 1.7 + pt.wobble * 5) * 0.008; az += Math.cos(T * 1.9 + pt.wobble * 6) * 0.008;
      }
      // stay with the whole flock and share its heading
      ax += (g.cx - x) * 0.0005 + (g.vx - pt.wvx) * 0.012;
      ay += (g.cy - y) * 0.0005 + (g.vy - pt.wvy) * 0.012;
      az += (g.cz - z) * 0.0005 + (g.vz - pt.wvz) * 0.012;
      // the flock roams after a slowly wandering point, sweeping and turning
      const lx = P.rc * 0.6 * Math.sin(T * 0.31), ly = P.hy * 0.5 * Math.sin(T * 0.23 + 1), lz = P.rc * 0.6 * Math.cos(T * 0.27);
      ax += (lx - x) * 0.0011; ay += (ly - y) * 0.0011; az += (lz - z) * 0.0011;
      // fingers are predators: a hard swerve away close in
      for (let i = 0; i < P.n; i++) {
        const f = P.fingers[i];
        const dx = x - f.x, dy = y - f.y, dz = z - f.z;
        const r = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1;
        const R = 230 * Math.sqrt(ts);

      }

      const cruise = (3.4 / sp - 1) * 0.06;
      ax += pt.wvx * cruise; ay += pt.wvy * cruise; az += pt.wvz * cruise;
    } else if (mode === 'Magnet') {
      // Fingers are bar magnets (vertical, all north-up). Particles flow
      // along the summed field: out of the north pole, round in a loop, into
      // the south pole and straight up through the core again.
      let bx = 0, by = 0, bz = 0, near = 0, inCore = -1;
      for (let i = 0; i < P.n; i++) {

        const k = 1 / (r2 * r) * 1.1e7;

      }
      if (P.n > 0) {
        let tx, ty, tz, speed;
        if (inCore >= 0) { tx = 0; ty = P.fingers[inCore].s; tz = 0; speed = 5; }
        else {
          const b = Math.sqrt(bx * bx + by * by + bz * bz) + 1e-6;
          tx = bx / b; ty = by / b; tz = bz / b;
          speed = Math.min(5.5, b) * ts;
        }
        ax += (tx * speed - pt.wvx) * 0.12; ay += (ty * speed - pt.wvy) * 0.12; az += (tz * speed - pt.wvz) * 0.12;
        light += near;
      }
    } else { // Fluid
      // a slowly shifting divergence-free current (ABC flow): every particle
      // is always moving and neighbours swirl together like smoke in water
      const k = TAU / (Math.min(halfW, halfH) * 2.2);
      const p1 = T * 0.21, p2 = T * 0.17 + 1.3, p3 = T * 0.13 + 2.1;
      const fx = Math.sin(k * z + p1) + 0.6 * Math.cos(k * y + p2);
      const fy = 0.8 * Math.sin(k * x + p3) + Math.cos(k * z + p1);
      const fz = 0.6 * Math.sin(k * y + p2) + 0.8 * Math.cos(k * x + p3);
      ax += (fx * 1.7 - pt.wvx) * 0.03; ay += (fy * 1.7 - pt.wvy) * 0.03; az += (fz * 1.7 - pt.wvz) * 0.03;
      // dragging stirs; holding still spins a whirlpool around the finger
      for (let i = 0; i < P.n; i++) {
        const f = P.fingers[i];
        const dx = x - f.x, dy = y - f.y, dz = z - f.z;
        const r2 = dx * dx + dy * dy + dz * dz;
        const fall = Math.exp(-r2 / (170 * 170));
        if (fall < 0.01) continue;
        ax += f.vx * 0.09 * fall * ts; ay += f.vy * 0.09 * fall * ts; az += f.vz * 0.09 * fall * ts;
        // whirl around the line of sight through the finger
        viewToWorld(0, 0, 1, _v);
        const s = 0.9 * fall * ts / (Math.sqrt(r2) + 30) * 30;
        ax += (_v.y * dz - _v.z * dy) * s / 30; ay += (_v.z * dx - _v.x * dz) * s / 30; az += (_v.x * dy - _v.y * dx) * s / 30;
        light += fall;
      }
    }

    // shared extras: drift, turbulence and Spin from Motion settings
    const amb = (P.n === 0 || mode === 'Fluid' ? 0.012 : 0.004) * ambientDrift;
    if (mode !== 'Flock') {
      ax += Math.sin(y * 0.011 + T * 0.7 + pt.wobble) * amb;
      ay += Math.sin(z * 0.012 + T * 0.6 + pt.wobble) * amb;
      az += Math.sin(x * 0.010 + T * 0.8 + pt.wobble) * amb;
    }
    if (turbulenceStrength > 0) {
      const tq = turbulenceStrength * 0.05;
      ax += Math.cos(y * 0.02 + z * 0.013 + T * 1.3) * tq;
      ay += Math.cos(z * 0.02 + x * 0.017 + T * 1.1) * tq;
      az += Math.cos(x * 0.02 + y * 0.015 + T * 1.7) * tq;
    }
    if (vortexStrength > 0) {
      const rr = Math.sqrt(x * x + z * z) + 30;
      ax += -z / rr * vortexStrength * 0.04; az += x / rr * vortexStrength * 0.04;
    }
    if (kick > 0) {
      const r = Math.sqrt(x * x + y * y + z * z) + 30;
      ax += x / r * kick; ay += y / r * kick; az += z / r * kick;
    }
    // soft walls: a cylinder around the vertical axis, capped top and bottom
    // (Fluid wraps around instead, further down, so the current never piles up)
    const rxz = Math.sqrt(x * x + z * z);
    if (mode === 'Fluid') { /* wraps below */ } else if (rxz > P.rc) { const w = (rxz - P.rc) * 0.004; ax -= x / rxz * w; az -= z / rxz * w; }
    if (mode !== 'Fluid') { if (y > P.hy) ay -= (y - P.hy) * 0.004; else if (y < -P.hy) ay -= (y + P.hy) * 0.004; }

    // Glide (Motion) nudges the friction around each mode's own tuned value
    const drag = Math.pow(Math.min(0.999, PHYS_DRAG[mode] * (1 + ((dragCoef - 0.9) / 0.099 - 0.66) * 0.03)), dt);
    let vx = (pt.wvx + ax * dt) * drag, vy = (pt.wvy + ay * dt) * drag, vz = (pt.wvz + az * dt) * drag;
    const cap = maxParticleSpeed * 0.4;
    const sp2 = vx * vx + vy * vy + vz * vz;
    if (sp2 > cap * cap) { const k = cap / Math.sqrt(sp2); vx *= k; vy *= k; vz *= k; }
    pt.wvx = vx; pt.wvy = vy; pt.wvz = vz;
    pt.wx = x + vx * dt; pt.wy = y + vy * dt; pt.wz = z + vz * dt;
    if (mode === 'Fluid') {
      const r2 = Math.sqrt(pt.wx * pt.wx + pt.wz * pt.wz);
      if (r2 > P.rc) { const k = -(P.rc * 0.96) / r2; pt.wx *= k; pt.wz *= k; }

    }

    if (Math.abs(pt.wy) > P.hy * 2 || rxz > P.rc * 2.5) seedPhys(pt, halfW, halfH);

    // world -> view for drawing
    const x1 = pt.wx * P.cy + pt.wz * P.sy;
    const z1 = -pt.wx * P.sy + pt.wz * P.cy;
    const y2 = pt.wy * P.cp - z1 * P.sp;
    const z2 = pt.wy * P.sp + z1 * P.cp;

    pt.vx = 0; pt.vy = 0;

    const speed = Math.sqrt(sp2);

    const target = (0.55 + Math.min(0.85, speed / 7) + Math.min(0.5, light * 0.35)) * depth;

  }

  // Lifting a finger in a 3D physics mode: an outward blast from that point.
  function physRelease(p, strength) {
    const halfW = W / 2, halfH = H / 2;
    viewToWorld(p.x - halfW, halfH - p.y, 0, _v);
    const fx = _v.x, fy = _v.y, fz = _v.z;
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      if (pt.physEpoch !== physEpoch) continue;
      const dx = pt.wx - fx, dy = pt.wy - fy, dz = pt.wz - fz;
      const r = Math.sqrt(dx * dx + dy * dy + dz * dz) + 20;
      const k = strength * 0.55 * (FALLOFF_REACH / (FALLOFF_REACH + r)) / r;
      pt.wvx += dx * k; pt.wvy += dy * k; pt.wvz += dz * k;
    }
  }

  function shapePointFor(mode, fingerCount, pt) {
    if (mode === 'Cosmos') {
      const fn = COSMOS_SHAPE_BY_FINGERS[Math.min(5, fingerCount)] || shapePointGalaxy;
      return fn(pt);
    }
    // Sphere keeps its existing secret finger-count ladder (cube, pyramid,
    // helix, torus) — untouched by any of the above
    const fn = SHAPE_BY_FINGERS[Math.min(5, fingerCount)] || shapePointSphere;
    return fn(pt);
  }

  // Comet only sweeps up particles that stray very close to the finger —
  // everything outside this radius gets just a faint drift toward it,
  // so the effect reads as a few bright streaks rather than a full field push.
  const COMET_RADIUS = 70;

  // How fast the finger has to be moving (in px/frame) before Comet treats
  // it as a "drag" rather than "held still". Raised well above raw jitter
  // noise so a finger resting in one spot doesn't flicker between the
  // explode and trailing behaviors from sub-pixel tremor alone.
  const COMET_DRAG_THRESHOLD = 0.6;

  // Apply the active interaction mode's force from every active touch
  // to a single particle. This is the ONLY way touch affects the field —
  // it steers particles that already exist, it never creates or destroys them.
  // Every particle is always in range; nothing is ever excluded by distance.
  // `activePointers` is a plain array built once per frame (see frame()) —
  // iterating it with a for-loop instead of calling pointers.forEach(...)
  // here avoids allocating a brand new closure for every one of the
  // thousands of particles on every single frame, which is what was
  // actually causing the stutter at high particle counts.
  function applyTouchForces(pt, dt, activePointers, polygon, touchSummary) {
    // Every mode in MODES_3D picks ONE shared shape, centered on screen,
    // that every particle springs toward together — Sphere additionally
    // varies its shape by how many fingers are down (cube/pyramid/helix/
    // torus), while Cosmos runs its own five-shape ladder by finger count
    // (Galaxy/Vortex/Saturn/Nebula/Wormhole) via COSMOS_SHAPE_BY_FINGERS.
    // Handled once here, up front, instead of inside the per-finger loop
    // below (which is built for effects that legitimately stack per touch).
    if (MODES_3D.has(mode)) {
      if (activePointers.length > 0) {
        const cx = W / 2, cy = H / 2;

        let raw = shapePointFor(mode, activePointers.length, pt);
        // Saturn's ring gets its own rotation around the vertical axis,
        // applied before the shared tilt/spin below — that's what lets it
        // visibly overtake the core instead of the whole planet turning
        // as one rigid body. Core particles are untouched by this. Saturn
        // is Cosmos's 3-finger shape, so gate on that instead of a
        // standalone mode name.
        if (mode === 'Cosmos' && Math.min(5, activePointers.length) === 3 && pt.saturnRing) {
          const rcs = Math.cos(saturnRingSpin), rsn = Math.sin(saturnRingSpin);
          raw = { x: raw.x * rcs - raw.z * rsn, y: raw.y, z: raw.x * rsn + raw.z * rcs };
        }

        // shape forward/back, spin turns it left/right, matching vertical
        // vs horizontal drag respectively
        const ct = Math.cos(formTilt), st = Math.sin(formTilt);
        const ty = raw.y * ct - raw.z * st;
        const tz = raw.y * st + raw.z * ct;

        const rz = raw.x * sn + tz * cs;
        const targetX = cx + rx * SPHERE_RADIUS;
        const targetY = cy + ty * SPHERE_RADIUS;
        pt.vx += (targetX - pt.x) * SPHERE_SPRING * dt;
        pt.vy += (targetY - pt.y) * SPHERE_SPRING * dt;
        // z isn't velocity-driven — it's set directly in the depth block
        // further down the frame loop, which reads this target whenever
        // formActive is true for the frame
        pt.formTargetZ = rz * SPHERE_RADIUS;
        pt.formActive = true;
      }
      return;
    }

    // With 3+ fingers down, each pointer's individual pull below still
    // fires for every finger on every particle — that's what makes 2-finger
    // combos feel powerful, but left unscaled it means a "pull toward a
    // point" force (Attract, Orbit's ring spring, Wind's push) effectively
    // gets applied once per finger and stacks linearly, so 5 fingers pull
    // ~5x harder than 2 and collapse the field into a dense clump instead
    // of spreading it out. Tame just those spring-like forces down as more
    // fingers join; 1-2 fingers are untouched (scale stays 1) since that
    // behavior already works well.
    const pointerScale = activePointers.length > 2 ? Math.min(1, 2 / activePointers.length) : 1;

    for (let pi = 0; pi < activePointers.length; pi++) {
      const p = activePointers[pi];
      const dx = pt.x - p.x, dy = pt.y - p.y;
      // Avoid Math.hypot in this O(particles × active touches) path. A single
      // square root on an already-clamped squared distance is cheaper and yields
      // the same normalized vector used by every force below.
      const dist = Math.sqrt(Math.max(36, dx * dx + dy * dy));
      const invDist = 1 / dist;
      const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
      const falloff = reach / (reach + dist); // never reaches zero
      const nx = dx * invDist, ny = dy * invDist;

      switch (mode) {
        case 'Swirl': {
          // tangential force, like stirring a fluid. With 3+ fingers,
          // alternate spin direction finger-to-finger (even index CW, odd
          // index CCW) instead of everything spinning the same way — this
          // is what gives Swirl its own identity as turbulence (eddies
          // fighting each other) rather than Orbit's clean single rotation.
          const spinSign = activePointers.length >= 3 && (pi % 2 === 1) ? -1 : 1;
          pt.vx += -ny * falloff * 0.9 * dt * spinSign;
          pt.vy += nx * falloff * 0.9 * dt * spinSign;
          break;
        }
        case 'Repel': {
          // push outward, strongest close to the finger, falling off fast —
          // combined with edge containment this builds a dense pressure
          // ring instead of just draining particles to the border

          pt.vy += ny * falloff * falloff * 2.4 * dt;
          break;
        }
        case 'Attract': {
          pt.vx -= nx * falloff * 0.7 * dt * pointerScale;
          pt.vy -= ny * falloff * 0.7 * dt * pointerScale;
          break;
        }
        case 'Orbit': {
          // Each particle targets its own ring radius (varied by orbitJitter)
          // that also breathes slowly over time via its wobble phase, and
          // spins at its own slightly-different rate (spinJitter). Without
          // this every particle would converge onto the exact same radius
          // at the exact same phase and just look like a static, packed
          // ring — varying it keeps the whole halo visibly alive and in
          // motion instead of settling into one "final" frozen shape.
          const targetRadius = ORBIT_RADIUS * pt.orbitJitter * (1 + 0.18 * Math.sin(pt.wobble * 0.6));
          const springForce = (dist - targetRadius) * ORBIT_SPRING;
          pt.vx -= nx * springForce * dt * pointerScale;
          pt.vy -= ny * springForce * dt * pointerScale;
          // spin is rotational, not a pull toward a point, so it doesn't
          // stack into a clump the way the radial spring does — left
          // unscaled so the rings still visibly spin with more fingers down
          pt.vx += -ny * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          pt.vy += nx * ORBIT_SPIN * pt.spinJitter * falloff * dt;
          break;
        }
        case 'Wind': {
          // pushes everything nearby in the direction the finger is moving
          pt.vx += p.vx * falloff * 0.6 * dt * pointerScale;
          pt.vy += p.vy * falloff * 0.6 * dt * pointerScale;
          break;
        }
        case 'Gravity Well': {
          // inverse-square-ish pull — weak from far away, but it ramps up
          // sharply as particles close in, so instead of settling calmly
          // like Attract, fast-moving particles sling past the center and
          // get pulled back around, overshooting again and again
          const g = Math.min(90, (reach * reach) / (dist * dist));
          pt.vx -= nx * g * 0.016 * dt;
          pt.vy -= ny * g * 0.016 * dt;
          break;
        }
        case 'Comet': {
          // only particles inside the tight comet radius get swept up.
          // Held still, the finger acts like a shockwave and pushes them
          // outward; dragged, it acts like a tail being dragged through
          // the field — particles get shoved backward, opposite the
          // direction of motion, so they trail behind instead of chasing
          // it. Nothing outside the radius is pulled in — it just gets a
          // faint outward nudge so the mode never sucks particles toward
          // the finger, only ever blows them away.
          if (dist < COMET_RADIUS) {

            const wsp = Math.hypot(p.vx, p.vy);
            if (wsp > COMET_DRAG_THRESHOLD) {

              pt.vy -= (p.vy / wsp) * near * near * 5.5 * dt;
            } else {
              pt.vx += nx * near * near * 4.5 * dt;
              pt.vy += ny * near * near * 4.5 * dt;

            pt.vy += ny * falloff * 0.05 * dt;
          }
          break;
        }
        case 'Bloom': {

          // then a slow rhythmic wave (based on simTime and distance) reverses
          // the force, pushing them outward in blooming concentric rings.
          // There is no tangential spin (unlike Orbit/Swirl), just pure
          // rhythmic expansion and contraction.
          const wave = Math.sin(dist * 0.04 - simTime * 2.2);
          // Inhale is stronger than exhale so particles gather near the center
          // before being pushed out.
          const force = wave > 0 ? wave * 1.8 : wave * 0.8;
          pt.vx += nx * force * falloff * dt * pointerScale;
          pt.vy += ny * force * falloff * dt * pointerScale;
          // Add a tiny bit of ambient outward drift so particles don't
          // collapse entirely into the exact center pixel.
          if (dist < 20) {
            pt.vx += nx * 0.2 * dt;
            pt.vy += ny * 0.2 * dt;
          }
          if (wave > 0.7) pt.glow = Math.min(2.2, pt.glow + (wave - 0.7) * 0.2 * dt);
          break;
        }
        case 'Lattice': {
          // A magnetic dot-grid anchored to each touch. Every particle owns
          // a nearest cell target, so the gesture reveals clean structure
          // while a tiny alternating circulation keeps it from freezing.
          const gx = p.x + Math.round(dx / LATTICE_CELL) * LATTICE_CELL;
          const gy = p.y + Math.round(dy / LATTICE_CELL) * LATTICE_CELL;
          const ex = pt.x - gx, ey = pt.y - gy;
          const checker = ((Math.round(dx / LATTICE_CELL) + Math.round(dy / LATTICE_CELL) + pt.latticeBand) & 1) ? 1 : -1;
          pt.vx -= ex * 0.045 * falloff * dt * pointerScale;
          pt.vy -= ey * 0.045 * falloff * dt * pointerScale;
          pt.vx += -ey * 0.006 * checker * falloff * dt;
          pt.vy += ex * 0.006 * checker * falloff * dt;
          if (Math.abs(ex) + Math.abs(ey) < 12) pt.glow = Math.min(2.2, pt.glow + 0.025 * dt);
          break;
        }
        case 'Whirlpool': {
          // spin ramps up sharply as a particle nears the drain (squared
          // closeness, not linear) so the outer field only churns lazily
          // while the innermost particles visibly accelerate, the same
          // shape a real whirlpool's speed profile takes
          const closeness = 1 - Math.min(1, dist / reach);
          const spin = WHIRLPOOL_SPIN * (1 + closeness * closeness * WHIRLPOOL_SPIN_RAMP);
          pt.vx += -ny * falloff * spin * dt;
          pt.vy += nx * falloff * spin * dt;
          if (dist < WHIRLPOOL_DRAIN) {
            // inside the drain: don't keep pulling inward — fling back out
            // along the current spin (mostly tangential, a little radial)
            // so the vortex recycles instead of piling everything at the center
            const eject = (1 - dist / WHIRLPOOL_DRAIN) * WHIRLPOOL_EJECT;
            pt.vx += -ny * eject * dt;
            pt.vy += nx * eject * dt;
            pt.vx += nx * eject * 0.5 * dt;
            pt.vy += ny * eject * 0.5 * dt;
            pt.glow = Math.min(2.2, pt.glow + eject * 0.02 * dt);
          } else {
            pt.vx -= nx * falloff * falloff * WHIRLPOOL_PULL * dt * pointerScale;
            pt.vy -= ny * falloff * falloff * WHIRLPOOL_PULL * dt * pointerScale;
          }
          break;
        }
        case 'Pulse': {
          // a standing wave computed live from distance + simTime instead
          // of a spawned event — sin(dist*freq - time*speed) puts a ring
          // of outward push wherever a wave crest currently sits, and as
          // simTime keeps advancing that crest's distance grows, so the
          // ring visibly travels outward forever without ever needing to
          // be re-triggered by another tap
          const wave = Math.sin(dist * PULSE_FREQ - simTime * PULSE_SPEED);
          const push = wave * falloff * PULSE_STRENGTH;
          pt.vx += nx * push * dt;
          pt.vy += ny * push * dt;
          if (wave > 0.6) pt.glow = Math.min(2.2, pt.glow + (wave - 0.6) * 0.3 * dt);
          break;
        }
      }
    }

    // Two-finger combos — an extra force layered on top of each finger's
    // individual pull, computed once using both touch points together.
    // Every mode gets its own combo so a second finger genuinely changes
    // the shape of the effect rather than just adding a second copy of it.
    if (activePointers.length === 2) {
      applyComboForce(pt, dt, activePointers[0], activePointers[1]);
    } else if (activePointers.length >= 3) {
      // 3+ finger combos — the touches now define a polygon instead of a
      // single line, so the "extra" behavior layered on top is shape-based:
      // a ring for Gravity Well, a cage for Repel, a shared rotation for
      // Swirl/Orbit around the centroid of every active touch.
      applyMultiForce(pt, dt, activePointers, polygon);
    }
  }

  // Keeps two-finger Attract / Gravity Well alive instead of dying out once
  // particles clump onto one of the two fingers. Once a particle has settled
  // right on top of a finger it has nowhere left to go — this quietly moves
  // it just past the *other* finger and aims it back across the midpoint
  // toward the first, so it keeps sweeping the whole gap between the two
  // touches rather than sitting in a dead pile at either end.
  const HANDOFF_RADIUS = 16; // how "clumped onto a finger" has to look before it hands off
  const HANDOFF_COOLDOWN = 45; // frames before a particle is eligible to hand off again
  function handoffTeleport(pt, dt, p1, p2) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
    const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
    let from = null, to = null;
    if (d1 < HANDOFF_RADIUS) { from = p1; to = p2; }
    else if (d2 < HANDOFF_RADIUS) { from = p2; to = p1; }
    if (!from) return;

    // land just beyond the target finger, on the far side away from "from" —
    // so the particle's very next step re-enters the segment between the
    // two fingers and has to cross the midpoint to reach "from" again
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist; // unit vector from -> to

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    // velocity aimed back along the line toward "from", so it immediately
    // starts traversing the midpoint instead of pausing at the new well
    const speed = rand(1.6, 2.6);
    pt.vx = -ux * speed;
    pt.vy = -uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyComboForce(pt, dt, p1, p2) {
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const segDx = p2.x - p1.x, segDy = p2.y - p1.y;
    const segLen = Math.max(1, Math.hypot(segDx, segDy));
    const ux = segDx / segLen, uy = segDy / segLen; // unit vector along the line between the two fingers

    // closest point on the finger-to-finger segment, clamped to its ends
    const t = Math.max(0, Math.min(1, ((pt.x - p1.x) * ux + (pt.y - p1.y) * uy) / segLen));
    const closestX = p1.x + ux * segLen * t, closestY = p1.y + uy * segLen * t;
    const pdx = pt.x - closestX, pdy = pt.y - closestY;
    const pdist = Math.max(6, Math.hypot(pdx, pdy));
    const pnx = pdx / pdist, pny = pdy / pdist; // perpendicular direction away from the line

    const reach = REACH_BY_MODE[mode] || FALLOFF_REACH;
    const falloff = reach / (reach + pdist);

    switch (mode) {
      case 'Swirl': {
        // binary vortex — particles orbit the shared midpoint of both
        // fingers instead of circling each fingertip on its own
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.55 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.55 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // pressure wall — pushed away from the line connecting the two
        // fingers rather than two separate circular repel zones
        pt.vx += pnx * falloff * falloff * 2.0 * dt;
        pt.vy += pny * falloff * falloff * 2.0 * dt;
        break;
      }
      case 'Attract': {
        // bridge — pulled toward the nearest point on the line, so
        // particles between the two fingers stretch into a taut strand
        pt.vx -= pnx * falloff * 0.9 * dt;
        pt.vy -= pny * falloff * 0.9 * dt;
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Orbit': {
        // binary star — the two orbit rings slowly revolve around their
        // shared midpoint, on top of each particle circling its own ring
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.35 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.35 * pt.spinJitter * dt;
        break;
      }
      case 'Wind': {
        // funnel — drawn onto the line between the fingers, then swept
        // along it, like wind being channeled through a corridor
        pt.vx -= pnx * falloff * 0.5 * dt;
        pt.vy -= pny * falloff * 0.5 * dt;
        pt.vx += ux * falloff * 0.4 * dt;
        pt.vy += uy * falloff * 0.4 * dt;
        break;
      }
      case 'Gravity Well': {
        // twin-strand bridge — a minority of particles ('line') get pulled
        // hard onto the exact segment between the two wells, forming a taut
        // bright core. Everyone else ('coil') gets pulled toward a target
        // offset from that line that winds sinusoidally along its length
        // and drifts over time, so they wrap around the core like a coil
        // instead of just orbiting whichever well is nearer.
        if (pt.strand === 'line') {
          pt.vx -= pnx * falloff * falloff * 2.6 * dt;
          pt.vy -= pny * falloff * falloff * 2.6 * dt;
        } else {
          const COIL_AMPLITUDE = 34;
          const COIL_FREQ = 5.5; // winds per full finger-to-finger span
          const coilTarget = pt.coilSide * COIL_AMPLITUDE *
            Math.sin(t * Math.PI * COIL_FREQ + pt.coilPhase + pt.wobble * 0.5);
          // signed perpendicular distance from the line: positive on the
          // pnx/pny side, negative on the other — lets coilTarget swing
          // particles across both sides of the line as t sweeps along it
          const signedDist = pdx * pnx + pdy * pny;
          const springForce = (signedDist - coilTarget) * 0.05;
          pt.vx -= pnx * springForce * dt;
          pt.vy -= pny * springForce * dt;
          // gentle pull along the line so coil particles stay strung
          // between the two wells rather than drifting off past either end
          pt.vx += ux * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
          pt.vy += uy * falloff * falloff * 0.5 * dt * (t < 0.5 ? 1 : -1);
        }
        handoffTeleport(pt, dt, p1, p2);
        break;
      }
      case 'Comet': {
        // crossfire — particles caught inside both comet radii at once
        // get flung sideways off the line, like two streams colliding
        const d1 = Math.hypot(pt.x - p1.x, pt.y - p1.y);
        const d2 = Math.hypot(pt.x - p2.x, pt.y - p2.y);
        if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
          pt.vx += pnx * 6 * dt;
          pt.vy += pny * 6 * dt;
          pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
        }
        break;
      }
      case 'Bloom': {
        // Two touches create a standing wave between them: particles are pulled
        // toward the segment connecting the fingers, then pushed outward
        // perpendicularly in rhythmic waves, like a beating heart between
        // the two touches.
        const wave = Math.sin(pdist * 0.05 - simTime * 2.5);
        const force = wave > 0 ? wave * 1.5 : wave * 0.7;
        pt.vx += pnx * force * falloff * dt;
        pt.vy += pny * force * falloff * dt;
        // Keep particles from escaping the ends of the segment
        const edgePull = (t - 0.5) * 2.0; // -1 at p1, 1 at p2
        pt.vx -= ux * edgePull * falloff * 0.5 * dt;
        pt.vy -= uy * edgePull * falloff * 0.5 * dt;
        break;
      }
      case 'Lattice': {
        // The line between two fingers becomes a soft, evenly spaced rail;
        // particles retain their fixed grid offset instead of collapsing.
        const railT = pt.latticeOffset;
        const side = (pt.latticeBand - 2) * 12; // 5 bands: -24, -12, 0, 12, 24
        const tx = p1.x + ux * segLen * railT + pnx * side;
        const ty = p1.y + uy * segLen * railT + pny * side;
        pt.vx += (tx - pt.x) * 0.035 * dt;
        pt.vy += (ty - pt.y) * 0.035 * dt;
        break;
      }
      case 'Whirlpool': {
        // twin drain — both fingers churn together into one shared spiral
        // around their midpoint (same escalating spin + center eject as
        // the single-finger version below, just centered on the pair) so
        // bringing two fingers together builds one bigger, faster
        // whirlpool instead of two competing ones fighting each other
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        const closeness = 1 - Math.min(1, mdist / reach);
        const spin = WHIRLPOOL_SPIN * (1 + closeness * closeness * WHIRLPOOL_SPIN_RAMP);
        pt.vx += -mny * mfall * spin * 0.7 * dt;
        pt.vy += mnx * mfall * spin * 0.7 * dt;
        if (mdist < WHIRLPOOL_DRAIN) {
          const eject = (1 - mdist / WHIRLPOOL_DRAIN) * WHIRLPOOL_EJECT;
          pt.vx += -mny * eject * dt;
          pt.vy += mnx * eject * dt;
        } else {
          pt.vx -= mnx * mfall * mfall * WHIRLPOOL_PULL * 0.6 * dt;
          pt.vy -= mny * mfall * mfall * WHIRLPOOL_PULL * 0.6 * dt;
        }
        break;
      }
      case 'Pulse': {
        // reinforcement — the two fingers act as one bigger, slower wave
        // source centered on their midpoint, layered underneath each
        // finger's own independent pulse from the loop above (which
        // already sum together on their own into natural interference
        // bands), so spreading two fingers swells the whole field with
        // one deep, shared breath instead of just two small ripples
        const mdx = pt.x - mx, mdy = pt.y - my;
        const mdist = Math.max(0.001, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const mfall = reach / (reach + mdist);
        const wave = Math.sin(mdist * PULSE_FREQ * 0.5 - simTime * PULSE_SPEED * 0.6);
        const push = wave * mfall * PULSE_STRENGTH * 0.6;
        pt.vx += mnx * push * dt;
        pt.vy += mny * push * dt;
        break;
      }
    }
  }

  function summarizeTouches(points) {
    let cx = 0, cy = 0;
    for (let i = 0; i < points.length; i++) { cx += points[i].x; cy += points[i].y; }
    const count = points.length;
    return { cx: cx / count, cy: cy / count, count };
  }

  // ---------- 3+ finger combos ----------
  // With 3+ touches down, the fingers stop describing a single line and
  // start describing a polygon. buildPolygon() orders the raw touch points
  // by angle around their shared centroid (so the edges trace a simple,
  // non-self-intersecting loop even if the fingers were placed or listed
  // out of order) and precomputes each edge's direction, outward normal,
  // and position along the total perimeter. This runs once per frame in
  // frame(), NOT once per particle — with up to 5 points the sort is
  // trivial, but doing it 10,000+ times a frame would not be.
  function buildPolygon(points) {
    const n = points.length;
    let cx = 0, cy = 0;
    for (let i = 0; i < n; i++) { cx += points[i].x; cy += points[i].y; }
    cx /= n; cy /= n;

    const ordered = points.slice().sort((a, b) =>
      Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

    const edges = [];
    let perimeter = 0;
    for (let i = 0; i < n; i++) {
      const p1 = ordered[i], p2 = ordered[(i + 1) % n];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const segLen = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / segLen, uy = dy / segLen;
      // outward normal — start with one perpendicular candidate, flip it
      // if it happens to point back toward the centroid instead of away
      let nx = -uy, ny = ux;
      const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
      if ((midX - cx) * nx + (midY - cy) * ny < 0) { nx = -nx; ny = -ny; }
      edges.push({ p1, p2, ux, uy, nx, ny, segLen, perimStart: perimeter });
      perimeter += segLen;
    }

    // shared "spin" of the whole touch cluster — average tangential
    // velocity of every finger relative to the centroid. Used by Wind's
    // multi-finger cyclone: dragging fingers around each other (rather
    // than straight-line dragging) builds up a shared rotation.
    let spin = 0;
    for (let i = 0; i < n; i++) {
      const p = points[i];
      const dx = p.x - cx, dy = p.y - cy;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const tx = -dy / dist, ty = dx / dist;
      spin += (p.vx || 0) * tx + (p.vy || 0) * ty;
    }
    spin /= n;

    return { cx, cy, edges, perimeter, points: ordered, spin };
  }

  // Finds the nearest polygon edge to a particle, and where along that
  // edge (t, clamped to the segment) the closest point sits. Shared by
  // every multi-finger mode that pulls particles toward the shape's
  // boundary (Attract, Wind, Gravity Well, Repel), computed fresh per
  // particle since the closest edge differs particle to particle, but the
  // polygon itself (edges, ordering, centroid) is only built once per frame.
  function nearestEdgeInfo(pt, polygon) {
    let best = null, bestDist = Infinity, bestT = 0;
    for (let i = 0; i < polygon.edges.length; i++) {
      const e = polygon.edges[i];
      const t = Math.max(0, Math.min(1, ((pt.x - e.p1.x) * e.ux + (pt.y - e.p1.y) * e.uy) / e.segLen));
      const cx2 = e.p1.x + e.ux * e.segLen * t, cy2 = e.p1.y + e.uy * e.segLen * t;
      const d = Math.hypot(pt.x - cx2, pt.y - cy2);
      if (d < bestDist) { bestDist = d; best = e; bestT = t; }
    }
    return { edge: best, dist: bestDist, t: bestT };
  }

  // Standard ray-casting point-in-polygon test, used by Repel's cage.
  function pointInPolygon(x, y, ordered) {
    let inside = false;
    for (let i = 0, j = ordered.length - 1; i < ordered.length; j = i++) {
      const xi = ordered[i].x, yi = ordered[i].y;
      const xj = ordered[j].x, yj = ordered[j].y;
      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // Generalized version of handoffTeleport for 3+ fingers: instead of
  // bouncing between exactly two wells, a particle that clumps onto any
  // vertex hops to the NEXT vertex around the ring and keeps its velocity
  // pointed the same way it was already traveling around the loop — so
  // with N fingers down, particles keep circulating the whole ring instead
  // of pooling at one corner. (With exactly 2 points this degenerates into
  // the same back-and-forth as the two-finger version.)
  function handoffTeleportPolygon(pt, dt, polygon) {
    if (pt.teleportCooldown > 0) { pt.teleportCooldown -= dt; return; }

    const pts = polygon.points;
    let nearestIdx = -1, nearestDist = HANDOFF_RADIUS;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.hypot(pt.x - pts[i].x, pt.y - pts[i].y);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    }
    if (nearestIdx === -1) return;

    const from = pts[nearestIdx];
    const to = pts[(nearestIdx + 1) % pts.length]; // always advance forward around the ring
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / dist, uy = dy / dist;

    const overshoot = rand(HANDOFF_RADIUS * 1.1, HANDOFF_RADIUS * 1.8);
    const jitter = rand(-10, 10);
    pt.x = to.x + ux * overshoot + -uy * jitter;
    pt.y = to.y + uy * overshoot + ux * jitter;

    const speed = rand(1.6, 2.6);
    pt.vx = ux * speed; // keep moving FORWARD around the ring, toward the vertex after "to"
    pt.vy = uy * speed;
    pt.glow = Math.min(2.2, pt.glow + 0.5);

    pt.teleportCooldown = HANDOFF_COOLDOWN + rand(-10, 10);
  }

  function applyMultiForce(pt, dt, activePointers, polygon) {
    switch (mode) {
      case 'Swirl': {
        // Turbulence identity now lives in the per-pointer loop above
        // (alternating spin direction per finger); no extra shared-centroid
        // rotation here, so Swirl reads as fighting eddies rather than one
        // clean rotation — that's what separates it from Orbit below.
        break;
      }
      case 'Orbit': {
        // small star cluster — each finger still holds its own ring, and
        // the whole cluster of rings slowly revolves around their shared
        // centroid, same idea as the two-finger binary star, generalized.
        // Kept gentle since the per-finger ring springs above (now scaled
        // down by pointerScale as more fingers join) already do most of
        // the work — this is just the slow shared drift on top.
        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mnx = mdx / mdist, mny = mdy / mdist;
        const reach = REACH_BY_MODE.Orbit;
        const mfall = reach / (reach + mdist);
        pt.vx += -mny * mfall * 0.18 * pt.spinJitter * dt;
        pt.vy += mnx * mfall * 0.18 * pt.spinJitter * dt;
        break;
      }
      case 'Repel': {
        // cage — particles trapped inside the polygon get blown outward
        // through whichever edge is nearest, like pressure finding the
        // thinnest wall of a balloon. Particles already outside are left
        // to the normal per-finger repel from the loop above.
        if (!polygon || !pointInPolygon(pt.x, pt.y, polygon.points)) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (info.edge) {
          pt.vx += info.edge.nx * 2.2 * dt;
          pt.vy += info.edge.ny * 2.2 * dt;
        }
        break;
      }
      case 'Attract': {
        // web — pulled toward the nearest edge of the polygon traced by
        // every active touch, so particles between any two neighboring
        // fingers stretch into a loose strand. Each particle springs
        // toward its own fixed perpendicular offset (webOffset) and a
        // fixed point along the edge's length (via coilPhase) instead of
        // a hard zero-distance target, so a whole crowd of particles
        // spreads into a soft band along the shape instead of collapsing
        // onto a single thin line or piling up at one spot on it.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Attract;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.35;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;

        // gentle pull toward this particle's own fixed point along the
        // edge, so particles fan out along its length instead of bunching
        const targetT = 0.5 + 0.5 * Math.sin(pt.coilPhase);
        const tPull = (targetT - info.t) * falloff * 0.4;
        pt.vx += e.ux * tPull * dt;
        pt.vy += e.uy * tPull * dt;
        break;
      }
      case 'Wind': {
        // cyclone — pulled onto the nearest edge of the shape traced by
        // every finger and swept along it, same corridor idea as the
        // two-finger funnel but softened with the same per-particle
        // spread (webOffset / coilPhase) as multi-finger Attract, so the
        // corridor stays a wide band instead of collapsing into one dense
        // streak; on top of that the whole system picks up a shared spin
        // from how the fingers are moving relative to each other
        // (polygon.spin), so dragging fingers around one another builds
        // up a storm instead of just several separate corridors
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const e = info.edge;
        const closestX = e.p1.x + e.ux * e.segLen * info.t;
        const closestY = e.p1.y + e.uy * e.segLen * info.t;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, info.dist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE.Wind;
        const falloff = reach / (reach + pdist);

        const signedDist = pdx * pnx + pdy * pny;
        const springForce = (signedDist - pt.webOffset) * falloff * 0.18;
        pt.vx -= pnx * springForce * dt;
        pt.vy -= pny * springForce * dt;
        pt.vx += e.ux * falloff * 0.3 * dt;
        pt.vy += e.uy * falloff * 0.3 * dt;

        const mdx = pt.x - polygon.cx, mdy = pt.y - polygon.cy;
        const mdist = Math.max(6, Math.hypot(mdx, mdy));
        const mtx = -mdy / mdist, mty = mdx / mdist;
        const mfall = reach / (reach + mdist);
        pt.vx += mtx * polygon.spin * mfall * 0.35 * dt;
        pt.vy += mty * polygon.spin * mfall * 0.35 * dt;
        break;
      }
      case 'Comet': {
        // multi-crossfire — any pair of neighboring fingers that both
        // have this particle inside their comet radius flings it side-
        // ways off that edge, so 3+ fingers create several crossfire
        // seams around the shape instead of just one
        if (!polygon) break;
        for (let i = 0; i < polygon.edges.length; i++) {
          const e = polygon.edges[i];
          const d1 = Math.hypot(pt.x - e.p1.x, pt.y - e.p1.y);
          const d2 = Math.hypot(pt.x - e.p2.x, pt.y - e.p2.y);
          if (d1 < COMET_RADIUS && d2 < COMET_RADIUS) {
            pt.vx += e.nx * 6 * dt;
            pt.vy += e.ny * 6 * dt;
            pt.glow = Math.min(2.2, pt.glow + 0.15 * dt);
          }
        }
        break;
      }
      case 'Gravity Well': {
        // ring — a closed loop of wells instead of a single bridge. Same
        // line/coil roles as the two-finger version, but the coil's phase
        // is now driven by position along the WHOLE perimeter, so the
        // winding pattern is continuous all the way around the ring
        // instead of resetting at each edge, and handoffTeleportPolygon
        // keeps particles circulating the ring instead of pooling at
        // any one finger.
        if (!polygon) break;
        const info = nearestEdgeInfo(pt, polygon);
        if (!info.edge) break;
        const best = info.edge, bestT = info.t, bestDist = info.dist;

        const closestX = best.p1.x + best.ux * best.segLen * bestT;
        const closestY = best.p1.y + best.uy * best.segLen * bestT;
        const pdx = pt.x - closestX, pdy = pt.y - closestY;
        const pdist = Math.max(6, bestDist);
        const pnx = pdx / pdist, pny = pdy / pdist;
        const reach = REACH_BY_MODE['Gravity Well'];
        const falloff = reach / (reach + pdist);
        const globalT = (best.perimStart + bestT * best.segLen) / polygon.perimeter;

        if (pt.strand === 'line') {
          pt.vx -= pnx * falloff * falloff * 2.6 * dt;
          pt.vy -= pny * falloff * falloff * 2.6 * dt;
        } else {
          const COIL_AMPLITUDE = 34, COIL_FREQ = 5.5;

    draft.colors.push('#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
    renderDraftCols(); previewDraft();
  });
  document.getElementById('cancelCustomPaletteBtn').addEventListener('click', () => closeEditor(true));
  document.getElementById('saveCustomPaletteBtn').addEventListener('click', () => {
    if (!draft) return;
    const key = editKey || ('custom_' + Date.now().toString(36));
    const n = Object.keys(customPalettes).length + (editKey ? 0 : 1);
    const pal = { name: (draft.name || 'Custom ' + n).slice(0, 14), bg: draft.bg, colors: draft.colors.slice() };
    PALETTES[key] = pal; customPalettes[key] = pal; saveCustomPalettes(customPalettes);
    if (paletteSwatches[key]) swatchLook(paletteSwatches[key], pal); else addPaletteSwatch(key, true);
    palEditor.hidden = true; delete PALETTES.__draft; editKey = null; draft = null;
    selectPalette(key);
  });

  Object.keys(PALETTES).forEach((key) => addPaletteSwatch(key, false));
  addSwatch = document.createElement('button');
  addSwatch.className = 'swatch add';
  addSwatch.innerHTML = '<span>+ Custom</span>';
  addSwatch.addEventListener('click', () => openEditor(null));
  paletteRow.appendChild(addSwatch);

  document.getElementById('clearBtn').addEventListener('click', scatterField);

  buildSettingsUI();
  document.getElementById('resetSettingsBtn').addEventListener('click', () => {
    applySettings({});
    saveSettings();
  });

  // Restore last-used settings, if any. Called after every control is
  // wired up so we can just set values + click the right chips/swatches
  // rather than duplicating each handler's logic.
  function restoreSettings() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch { saved = null; }
    if (!saved) { applySettings({}); return; }

    if (saved.mode && modeChips[saved.mode]) modeChips[saved.mode].click();
    if (saved.paletteKey && paletteSwatches[saved.paletteKey]) paletteSwatches[saved.paletteKey].click();

    applySettings(saved);
  }

  // Press Play is the music player, so the game has no player of its own.
  // The visualizer code below still reads these; they stay silent.
  const audioLevels = { bass: 0, mid: 0, high: 0, kick: 0, snare: 0, hat: 0 };
  function readAudioEnergy() { return audioLevels; }

  restoreSettings();
  settingsReady = true;

  // ---------- Dock hide / show ----------
  const dock = document.getElementById('dock');
  const dockHandle = document.getElementById('dockHandle');
  const showDockBtn = document.getElementById('showDockBtn');

  function hideDock() {
    dock.classList.add('hidden');
    showDockBtn.classList.add('visible');
  }
  function revealDock() {
    dock.classList.remove('hidden');
    showDockBtn.classList.remove('visible');
  }
  dockHandle.addEventListener('click', hideDock);
  showDockBtn.addEventListener('click', revealDock);

  // Sidebar navigation keeps every control available while showing only one
  // focused category at a time, rather than forcing users to scan one long dock.
  const sidebarTabs = Array.from(document.querySelectorAll('.sidebar-tab'));
  const menuSections = Array.from(document.querySelectorAll('.menu-section'));
  const sidebarTitle = document.getElementById('sidebarTitle');
  const sidebarTitles = { modes: 'Interaction', appearance: 'Look', motion: 'Motion', effects: 'Effects' };
  function selectSidebarMenu(menu) {
    sidebarTabs.forEach((tab) => {
      const selected = tab.dataset.menu === menu;
      tab.classList.toggle('active', selected);
      tab.setAttribute('aria-selected', String(selected));
    });
    menuSections.forEach((section) => section.classList.toggle('active', section.dataset.menuPanel === menu));
    sidebarTitle.textContent = sidebarTitles[menu] || 'Controls';
  }
  sidebarTabs.forEach((tab) => tab.addEventListener('click', () => selectSidebarMenu(tab.dataset.menu)));

  // seed the field immediately so particles are visible before any touch
  for (let i = 0; i < targetCount; i++) particles.push(makeParticle());
  // (background is already cleared to the palette color by resize(), called above)
})();
</script>
</body>
