<!DOCTYPE html>
<html lang="en">
<head>
<script src="../pp-hub.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nebula Touch</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebula Touch">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #000000;
    --panel: rgba(12, 12, 20, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --ink: #eef0f6;
    --ink-dim: #8a8ea3;
    --accent: #7df9ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
    touch-action: none;
    contain: strict;
  }

  /* Title flash on load */
  #title-card {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 5;
    animation: fadeOut 2.2s ease forwards;
  }
  #title-card h1 {
    font-weight: 200;
    letter-spacing: 0.4em;
    margin: 0;
    color: #fff;
    text-shadow: 0 0 40px rgba(125, 249, 255, 0.6);
    font-size: clamp(32px, 10vw, 56px);
  }
  #title-card p {
    margin-top: 10px;
    letter-spacing: 0.3em;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  @keyframes fadeOut {
    0% { opacity: 1; }
    55% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Top status bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px;
    z-index: 3;
    pointer-events: none;
  }
  #topbar .brand {
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  #fps.off { visibility: hidden; }
  #fps {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }

  /* Bottom control dock */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 4;
    padding: 0 14px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.32s ease;
    max-height: 82vh;
  }
  #dock.hidden {
    transform: translateY(115%);
    opacity: 0;
    pointer-events: none;
  }

  #dockHandle {
    align-self: center;
    width: 44px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    font-size: 14px;
    cursor: pointer;
  }

  #showDockBtn {
    position: fixed;
    left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(0.85);
    z-index: 6;
    width: 44px; height: 30px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #showDockBtn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) scale(1);
  }

  .mode-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .mode-row::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .chip.active {
    color: #05050a;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  #panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 16px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: calc(82vh - 50px); /* leaves room for the mode row + handle above it */
    overscroll-behavior: contain;
  }

  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .panel-head .label {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim);
  }
  #fpsCapBtn, #reactiveBtn {
    background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; margin-left: 10px;
  }
  #fpsCapBtn.active, #reactiveBtn.active { color: var(--ink); border-color: var(--accent); background: rgba(125,249,255,0.12); }
  #reactiveBtn:disabled { opacity: 0.45; }

  .fx-toggle {
    flex: 0 0 auto;
    background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px;
    color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 7px 14px;
  }
  .fx-toggle.active { color: var(--ink); border-color: var(--accent); background: rgba(125,249,255,0.12); }

  .playlist-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 6px 8px; font-size: 12px; color: var(--ink-dim);
  }
  .playlist-item.active { border-color: rgba(255,255,255,0.6); color: var(--ink); }
  .playlist-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .playlist-item button {
    background: none; border: none; color: inherit; font-size: 13px; padding: 2px 4px; opacity: 0.7;
  }
  .playlist-item button:hover { opacity: 1; }

  .palette-row { display: flex; gap: 10px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .palette-row::-webkit-scrollbar { display: none; }
  .swatch {
    flex: 0 0 84px;
    height: 40px;
    border-radius: 12px;
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    position: relative;
    overflow: hidden;
  }
  .swatch.active { border-color: rgba(255,255,255,0.9); }
  .swatch span { position: relative; z-index: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
  .swatch.add {
    background: rgba(255,255,255,0.04) !important;
    border: 1.5px dashed rgba(255,255,255,0.35);
    color: var(--ink-dim);
  }
  #palEditor { margin: 0 0 14px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); }
  #palEditor[hidden] { display: none; }
  #palName { width: 100%; box-sizing: border-box; min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.25); color: var(--ink); font: inherit; font-size: 13px; margin-bottom: 10px; }
  .pe-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .pe-label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  #palCols { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pe-col { position: relative; }
  .pe-col button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border: none; border-radius: 50%; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; line-height: 18px; }
  #palEditor input[type=color] { width: 44px; height: 44px; padding: 0; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 12px; background: none; }
  #palEditor input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  #palEditor input[type=color]::-webkit-color-swatch { border: none; border-radius: 10px; }
  #palAddCol { width: 100%; min-height: 34px; margin-bottom: 10px; border: 1.5px dashed rgba(255,255,255,0.3); border-radius: 10px; background: none; color: var(--ink-dim); font: inherit; font-size: 12px; }
  .pe-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #saveCustomPaletteBtn { background: rgba(139,92,255,0.35); border-color: rgba(139,92,255,0.8); }
  .swatch .del {
    position: absolute; top: 3px; right: 4px; z-index: 2;
    width: 16px; height: 16px; line-height: 14px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 10px;
  }

  .slider-group { display: flex; flex-direction: column; gap: 0; margin-bottom: 8px; }
  .slider-row .hint { display: block; font-size: 10.5px; color: var(--ink-dim); opacity: 0.7; margin-top: 2px; letter-spacing: 0; }
  .slider-row .value { min-width: 46px; text-align: right; }
  .mini-btn { background: none; border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; color: var(--ink-dim);
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 11px; }
  .mini-btn:active { background: rgba(255,255,255,0.1); }
  .toggle-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 9px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.035);
    color: var(--ink); font: inherit; font-size: 12.5px; text-align: left; }
  .toggle-row small { display: block; color: var(--ink-dim); font-size: 10.5px; margin-top: 2px; }
  .toggle-row .sw { flex: 0 0 auto; width: 34px; height: 20px; border-radius: 999px; background: rgba(255,255,255,0.16); position: relative; transition: background 0.18s; }
  .toggle-row .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.18s; }
  .toggle-row.on .sw { background: var(--accent); }
  .toggle-row.on .sw::after { transform: translateX(14px); background: #05050a; }
  .reset-btn { width: 100%; min-height: 38px; margin: 4px 0 8px; border-radius: 12px; border: 1px solid rgba(255,120,120,0.35);
    background: rgba(255,90,90,0.08); color: #ffb0b0; font: inherit; font-size: 12px; letter-spacing: 0.04em; }
  .menu-section .section-head + .slider-group { margin-top: -2px; }
  .menu-section .section-head:not(:first-child) { margin-top: 10px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); }
  .slider-row { display: flex; justify-content: space-between; align-items: center; }
  .slider-row .label { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.02em; text-transform: none; }
  .slider-row .value { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.14);
    margin: 6px 0 14px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(125, 249, 255, 0.7);
  }

  /* Segmented control sidebar */
  #dock {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: auto;
    z-index: 8;
    width: min(376px, calc(100vw - 24px));
    max-height: none;
    padding: 0;
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 0;
    overflow: hidden;
    background: rgba(10, 10, 18, 0.78);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.24s ease;
  }
  #dock.hidden {
    transform: translateX(calc(100% + 24px));
    opacity: 0;
    pointer-events: none;
  }
  #sidebarNav {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 7px;
    padding: 12px 8px;
    background: rgba(255, 255, 255, 0.035);
    border-right: 1px solid var(--panel-border);
  }
  .sidebar-tab {
    min-height: 58px;
    padding: 7px 3px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-size: 9px;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .sidebar-tab .tab-icon {
    display: block;
    margin-bottom: 4px;
    font-size: 17px;
    letter-spacing: 0;
  }
  .sidebar-tab.active {
    color: var(--accent);
    background: rgba(125, 249, 255, 0.1);
    border-color: rgba(125, 249, 255, 0.3);
  }
  #sidebarContent {
    min-width: 0;
    overflow: hidden;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 58px;
    padding: 0 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  .sidebar-eyebrow {
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  #dockHandle {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.045);
    color: var(--ink-dim);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
  }
  .menu-section {
    display: none;
    height: calc(100% - 58px);
    overflow-y: auto;
    padding: 16px;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .menu-section.active { display: block; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .section-head .label {
    color: var(--ink-dim);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .section-note {
    margin: -4px 0 14px;
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1.45;
  }
  .mode-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    overflow: visible;
    padding: 0;
  }
  .chip {
    width: 100%;
    min-height: 42px;
    padding: 8px 9px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.045);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    font-size: 12px;
    text-align: left;
    white-space: normal;
  }
  .sidebar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .sidebar-actions button, .audio-actions button, #loadUrlBtn,
  #saveCustomPaletteBtn, #cancelCustomPaletteBtn {
    min-height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #clearBtn { color: var(--ink-dim); }
  .audio-actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
    margin-bottom: 10px;
  }
  .audio-url-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .audio-url-row input { min-width: 0; flex: 1; }
  .player-now {
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid rgba(125, 249, 255, 0.16);
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(125, 249, 255, 0.09), rgba(139, 92, 255, 0.06));
  }
  .player-state, .queue-meta {
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .now-track {
    overflow: hidden;
    margin: 5px 0 8px;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player-time {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    color: var(--ink-dim);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  #seekSlider { margin: 3px 0 0; }
  .player-transport, .player-options, .player-utilities {
    display: grid;
    gap: 7px;
    margin-bottom: 9px;
  }
  .player-transport { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .player-options, .player-utilities { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .player-button, .player-option {
    min-height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .player-button.primary {
    border-color: rgba(125, 249, 255, 0.48);
    background: rgba(125, 249, 255, 0.14);
    color: var(--accent);
  }
  .player-option.active {
    border-color: rgba(125, 249, 255, 0.48);
    color: var(--accent);
    background: rgba(125, 249, 255, 0.1);
  }
  .player-button:disabled, .player-option:disabled { opacity: 0.42; }
  .playlist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .queue-tools {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .queue-clear, .playlist-actions button {
    min-width: 28px;
    min-height: 28px;
    padding: 0 7px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink-dim);
    font: inherit;
    font-size: 11px;
  }
  .queue-clear { color: #ff9d9d; }
  .queue-clear:disabled { opacity: 0.35; }
  .playlist-item .track-index {
    min-width: 18px;
    color: var(--ink-dim);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .playlist-actions {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .playlist-actions button:disabled { opacity: 0.3; }
  .player-utilities { margin-bottom: 10px; }
  .background-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 10px;
  }
  .background-controls button, .background-controls select {
    min-width: 0;
    min-height: 36px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .background-controls button.active {
    color: var(--accent);
    border-color: rgba(125, 249, 255, 0.48);
    background: rgba(125, 249, 255, 0.1);
  }
  .visualizer-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    padding: 8px 10px;
    border: 1px solid rgba(125, 249, 255, 0.14);
    border-radius: 10px;
    background: rgba(125, 249, 255, 0.04);
  }
  .visualizer-controls label {
    flex: 1;
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;

<script type="module">
import * as THREE from 'three';
(function () {
  const canvas = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: false, powerPreference: 'high-performance' });
  } catch (err) {
    renderer = null;
  }
  if (!renderer) {
    document.body.innerHTML = '<div style="color:#eee;font-family:sans-serif;padding:40px;">WebGL is not available in this browser.</div>';
    return;
  }
  renderer.autoClear = false; // every target is either fully repainted by the fade quad or explicitly .clear()'d — see resize()/palette switch
  let W, H, DPR;
  const hardwareThreads = navigator.hardwareConcurrency || 4;
  const deviceMemoryGb = navigator.deviceMemory || 4;
  const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  // Fidelity is the default: resolution, particle count, bloom cadence, and
  // touch physics exactly match the user's controls. Optional safeguards can
  // be enabled manually from Motion when a device needs extra headroom.
  let renderQualityScale = 1;
  let qualityMode = 'off';
  let pendingQualityScale = null;
  let slowFrameStreak = 0;
  let fastFrameStreak = 0;
  let cameraDirty = true;
  let bloomFrameInterval = renderQualityScale <= 0.65 ? 2 : 1;
  let bloomFrameCounter = 0;

  // ---------- Scene / camera ----------
  // Particles live in a real 3D volume: worldX/worldY mirror the old pixel
  // grid (so all the touch-interaction math below is completely untouched),
  // worldZ is a per-particle depth that gives the field actual thickness.
  // The camera sits fixed, dead-on-center — depth still reads through
  // per-particle size falloff (closer particles render bigger), which is
  // what sells the 3D modes' rotation without any camera motion at all.
  const particleScene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 10, 10000);
  let DEPTH = 400; // half-thickness of the particle volume, recomputed in resize()

  function updateCamera() {
    // Only MODES_3D members (Sphere, Cosmos) have real
    // rotating 3D depth, so only they need the extra orbitRadius margin to
    // stay framed through a full spin. Every other mode sits its particles
    // flat at z=0, so the camera sits at the exact fit distance — using
    // orbitRadius for them left a ~20% gap on every side (letterboxing).
    const dist = (MODES_3D.has(mode) ? camera.userData.orbitRadius : camera.userData.flatRadius) || 800;
    // Point-size falloff is normalized against this same distance so a
    // particle sitting at world z=0 always renders at its calibrated
    // pixel size — since dist differs by mode, the uniform has to track
    // it here every frame rather than being fixed once in resize().
    if (particleMaterial) particleMaterial.uniforms.uSizeScale.value = dist;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    cameraDirty = false;
  }

  // Touches are still expressed in the same 2D "simulation space" every
  // force function below already works in — we convert a screen point into
  // that space by raycasting onto the world's z=0 plane instead of using
  // clientX/clientY directly, because the camera's distance from that
  // plane varies by mode (Sphere's wider orbitRadius vs. the exact-fit
  // flatRadius elsewhere), which changes how screen coordinates map onto it.
  const raycaster = new THREE.Raycaster();
  const _ndc = new THREE.Vector2();
  const _groundPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const _hitPoint = new THREE.Vector3();
  function screenToSim(clientX, clientY) {
    _ndc.x = (clientX / W) * 2 - 1;
    _ndc.y = -(clientY / H) * 2 + 1;
    raycaster.setFromCamera(_ndc, camera);
    if (!raycaster.ray.intersectPlane(_groundPlane, _hitPoint)) return null;
    const simX = _hitPoint.x + W / 2;
    const simY = H / 2 - _hitPoint.y;
    const MAXR = Math.max(W, H) * 4;
    if (Math.abs(simX - W / 2) > MAXR || Math.abs(simY - H / 2) > MAXR) return null;
    return { x: simX, y: simY };
  }

  // ---------- GPU trail render targets (ping-pong) ----------
  // Canvas2D got trails "for free" by repainting the background at partial
  // alpha instead of clearing. Here we get the same effect by rendering
  // particles into an offscreen texture, then each frame drawing the
  // PREVIOUS frame's texture back into the new one at slightly reduced
  // alpha (a fullscreen quad, one draw call) before drawing this frame's
  // particles on top. Two targets so we're never reading and writing the
  // same texture at once.
  let fbos = [];
  let particleLayer = null; // this frame's particles alone, on transparent black
  function makeFBO(w, h) {
    return new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      wrapS: THREE.ClampToEdgeWrapping,
      wrapT: THREE.ClampToEdgeWrapping,
      format: THREE.RGBAFormat,
      depthBuffer: false,
      stencilBuffer: false
    });
  }
  function destroyFBOs() {
    fbos.forEach(f => f.dispose());
    fbos = [];
  }
  let pingpong = 0;

  // ---------- Palettes ----------
  // (moved up from below — resize() needs these to clear the trail buffers
  // to the right background color, so they must exist before resize() runs)
  // Every built-in background is true black (#000), so an AMOLED screen's pixels are fully off behind the particles.
  const PALETTES = {
    neon:      { name: 'Neon',      bg: '#000000', colors: ['#7df9ff', '#ff5fd8', '#8b5cff', '#5fffb0'] },
    crystal:   { name: 'Crystal',   bg: '#000000', colors: ['#bfe9ff', '#8fd3ff', '#ffffff', '#6fb8ff'] },
    nature:    { name: 'Nature',    bg: '#000000', colors: ['#8dffb0', '#ffe27a', '#6fff8f', '#c8ff6f'] },
    ember:     { name: 'Ember',     bg: '#000000', colors: ['#ff9d5c', '#ff5c5c', '#ffd15c', '#ff7ab0'] },
    rainbow:   { name: 'Rainbow',   bg: '#000000', colors: ['#ff4d4d', '#ff9d3d', '#ffe83d', '#4dff88', '#3dbaff', '#a05cff', '#ff5cd0'] },
    candy:     { name: 'Candy',     bg: '#000000', colors: ['#ff6ec7', '#ffd93d', '#6effe8', '#c76eff', '#6effa0'] },
    tropical:  { name: 'Tropical',  bg: '#000000', colors: ['#00ffc8', '#ff2ea6', '#ffea00', '#00b8ff', '#ff6a00'] },
    galaxy:    { name: 'Galaxy',    bg: '#000000', colors: ['#a05cff', '#ff5cd0', '#5cc9ff', '#ffe15c', '#5cffde'] },
    citrus:    { name: 'Citrus',    bg: '#000000', colors: ['#ffde3d', '#ff9d3d', '#d4ff3d', '#ff5c3d', '#3dffb0'] },
    sunset:    { name: 'Sunset',    bg: '#000000', colors: ['#ff5c8a', '#ff9d3d', '#ffe15c', '#c75cff', '#5c8aff'] },
    aurora:    { name: 'Aurora',    bg: '#000000', colors: ['#5cffb0', '#5cd8ff', '#a05cff', '#ff5ce0', '#e1ff5c'] },
    bubblegum: { name: 'Bubblegum', bg: '#000000', colors: ['#ff8fd6', '#8fd6ff', '#d6ff8f', '#ffe08f', '#c98fff'] }
  };
  let paletteKey = 'neon';
  let paletteBgFloat = hexToRgbFloat(PALETTES[paletteKey].bg);

  // ---------- Custom palettes ----------
  // User-created palettes get merged straight into PALETTES under a
  // generated key, so every existing paletteKey-based lookup (trail bg,
  // particle color picks, swatch rendering, save/restore) keeps working
  // completely unchanged — they're just more entries in the same object.
  const CUSTOM_PALETTES_KEY = 'nebulaCustomPalettes';
  function loadCustomPalettes() {
    try { return JSON.parse(localStorage.getItem(CUSTOM_PALETTES_KEY)) || {}; }
    catch { return {}; }
  }
  function saveCustomPalettes(obj) {
    localStorage.setItem(CUSTOM_PALETTES_KEY, JSON.stringify(obj));
  }
  const customPalettes = loadCustomPalettes();
  Object.keys(customPalettes).forEach((key) => { PALETTES[key] = customPalettes[key]; });
  if (PPHub.has('palette')) PALETTES.pressplay = { name: 'Press Play', bg: '#000000', colors: ['#6ee7d0', '#8b5cff', '#ff5fd8', '#ffffff', '#a68bff'] };   // Press Play exclusive
  if (PPHub.has('palette2')) PALETTES.pressplaysunset = { name: 'Press Play Sunset', bg: '#000000', colors: ['#ffb36e', '#ff6a5c', '#ff5fd8', '#8b5cff', '#fff1d6'] };
  if (PPHub.has('palette3')) PALETTES.pressplayfrost = { name: 'Press Play Frost', bg: '#000000', colors: ['#a8f0ff', '#6ee7d0', '#6aa8ff', '#e9f6ff', '#8b5cff'] };
  if (PPHub.has('palette4')) PALETTES.pressplaymono = { name: 'Press Play Mono', bg: '#000000', colors: ['#ffffff', '#c9ccd4', '#8d919c', '#5c606b', '#3a3d46'] };

  function hexToRgbFloat(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    return [
      parseInt(hex.slice(0, 2), 16) / 255,
      parseInt(hex.slice(2, 4), 16) / 255,
      parseInt(hex.slice(4, 6), 16) / 255
    ];
  }

  function clearTargetToColor(rt, hexColor) {
    const c = hexToRgbFloat(hexColor);
    renderer.setRenderTarget(rt);
    renderer.setClearColor(new THREE.Color(c[0], c[1], c[2]), 1);
    renderer.clear(true, false, false);
    renderer.setRenderTarget(null);
  }

  // Shape radius is capped to whatever fits inside the screen with margin,
  // recomputed on resize — since the shape is locked to screen center and
  // can rotate to any angle, this is what keeps it from ever poking past
  // the edges no matter which way it's turned.
  let SPHERE_RADIUS = 130;
  function updateSphereRadius() {
    SPHERE_RADIUS = Math.max(40, Math.min(W, H) * 0.5 - 40);
  }

  let sharpRender = true; // off = internal render resolution is halved (upscaled to fill screen) — big GPU-fillrate win on slow/high-DPI devices
  function resize() {
    // Scale the internal pixel budget independently from CSS dimensions. This is
    // the strongest mobile-GPU safeguard because all trail and bloom passes use it.
    DPR = Math.min(window.devicePixelRatio || 1, 2) * (sharpRender ? 1 : 0.5) * renderQualityScale;
    W = window.innerWidth;
    H = window.innerHeight;
    DEPTH = Math.min(W, H) * 0.5;
    updateSphereRadius();

    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, true);

    camera.aspect = W / H;
    const fovRad = THREE.MathUtils.degToRad(camera.fov);
    // exact edge-to-edge distance for the field to fill the screen when the
    // camera is dead-on. camera.fov is the VERTICAL field of view, so this
    // has to be measured against H specifically (not max(W,H)) — aspect
    // then carries the correct horizontal extent automatically. Using
    // max(W,H) here used to stretch the world<->screen mapping unevenly in
    // landscape, which is what threw off touch position (and therefore
    // burst/release distances) in flat mode.
    const exactFitDist = (H / 2) / Math.tan(fovRad / 2);
    camera.userData.flatRadius = exactFitDist;
    // 3D auto/drag get a generous margin on top of that so the field stays
    // comfortably framed through the whole azimuth sweep / free-look drag,
    // not just when facing the camera dead-on
    camera.userData.orbitRadius = exactFitDist * 1.25;
    camera.near = 10;
    camera.far = camera.userData.orbitRadius * 4 + DEPTH * 4;
    camera.updateProjectionMatrix();
    // fallback for the very first paint before updateCamera has run once —
    // updateCamera overwrites this every frame with whatever distance the
    // active mode actually uses (flatRadius for everything except Sphere)
    if (particleMaterial) particleMaterial.uniforms.uSizeScale.value = camera.userData.orbitRadius;

    cameraDirty = true;
    destroyFBOs();
    const bw = Math.max(1, Math.round(W * DPR)), bh = Math.max(1, Math.round(H * DPR));
    fbos = [makeFBO(bw, bh), makeFBO(bw, bh)];
    if (particleLayer) particleLayer.dispose();
    particleLayer = makeFBO(bw, bh);
    // clear both to the current palette background so a resize doesn't flash black
    clearTargetToColor(fbos[0], PALETTES[paletteKey].bg);
    clearTargetToColor(fbos[1], PALETTES[paletteKey].bg);

    // Bloom is already softer than the source image; on reduced-quality
    // devices it can safely use a smaller texture without a visible hard edge.
    destroyBloomFBOs();
    const bloomDivisor = renderQualityScale <= 0.65 ? 6 : (renderQualityScale <= 0.85 ? 5 : 4);
    const blw = Math.max(1, Math.round(bw / bloomDivisor)), blh = Math.max(1, Math.round(bh / bloomDivisor));
    bloomFBOs = [makeFBO(blw, blh), makeFBO(blw, blh)];
  }
  window.addEventListener('resize', resize);

  // ---------- three.js materials ----------
  // Particle shader: one gl_PointSize sprite per particle, drawn as a soft
  // radial glow in the fragment shader, with perspective size attenuation
  // (uSizeScale / -mvPosition.z) so particles nearer the camera read as
  // bigger and brighter — that falloff is a big part of what sells the
  // depth. Calibrated so a particle at world depth 0 renders at exactly
  // its original, pre-3D pixel size when the camera is front-on.
  const particleVS = `
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uSizeScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      gl_PointSize = aSize * (uSizeScale / max(1.0, -mvPosition.z));
      vColor = aColor;
      vAlpha = aAlpha;
    }
  `;
  const particleFS = `
    precision mediump float;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uCoreMix;
    void main() {
      // soft round sprite: fades to 0 at the edge of the point instead of
      // a hard square, mimicking the anti-aliased circle ctx.arc() drew
      vec2 d = gl_PointCoord - vec2(0.5);
      float dist = length(d) * 2.0;
      // wide soft halo (the old single-term falloff) plus a small, sharper
      // hot core layered on top — the contrast between a tiny bright center
      // and a wider dim glow is what reads as "glowing" instead of "a
      // blurred disc", and gives the bloom pass a distinct bright point to
      // catch on top of the ambient halo. uCoreMix at 0 collapses this back
      // to the original halo-only look exactly (haloWeight -> 1.0, core
      // contribution -> 0) so the toggle has no discontinuity.
      float halo = smoothstep(1.0, 0.0, dist);
      float core = smoothstep(0.35, 0.0, dist);
      float haloWeight = mix(1.0, 0.75, uCoreMix);
      float a = (halo * haloWeight + core * 0.9 * uCoreMix) * vAlpha;
      if (a <= 0.001) discard;
      // push the core toward white so the very center reads hot rather
      // than just a saturated flat color
      vec3 col = mix(vColor, vec3(1.0), core * 0.65 * uCoreMix);
      // Non-premultiplied: color stays true even at low alpha, so a black
      // particle blends toward black (visible on any non-black background)
      // instead of contributing nothing the way premultiplied-additive did.
      gl_FragColor = vec4(col, a);
    }
  `;
  const particleMaterial = new THREE.ShaderMaterial({
    vertexShader: particleVS,
    fragmentShader: particleFS,
    uniforms: { uSizeScale: { value: camera.userData.orbitRadius || 800 }, uCoreMix: { value: 1 } },
    transparent: true,
    depthTest: false,
    depthWrite: false,
    // Standard (non-additive) alpha blending: a particle's own color always
    // shows through against the background, including pure black — additive
    // blending added nothing for black (0,0,0), making it invisible on any
    // background. The bloom/composite pass still adds the glow on top.
    blending: THREE.NormalBlending
  });

  // Fullscreen-quad fade shader: draws the previous frame's texture back
  // into the new render target at reduced opacity. This IS the trail
  // effect — direct GPU equivalent of the old `ctx.fillRect` with a
  // translucent fill.
  const fadeVS = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;
  const fadeFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uPrev;
    uniform vec3 uBg;
    uniform float uFadeAlpha;
    void main() {
      vec3 prevColor = texture2D(uPrev, vUv).rgb;
      // brighter trail pixels resist the fade a little longer than dim ones
      // do, so hot streaks linger and glow instead of clearing out at the
      // same flat rate as everything else — reads as a luminous tail
      float lum = dot(prevColor, vec3(0.299, 0.587, 0.114));
      float localFade = uFadeAlpha * (1.0 - lum * 0.35);
      float f = clamp(localFade, 0.0, 1.0);
      // The trail buffers are 8-bit: once a pixel's fade step is under half a level it rounds back up and the pixel
      // never gets there, leaving a faint haze. Step at least ~1.5 levels toward the background so it ends exactly on it.
      vec3 d = uBg - prevColor;
      vec3 stepv = d * f;
      vec3 minStep = sign(d) * min(abs(d), vec3(1.5 / 255.0)) * step(0.0001, f);
      vec3 mixed = prevColor + mix(minStep, stepv, step(abs(minStep), abs(stepv)));
      gl_FragColor = vec4(mixed, 1.0);
    }
  `;
  const fadeMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: fadeFS,
    uniforms: { uPrev: { value: null }, uBg: { value: new THREE.Color(0, 0, 0) }, uFadeAlpha: { value: 0 } },
    depthTest: false,
    depthWrite: false
  });
  // Trail pass. The old approach drew particles straight on top of the faded
  // previous frame, so a slow particle landed on its own leftover glow every
  // frame and kept stacking up — longer trails made the whole field brighter.
  // Now this frame's particles are drawn alone into particleLayer, and each
  // pixel keeps whichever is further from the background: the fresh particle
  // or the fading trail ("lighten", not "add"). A trail can only ever be as
  // bright as the particle that left it, so Trail changes length, not brightness.
  const trailFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uPrev;
    uniform sampler2D uLayer;
    uniform vec3 uBg;
    uniform float uFadeAlpha;
    void main() {
      vec3 prevColor = texture2D(uPrev, vUv).rgb;
      float f = clamp(uFadeAlpha, 0.0, 1.0);
      vec3 d = uBg - prevColor;
      vec3 stepv = d * f;
      // 8-bit buffers: always step at least ~1.5 levels so trails end exactly on the background
      vec3 minStep = sign(d) * min(abs(d), vec3(1.5 / 255.0)) * step(0.0001, f);
      vec3 faded = prevColor + mix(minStep, stepv, step(abs(minStep), abs(stepv)));
      vec4 layer = texture2D(uLayer, vUv);
      vec3 cur = uBg * (1.0 - layer.a) + layer.rgb;
      vec3 pick = step(abs(faded - uBg), abs(cur - uBg));
      gl_FragColor = vec4(mix(faded, cur, pick), 1.0);
    }
  `;
  const trailMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: trailFS,
    uniforms: { uPrev: { value: null }, uLayer: { value: null }, uBg: { value: new THREE.Color(0, 0, 0) }, uFadeAlpha: { value: 1 } },
    depthTest: false,
    depthWrite: false
  });
  const trailScene = new THREE.Scene();
  trailScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), trailMaterial));
  const _clearBlack = new THREE.Color(0, 0, 0);

  const postScene = new THREE.Scene();
  const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMaterial));

  // ---------- Bloom (hand-rolled: bright-pass -> separable blur -> additive composite) ----------
  // Same fullscreen-quad-into-an-FBO technique as the fade pass above, just
  // chained: pull the bright pixels (particle hot-cores, dense overlapping
  // clusters) out of the composited frame, blur them at a quarter of the
  // real resolution (cheap, and the softness is the point), then add that
  // blurred glow back on top of the sharp frame when blitting to screen.
  // This is the same idea UnrealBloomPass uses, simplified to one mip.
  // BLOOM_THRESHOLD was tuned for the old additive particle blending, where
  // overlapping particles' colors stacked past 1.0 luminance easily. Now
  // that particles use normal alpha blending (so black particles actually
  // show up), brightness no longer stacks the same way, so the threshold is
  // lowered and strength bumped up to bring glow coverage back to how it
  // looked before.
  const BLOOM_THRESHOLD = 0.35; // luminance floor before a pixel starts contributing to glow
  const BLOOM_STRENGTH = 1.6;   // how strongly the blurred glow is added back on top

  const brightFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uSrc;
    uniform float uThreshold;
    void main() {
      vec3 c = texture2D(uSrc, vUv).rgb;
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      float mask = smoothstep(uThreshold, uThreshold + 0.25, lum);
      gl_FragColor = vec4(c * mask, 1.0);
    }
  `;
  const brightMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: brightFS,
    uniforms: { uSrc: { value: null }, uThreshold: { value: BLOOM_THRESHOLD } },
    depthTest: false,
    depthWrite: false
  });
  const brightScene = new THREE.Scene();
  brightScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), brightMaterial));

  // Standard 5-tap linear-sampling separable Gaussian blur, run twice
  // (horizontal then vertical) to fully blur one axis-pair.
  const blurFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uSrc;
    uniform vec2 uDirection;
    void main() {
      vec3 sum = texture2D(uSrc, vUv).rgb * 0.227027;
      sum += texture2D(uSrc, vUv + uDirection * 1.384615).rgb * 0.316216;
      sum += texture2D(uSrc, vUv - uDirection * 1.384615).rgb * 0.316216;
      sum += texture2D(uSrc, vUv + uDirection * 3.230769).rgb * 0.070270;
      sum += texture2D(uSrc, vUv - uDirection * 3.230769).rgb * 0.070270;
      gl_FragColor = vec4(sum, 1.0);
    }
  `;
  const blurMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: blurFS,
    uniforms: { uSrc: { value: null }, uDirection: { value: new THREE.Vector2(1, 0) } },
    depthTest: false,
    depthWrite: false
  });
  const blurScene = new THREE.Scene();
  blurScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMaterial));

  // Final blit to the visible canvas: sharp composited frame + blurred glow
  // on top, additively. Bilinear sampling the quarter-res bloom texture up
  // to full res is itself part of the softness — free extra blur.
  const compositeFS = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uBase;
    uniform sampler2D uBloom;
    uniform float uBloomStrength;
    void main() {
      vec3 base = texture2D(uBase, vUv).rgb;
      vec3 bloom = texture2D(uBloom, vUv).rgb;
      gl_FragColor = vec4(base + bloom * uBloomStrength, 1.0);
    }
  `;
  const compositeMaterial = new THREE.ShaderMaterial({
    vertexShader: fadeVS,
    fragmentShader: compositeFS,
    uniforms: { uBase: { value: null }, uBloom: { value: null }, uBloomStrength: { value: BLOOM_STRENGTH } },
    depthTest: false,
    depthWrite: false
  });
  const compositeScene = new THREE.Scene();
  compositeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMaterial));

  let bloomFBOs = []; // quarter-res ping-pong pair used for bright-pass + blur
  function destroyBloomFBOs() {
    bloomFBOs.forEach(f => f.dispose());
    bloomFBOs = [];
  }

  // Particle geometry — reused every frame, resized only when the particle
  // count changes, so no per-frame allocation.
  let particleCapacity = 0;
  let posArr, colorArr, sizeArr, alphaArr;
  let posAttr, colorAttr, sizeAttr, alphaAttr;
  // Particle colors change only when a palette changes or particles are added.
  // Avoid uploading the color buffer on every frame when it is unchanged.
  let particleColorDirty = true;
  const particleGeometry = new THREE.BufferGeometry();
  const points = new THREE.Points(particleGeometry, particleMaterial);
  points.frustumCulled = false; // the field moves every frame; skip bounds bookkeeping we'd have to keep recomputing anyway
  particleScene.add(points);

  function ensureParticleBuffers(n) {
    if (n <= particleCapacity) return;
    // Grow geometrically so a large density-slider jump does not trigger a new
    // GPU-buffer allocation on almost every simulation frame.
    particleCapacity = Math.max(1024, n + 512, Math.ceil(particleCapacity * 1.5));
    posArr = new Float32Array(particleCapacity * 3);
    colorArr = new Float32Array(particleCapacity * 3);
    sizeArr = new Float32Array(particleCapacity);
    alphaArr = new Float32Array(particleCapacity);
    posAttr = new THREE.BufferAttribute(posArr, 3).setUsage(THREE.DynamicDrawUsage);
    colorAttr = new THREE.BufferAttribute(colorArr, 3).setUsage(THREE.DynamicDrawUsage);
    sizeAttr = new THREE.BufferAttribute(sizeArr, 1).setUsage(THREE.DynamicDrawUsage);
    alphaAttr = new THREE.BufferAttribute(alphaArr, 1).setUsage(THREE.DynamicDrawUsage);
    particleGeometry.setAttribute('position', posAttr);
    particleGeometry.setAttribute('aColor', colorAttr);
    particleGeometry.setAttribute('aSize', sizeAttr);
    particleGeometry.setAttribute('aAlpha', alphaAttr);
    particleColorDirty = true;
  }

  resize();

  // ---------- Interaction modes ----------
  // These describe HOW touch pushes the always-on field of particles around,
  // not spawn effects — the particle count never changes when you touch.
  const MODES = ['Swirl', 'Repel', 'Attract', 'Orbit', 'Wind', 'Gravity Well', 'Comet', 'Sphere', 'Cosmos', 'Whirlpool', 'Pulse', 'Bloom', 'Lattice', 'Orbit 3D', 'Tornado', 'Flock', 'Magnet', 'Fluid'];
  let mode = 'Swirl';
  // Every mode in this set gets the same real-depth treatment Sphere
  // pioneered: wider orbitRadius camera framing, a rotating formX/Y/Z
  // shape spring instead of a flat force, and z that actually varies
  // instead of easing back to 0. Adding a new 3D mode is: list it here,
  // give it a shapePoint function, and register that function below.
  // Cosmos is the same idea but with a whole ladder of shapes instead of
  // one — see COSMOS_SHAPE_BY_FINGERS — so it counts as a single 3D mode
  // even though what it actually renders changes with finger count.
  // The 3D physics modes (Orbit 3D .. Fluid, see FLOW_3D_MODES) share the
  // 3D camera framing but run real 3D forces instead of shape springs.
  const MODES_3D = new Set(['Sphere', 'Cosmos', 'Orbit 3D', 'Tornado', 'Flock', 'Magnet', 'Fluid']);

  // simTime (accumulated dt, not wall-clock time) — used by any mode whose
  // force depends on elapsed time rather than just current finger position,
  // so its pace scales with the Speed slider like everything else does.
  let simTime = 0;

  // ---------- Whirlpool mode state ----------
  // A continuous spiral drain: particles get pulled inward from a distance,
  // spinning faster and faster the closer they get — the same "ice skater
  // pulling in their arms" feel as real water circling a drain. Right at
  // the center that spin doesn't fizzle out, it flings the particle back
  // outward along its own tangent, so the whole thing recycles into a
  // self-feeding vortex instead of ever collapsing into a dead clump at
  // the middle. It's a plain per-frame force like Swirl or Attract — no
  // capture state, no separate "load then release" gesture to learn, just
  // hold or drag and it keeps churning for as long as a finger is down.
  const WHIRLPOOL_PULL = 1.7;     // inward pull strength outside the drain
  const WHIRLPOOL_SPIN = 0.8;     // base tangential spin strength
  const WHIRLPOOL_SPIN_RAMP = 3;  // how much extra spin gets added as particles approach the drain
  const WHIRLPOOL_DRAIN = 34;     // radius of the central zone that ejects instead of pulling
  const WHIRLPOOL_EJECT = 3.2;    // outward+tangential kick strength inside the drain

  // ---------- Pulse mode state ----------
  // A continuous breathing wave instead of discrete ripple events: rather
  // than spawning an object per tap/drag/release and tracking its age,
  // every particle's push is computed fresh each frame straight from its
  // CURRENT distance to the finger and simTime — sin(dist*freq - time*speed)
  // makes rings of push/pull radiate outward from the touch point forever,
  // for as long as it's held, with nothing to spawn, expire, or clean up.
  // That's what makes it read as one continuous field rather than a
  // one-shot effect that needs retriggering with another tap.
  const PULSE_FREQ = 0.09;     // spatial frequency — controls the spacing between wave rings
  const PULSE_SPEED = 6;       // how fast the wave pattern travels outward, in the same units the old ripple used
  const PULSE_STRENGTH = 1.3;  // overall push amplitude

  // ---------- Bloom / Lattice mode state ----------
  // Bloom creates a radiating expansion: particles get drawn in tightly,
  // pause, and then flare outward in continuous synchronized waves, like a
  // blooming flower rather than a constant swirl or orbit.
  // Lattice creates a soft magnetic grid that can stretch into bridges
  // and polygonal cages as more fingers join.
  const LATTICE_CELL = 42;

  // ---------- Params ----------
  let targetCount = 250;  // desired number of particles on screen — set by slider
  let trailAmt = 45;      // 0-95 -> alpha of fade rect, controls trail length
  let sizeScale = 1;      // multiplier applied to every particle's radius
  let dragCoef = 0.999 - (34 / 100) * 0.099; // friction -> per-frame velocity retention
  let simSpeed = 1;      // multiplier applied to dt each frame — controls overall sim pace
  // Additional Motion controls. Defaults preserve the original field behavior:
  // drift is at its original intensity, while the other new forces begin neutral.
  let ambientDrift = 1;
  let turbulenceStrength = 0;
  let vortexStrength = 0;
  let maxParticleSpeed = 32;
  let edgeReturnStrength = 0;
  // Keeps a smoothed measure of field motion so trails can respond to velocity
  // without flickering from one animation frame to the next.
  let velocityTrails = false;
  let velocityTrailEnergy = 0;
  let bloomEnabled = true;    // toggle: bright-pass/blur/composite pipeline vs a plain passthrough blit
  let bloomStrengthMult = 1;  // 0-2, multiplies BLOOM_STRENGTH — set by slider
  let hotCoreEnabled = true;  // toggle: particleMaterial's uCoreMix uniform, 1 or 0
  let sparkleEnabled = true;  // toggle: whether sparkle particles get their brightness/size/twinkle boost
  let brightnessMult = 1;     // Brightness slider: scales every particle's opacity
  let touchStrength = 1;      // Touch strength slider: scales every touch force
  let releaseStrength = 1;    // Release burst slider: scales the kick when a finger lifts
  let forceWrap = false;      // Forced scroll: every mode wraps off-screen particles to the other side
  let flowIdleSpinMult = 1;   // 3D physics modes: how fast the volume turns (View turn)
  let glowThreshold = 0.35;   // bloom bright-pass floor (lower = more of the field glows)

  // ---------- Particle store (persistent field) ----------
  let particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  // Uniform random point on a unit sphere (not lat/long sampling, which
  // bunches points at the poles) — used to give each particle a fixed
  // "home" position on the Sphere mode shape.
  function randomSpherePoint() {
    const u = rand(-1, 1), th = rand(0, Math.PI * 2), r = Math.sqrt(1 - u * u);
    return { x: r * Math.cos(th), y: r * Math.sin(th), z: u };
  }
  function pickColor() {
    const c = PALETTES[paletteKey].colors;
    return c[(Math.random() * c.length) | 0];
  }

  // Small cache so converting a particle's hex color string to 0-1 floats
  // for the GPU buffer is a lookup, not a re-parse, 10,000 times a frame.
  const colorFloatCache = new Map();
  function colorFloat(hex) {
    let v = colorFloatCache.get(hex);
    if (!v) { v = hexToRgbFloat(hex); colorFloatCache.set(hex, v); }
    return v;
  }

  function makeParticle(x, y) {
    const a = rand(0, Math.PI * 2);
    const speed = rand(0.15, 0.5);
    // Cache the GPU-ready color components on the particle. This avoids a
    // Map lookup and array indirection for every particle on every frame.
    const color = pickColor();
    const [colorR, colorG, colorB] = colorFloat(color);
    // A minority of particles are "sparkles" — brighter, bigger, and they
    // flicker on a sharper cycle instead of the gentle ambient twinkle
    // every particle gets. Scattered among the regular field they read as
    // hero highlights/glints instead of a uniform haze of same-brightness dots.
    const isSparkle = rand(0, 1) < 0.08;
    const g = isSparkle ? rand(1.3, 1.8) : rand(0.7, 1.15);
    return {
      x: x !== undefined ? x : rand(0, W),
      y: y !== undefined ? y : rand(0, H),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      size: rand(1.4, 3.6),
      color,
      colorR,
      colorG,
      colorB,
      glow: g,
      baseGlow: g, // resting brightness — Comet mode boosts glow above this, then it decays back
      sparkle: isSparkle,
      sparklePhase: rand(0, Math.PI * 2),
      wobble: rand(0, Math.PI * 2),
      // spreads particles across a band of rings/orbits instead of all
      // converging onto one exact radius — keeps Orbit-family modes
      // visually alive instead of settling into a static, packed ring
      orbitJitter: rand(0.92, 1.08),
      spinJitter: rand(0.75, 1.3),
      teleportCooldown: 0, // frames left before this particle is allowed to hand off again
      // which role this particle plays in a two-finger Gravity Well bridge:
      // most particles coil around the line between the two wells, a
      // minority thread straight down the line itself
      strand: rand(0, 1) < 0.22 ? 'line' : 'coil',
      coilPhase: rand(0, Math.PI * 2), // offsets each coiling particle so they don't all swirl in lockstep
      coilSide: rand(0, 1) < 0.5 ? 1 : -1, // which side of the line this particle's strand winds on
      webOffset: rand(-22, 22), // perpendicular resting distance from a polygon edge for Attract/Wind's multi-finger web, so particles form a loose band instead of collapsing onto a single pixel-thin line
      latticePhase: rand(0, Math.PI * 2),
      latticeBand: (Math.random() * 5) | 0,
      latticeOffset: rand(0.25, 1),
      // 3D physics modes: position/velocity in the volume, seeded on entry
      wx: 0, wy: 0, wz: 0, wvx: 0, wvy: 0, wvz: 0, oax: 0, oay: 1, oaz: 0, physEpoch: 0,
      flowLight: 1,
      saturnRing: rand(0, 1) < 0.38, // Saturn mode: fixed once — is this particle part of the tilted ring, or the core?
      // Sphere mode: a fixed point on a unit sphere, assigned once so the
      // same particle always sits at the same spot on the shape instead of
      // being reassigned every frame (which would just look like noise).
      ...(() => { const s = randomSpherePoint(); return { formX: s.x, formY: s.y, formZ: s.z }; })(),
      formTargetZ: 0,
      formActive: false,
      // depth (world Z) is purely a rendering concern — nothing above this
      // reads pt.z, so none of the touch-interaction math needed to change
      // to get real 3D. Each particle keeps a fixed base depth and gently
      // breathes around it on its own phase/speed so the volume always
      // feels alive, even before any audio or touch is layered on top.
      zBase: rand(-1, 1) * DEPTH,
      zWobble: rand(0, Math.PI * 2),
      zSpeed: rand(0.5, 1.15),
      z: 0
    };
  }

  // Smoothly grow or shrink the population toward targetCount.
  // Particles are permanent members of the field — they drift and get
  // pushed around, but they don't expire or get consumed by effects.
  function reconcilePopulation() {
    // step scales with how far we are from the target so huge jumps (e.g.
    // toward the 50000 cap) settle in a couple seconds, not a minute.
    effectiveTargetCount = qualityMode === 'auto' ? Math.min(targetCount, particleBudget()) : targetCount;
    const previousCount = particles.length;
    const step = Math.max(6, Math.ceil(Math.abs(effectiveTargetCount - particles.length) / 30));
    if (particles.length < effectiveTargetCount) {
      for (let i = 0; i < step && particles.length < effectiveTargetCount; i++) {
        particles.push(makeParticle());
      }
    } else if (particles.length > effectiveTargetCount) {
      particles.splice(0, Math.min(step, particles.length - effectiveTargetCount));
    }
    if (particles.length !== previousCount) particleColorDirty = true;
  }

  // ---------- Pointer tracking (multi-touch) ----------
  const pointers = new Map(); // id -> {x,y,px,py,angle,vx,vy}
  const pendingPointerSamples = new Map();
  const MAX_ACTIVE_POINTERS = 5; // interaction modes intentionally top out at five fingers

  function updatePointer(id, x, y) {
    let p = pointers.get(id);
    if (!p) {
      p = { x, y, px: x, py: y, vx: 0, vy: 0, angle: rand(0, Math.PI * 2), t: 0, ts: performance.now() };
      pointers.set(id, p);
    } else {
      // Velocity is kept in "pixels per 60 Hz frame" whatever the display
      // runs at, so drag-to-spin and every drag-driven force feel the same
      // at 120 Hz (where samples arrive twice as often, half as far apart).
      const now = performance.now();
      const per60 = 16.67 / Math.max(4, Math.min(100, now - p.ts));
      p.ts = now;
      p.px = p.x; p.py = p.y;
      p.x = x; p.y = y;
      p.vx = (p.x - p.px) * per60;
      p.vy = (p.y - p.py) * per60;
    }
  }
  function removePointer(id) {
    pointers.delete(id);
    pendingPointerSamples.delete(id);
  }

  function queuePointerSample(e) {
    // Use only the latest coalesced sample. Intermediate hardware samples are
    // redundant once the current animation frame has been missed.
    const samples = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : null;
    const sample = samples && samples.length ? samples[samples.length - 1] : e;
    pendingPointerSamples.set(e.pointerId, { x: sample.clientX, y: sample.clientY });
  }

  function flushPointerSamples() {
    if (!pendingPointerSamples.size) return;
    for (const [id, sample] of pendingPointerSamples) {
      if (!pointers.has(id)) continue;
      const s = screenToSim(sample.x, sample.y);
      if (s) updatePointer(id, s.x, s.y);
    }
    pendingPointerSamples.clear();
  }

  const RELEASE_STRENGTH = 6.5;
  const RELEASE_STRENGTH_BY_MODE = { Attract: 10, Orbit: 10.5, 'Gravity Well': 11, Whirlpool: 9, Bloom: 9, Lattice: 7 };

  // When a finger lifts, every particle gets a burst kick — the direction
  // depends on the active mode, not just "away from the touch point":
  //   Attract -> bursts outward from the clump's own center, blended with
  //              a jittered version of each particle's existing heading —
  //              a tightly packed group scatters apart instead of all
  //              drifting off together in the same direction
  //   Repel   -> radial burst away from the release point
  //   Swirl   -> tangential burst, continuing the spin direction
  //   Orbit   -> strong radial burst off the ring, with a little spin left
  //              over, like flinging off a carousel that's spinning apart
  //   Wind    -> burst along the direction the finger was last moving
  //   Gravity Well -> outward from the pack's own center, like Attract
  //   Comet   -> continues the trailing/repel behavior from the drag
  //   Whirlpool -> one last outward-along-spin kick, continuing the drain's
  //                own eject direction instead of just stopping dead
  //   Pulse   -> a final push scaled by wherever the held wave's own
  //              rhythm happened to be at the moment of release
  function releaseBurst(id) {
    const p = pointers.get(id);
    if (!p) return;
    if (FLOW_3D_MODES.has(mode)) { physRelease(p, RELEASE_STRENGTH * releaseStrength); return; }

    // center of the current field — used so Attract/Orbit bursts scatter
    // outward from where the particles actually are, not just the touch
    let sumX = 0, sumY = 0;
    particles.forEach(pt => { sumX += pt.x; sumY += pt.y; });
    const centroidX = sumX / Math.max(1, particles.length);
    const centroidY = sumY / Math.max(1, particles.length);

    particles.forEach((pt) => {
      const dx = pt.x - p.x, dy = pt.y - p.y;
      const dist = Math.max(6, Math.hypot(dx, dy));
      const falloff = FALLOFF_REACH / (FALLOFF_REACH + dist);
      const nx = dx / dist, ny = dy / dist;
      const strength = (RELEASE_STRENGTH_BY_MODE[mode] || RELEASE_STRENGTH) * releaseStrength;
      const kick = strength * falloff;

      switch (mode) {
        case 'Attract': {
          // outward from the pack's own center, not the touch point —
          // this is what actually separates particles that were moving
          // in lockstep, since their positions still differ even when
          // their velocities look identical
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;

          const sp = Math.hypot(pt.vx, pt.vy);
          const headingAngle = sp > 0.01 ? Math.atan2(pt.vy, pt.vx) : Math.atan2(cny, cnx);
          const jitter = rand(-0.55, 0.55); // breaks up any uniform direction
          const burstAngle = headingAngle + jitter;

          pt.vx += Math.cos(burstAngle) * kick * 0.7 + cnx * kick * 0.9;
          pt.vy += Math.sin(burstAngle) * kick * 0.7 + cny * kick * 0.9;
          break;
        }
        case 'Repel': {
          pt.vx += nx * kick;
          pt.vy += ny * kick;
          break;
        }
        case 'Sphere': case 'Cosmos': {
          // scatter off the shape's surface, same shape as Repel's burst
          pt.vx += nx * kick;
          pt.vy += ny * kick;
          break;
        }
        case 'Swirl': {
          pt.vx += -ny * kick;
          pt.vy += nx * kick;
          break;
        }
        case 'Orbit': {
          // strong radial burst off the ring, plus a jittered angle so
          // the whole ring doesn't fly apart as one rigid disc
          const jitter = rand(-0.5, 0.5);
          const burstAngle = Math.atan2(ny, nx) + jitter;
          pt.vx += Math.cos(burstAngle) * kick * 1.3;
          pt.vy += Math.sin(burstAngle) * kick * 1.3;
          // a little leftover spin so it reads as flying off a carousel
          pt.vx += -ny * kick * 0.35;
          pt.vy += nx * kick * 0.35;
          break;
        }
        case 'Wind': {
          const wsp = Math.hypot(p.vx, p.vy);
          if (wsp > 0.01) {
            pt.vx += (p.vx / wsp) * kick;
            pt.vy += (p.vy / wsp) * kick;
          }
          break;
        }
        case 'Gravity Well': {
          // same idea as Attract's burst — scatter outward from the pack's
          // own center so a tightly collapsed clump explodes apart rather
          // than drifting off as one rigid group
          const cdx = pt.x - centroidX, cdy = pt.y - centroidY;
          const cdist = Math.max(4, Math.hypot(cdx, cdy));
          const cnx = cdx / cdist, cny = cdy / cdist;
          pt.vx += cnx * kick;
          pt.vy += cny * kick;
          break;
        }
        case 'Comet': {
          // release continues whatever the drag was doing: trailing
          // particles keep being flung backward away from the motion,
          // or if the finger was held still, they get one last outward push
          const wsp = Math.hypot(p.vx, p.vy);
          if (dist < COMET_RADIUS * 1.5) {
            if (wsp > COMET_DRAG_THRESHOLD) {
              pt.vx -= (p.vx / wsp) * kick * 1.4;
              pt.vy -= (p.vy / wsp) * kick * 1.4;
            } else {
              pt.vx += nx * kick * 1.2;
              pt.vy += ny * kick * 1.2;
            }
            pt.glow = Math.min(2.2, pt.glow + 0.6);
          }
          break;
        }
        case 'Bloom': {
          // Release interrupts the inhale/exhale cycle with a massive radial
          // outward burst, letting the gathered particles explode outward.
          pt.vx += nx * kick * 1.6;
          pt.vy += ny * kick * 1.6;
          pt.glow = Math.min(2.2, pt.glow + 0.5);
          break;
        }

          // breaking the structure immediately.
          const diagonal = ((pt.latticeBand % 2) ? 1 : -1) * 0.55;

          pt.vy += (ny + nx * diagonal) * kick * 0.75;

          // continuation of the churn instead of an abrupt stop

          pt.vx += Math.cos(burstAngle) * kick * 1.1;
          pt.vy += Math.sin(burstAngle) * kick * 1.1;

          pt.vy += nx * kick * 0.6;

          // letting go mid-crest gives a stronger final push than letting
          // go mid-trough, so the burst feels tied to the breathing
          // rhythm rather than an arbitrary fixed kick
          const wave = Math.sin(dist * PULSE_FREQ - simTime * PULSE_SPEED);
          const waveKick = kick * (0.6 + Math.max(0, wave) * 0.8);

          pt.vy += ny * waveKick;

  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!pointers.has(e.pointerId) && pointers.size >= MAX_ACTIVE_POINTERS) return;

    if (!pointers.has(e.pointerId)) return;

  }, { passive: true });
  canvas.addEventListener('pointerup', (e) => {
    if (!pointers.has(e.pointerId)) return;

    removePointer(e.pointerId);
  }, { passive: true });
  canvas.addEventListener('pointercancel', (e) => {
    if (!pointers.has(e.pointerId)) return;
    releaseBurst(e.pointerId);
    removePointer(e.pointerId);
  }, { passive: true });

  // A gentle random kick applied to the existing field — never changes count.
  function scatterField() {
    particles.forEach((pt) => {
      const a = rand(0, Math.PI * 2);
      const kick = rand(1.5, 4);
      pt.vx += Math.cos(a) * kick;
      pt.vy += Math.sin(a) * kick;
    });
  }

  // How quickly the pull weakens with distance — no cutoff, so every
  // particle on screen is always influenced by every touch, just more
  // gently the farther away it is. Orbit uses a tighter reach so its
  // pull stays local instead of dragging the whole screen into a slow spin.
  const FALLOFF_REACH = 260;
  const REACH_BY_MODE = { Swirl: 260, Repel: 260, Attract: 260, Orbit: 190, Wind: 260, 'Gravity Well': 240, Comet: 260, Sphere: 260, Cosmos: 260, Whirlpool: 220, Pulse: 260, Bloom: 250, Lattice: 240 };

  // Orbit settles particles onto a ring at this radius around the touch,
  // like a small gravity well, instead of a wide diffuse swirl.
  const ORBIT_RADIUS = 70;
  const ORBIT_SPRING = 0.07;
  const ORBIT_SPIN = 1.5;

  // Sphere: pulls the field into a rotating 3D globe centered on screen,
  // using real depth (pt.z) instead of just x/y — this is the mode built
  // specifically to show off the field's 3D volume. Each particle springs
  // toward its fixed spot on the globe (formX/Y/Z, set once at creation)
  // rotated by the shared formSpin phase, which is what makes the whole
  // shape visibly turn in place. Cosmos's five shapes below reuse this
  // same spring/rotation machinery with their own shapePoint* functions,
  // so SPHERE_SPRING/SPHERE_Z_SPRING now apply to all of them too.
  const SPHERE_SPRING = 0.07;
  const SPHERE_Z_SPRING = 0.12;
  let formSpin = 0;   // accumulated rotation around the vertical (Y) axis
  let formTilt = 0;   // accumulated rotation around the horizontal (X) axis
  let formSpinVel = 0; // current angular velocity, eased toward a target each frame — fingers are the only source
  let formTiltVel = 0;
  let saturnRingSpin = 0; // Saturn mode only: extra rotation applied to ring particles alone, on top of the shared spin/tilt, so the ring visibly overtakes the core instead of the whole planet turning as one rigid body
  // How strongly a finger's own drag speed maps to spin/tilt velocity, and
  // how slowly the current velocity chases that target — the low EASE value
  // is the "legroom": small jitters in finger movement barely nudge the
  // spin, it only really picks up once a drag holds a direction for a bit.
  const FORM_DRAG_TO_SPIN = 0.012;
  const FORM_SPIN_EASE = 0.045;

  // One finger = sphere (globe), 2 = cube, 3 = pyramid, 4 = DNA double
  // helix, 5+ = torus (ring donut) — each function takes the particle's
  // fixed formX/Y/Z unit-sphere sample (assigned once at creation) and a
  // spin phase, and returns a { x, y, z } point (roughly unit scale) for
  // that shape. Reusing the same formX/Y/Z sample as a source of per-
  // particle randomness (instead of drawing new random numbers here) is
  // what keeps each particle glued to the same spot on the shape frame to
  // frame instead of jittering between spots.
  function shapePointSphere(pt) {
    return { x: pt.formX, y: pt.formY, z: pt.formZ };
  }
  function shapePointCube(pt) {
    // snap each axis of the particle's own sphere sample to whichever
    // face it's closest to (±1), so particles distribute themselves
    // across all 6 faces instead of piling onto one
    const ax = Math.abs(pt.formX), ay = Math.abs(pt.formY), az = Math.abs(pt.formZ);
    let x = pt.formX, y = pt.formY, z = pt.formZ;
    if (ax >= ay && ax >= az) x = Math.sign(pt.formX) || 1;
    else if (ay >= ax && ay >= az) y = Math.sign(pt.formY) || 1;
    else z = Math.sign(pt.formZ) || 1;
    return { x, y, z };
  }
  function shapePointPyramid(pt) {
    // base square in x/z, apex at +y — walk up from the particle's own
    // y-sample so particles distribute across all four faces plus base
    const t = (pt.formY + 1) / 2; // 0 at base, 1 at apex
    const half = 1 - t; // base footprint shrinks linearly toward the apex
    const ax = Math.abs(pt.formX), az = Math.abs(pt.formZ);
    let x = pt.formX, z = pt.formZ;
    if (ax >= az) x = (Math.sign(pt.formX) || 1) * half; else z = (Math.sign(pt.formZ) || 1) * half;
    // remaining axis still varies across the face instead of pinning to an edge
    if (ax >= az) z = pt.formZ * half; else x = pt.formX * half;
    return { x, y: t * 2 - 1, z };
  }
  function shapePointHelix(pt) {
    // two intertwined strands (a DNA double helix) — half the particles
    // (by coilSide) ride one strand, half the other, 180° apart. The whole
    // shape's spin comes from the same outer y-axis rotation every other
    // shape uses, so this only needs to lay out the static strand geometry.
    const turns = 2.4;
    const t = pt.formY; // -1..1 walk up the strand, reusing the sphere sample as free per-particle spread
    const strandOffset = pt.coilSide > 0 ? 0 : Math.PI;
    const angle = t * Math.PI * turns + strandOffset;
    const r = 0.55;
    return { x: Math.cos(angle) * r, y: t, z: Math.sin(angle) * r };
  }
  function shapePointTorus(pt) {
    // ring donut — formX/formZ angle picks position around the main ring,
    // formY plus a small tube radius picks position around the ring's
    // own cross-section
    const theta = Math.atan2(pt.formZ, pt.formX);
    const tube = 0.32;
    const phi = pt.formY * Math.PI;
    const ringR = 0.75 + Math.cos(phi) * tube;
    return { x: Math.cos(theta) * ringR, y: Math.sin(phi) * tube, z: Math.sin(theta) * ringR };
  }
  // fingerCount -> point function, so applyTouchForces just looks up the
  // right shape for however many touches are currently active
  const SHAPE_BY_FINGERS = { 1: shapePointSphere, 2: shapePointCube, 3: shapePointPyramid, 4: shapePointHelix, 5: shapePointTorus };

  function shapePointGalaxy(pt) {
    // spiral disc — formY (already uniform -1..1) becomes the per-particle
    // radius seed, biased with a power curve so particles bunch up into a
    // bright core instead of spreading evenly out to the rim
    const t = (pt.formY + 1) / 2;
    const r = Math.pow(t, 1.6);
    // formX assigns each particle to one of a few arms (stable frame to
    // frame since formX never changes), and r itself drives the winding —
    // radius increases together with angle, which is what curls the arms
    const ARMS = 3, WINDING = 3.2;
    const armIndex = Math.floor(((pt.formX + 1) / 2) * ARMS);
    const armOffset = (armIndex / ARMS) * Math.PI * 2;
    const theta = armOffset + r * Math.PI * 2 * WINDING + pt.formZ * 0.4; // formZ scatters particles off the arm centerline
    // thin disc that gets even thinner toward the bright core, like a real
    // spiral galaxy's flattened plane
    const y = pt.formZ * 0.05 * (1 - r * 0.6);
    return { x: Math.cos(theta) * r, y, z: Math.sin(theta) * r };
  }
  function shapePointVortex(pt) {
    // a funnel: wide open mouth at the top narrowing toward a tip at the
    // bottom, particles spiraling around it — formY (fixed per particle)
    // walks each one from mouth to tip so nobody reshuffles frame to frame
    const t = (pt.formY + 1) / 2; // 0 mouth .. 1 tip
    const TURNS = 3.5;
    const radius = 1 - t * 0.82; // never fully closes to a point — keeps a visible tip
    const theta = t * Math.PI * 2 * TURNS + pt.formX * Math.PI; // formX offsets each particle's starting angle so the funnel isn't one thin ribbon
    return { x: Math.cos(theta) * radius, y: 1 - t * 2, z: Math.sin(theta) * radius };
  }
  function shapePointSaturn(pt) {
    if (pt.saturnRing) {
      // flat ring, tilted relative to the core — angle comes from the
      // particle's own sphere sample so ring particles stay evenly spread
      const theta = Math.atan2(pt.formZ, pt.formX);
      const TILT = 0.45; // fixed tilt, echoing the real planet's ring angle
      const ringR = 0.82 + pt.formY * 0.14; // banded width instead of a razor-thin line
      const flatZ = Math.sin(theta) * ringR;
      return { x: Math.cos(theta) * ringR, y: flatZ * Math.sin(TILT), z: flatZ * Math.cos(TILT) };
    }
    // core: the same packed sphere sample every other shape draws from,
    // just scaled down so the ring reads clearly outside it
    return { x: pt.formX * 0.42, y: pt.formY * 0.42, z: pt.formZ * 0.42 };
  }
  function shapePointNebula(pt) {
    // billowing gas cloud — warps each particle's own fixed sphere sample
    // with a few layered sine waves so the volume clumps into wisps and
    // filaments instead of staying a uniform ball, then flattens it
    // slightly so it reads as a broad cloud rather than a planet
    const wobX = Math.sin(pt.formY * 5 + pt.formZ * 3.1) * 0.4;
    const wobY = Math.sin(pt.formZ * 4.2 + pt.formX * 6) * 0.4;
    const wobZ = Math.sin(pt.formX * 3.4 + pt.formY * 5.3) * 0.4;
    return { x: pt.formX * 0.7 + wobX, y: pt.formY * 0.5 + wobY, z: pt.formZ * 0.7 + wobZ };
  }
  function shapePointWormhole(pt) {
    // two funnels joined at a narrow throat, like a wormhole tunnel seen
    // side-on — formY (fixed per particle) walks each one from one mouth,
    // through the pinched waist, to the opposite mouth
    const t = (pt.formY + 1) / 2; // 0 top mouth .. 1 bottom mouth
    const TURNS = 3;
    const throat = Math.abs(t - 0.5) * 2; // 0 at the waist, 1 at either mouth
    const radius = 0.16 + throat * 0.78;
    const theta = t * Math.PI * 2 * TURNS + pt.formX * Math.PI;
    return { x: Math.cos(theta) * radius, y: 1 - t * 2, z: Math.sin(theta) * radius };
  }
  // Cosmos: one mode, five shapes — same finger-count ladder idea as
  // Sphere's SHAPE_BY_FINGERS, just drawing from the cosmic set instead
  // of the geometric one.
  const COSMOS_SHAPE_BY_FINGERS = { 1: shapePointGalaxy, 2: shapePointVortex, 3: shapePointSaturn, 4: shapePointNebula, 5: shapePointWormhole };

  // ---------- 3D physics modes (Orbit 3D, Tornado, Flock, Magnet, Fluid) ----------
  // These are the 3D cousins of Attract / Repel / Orbit: no target shapes at
  // all. Every particle has a real position and velocity in a 3D volume
  // (wx/wy/wz, wvx/wvy/wvz; pixels, origin at the centre, y up) and only
  // forces move it — gravity wells, twisters, a self-steering flock, magnetic
  // field lines, a swirling current. Whatever pattern shows up comes out of
  // the motion. Fingers sit on the plane through the middle of the volume
  // facing you. The whole volume turns slowly (View turn in Effects) so the
  // depth reads; drawing just rotates world -> view each frame.
  const TAU = Math.PI * 2;
  const FLOW_3D_MODES = new Set(['Orbit 3D', 'Tornado', 'Flock', 'Magnet', 'Fluid']);
  const PHYS_DRAG = { 'Orbit 3D': 0.996, 'Tornado': 0.982, 'Flock': 0.995, 'Magnet': 0.96, 'Fluid': 0.985 };
  let viewYaw = 0.5;

  const VIEW_TURN = 0.0014; // radians per 60 Hz frame at View turn 100%
  let physEpoch = 1;        // bumped on entering a 3D physics mode; particles re-seed lazily
  const P = { cy: 1, sy: 0, cp: 1, sp: 0, T: 0, n: 0, fingers: [], rc: 200, hy: 300, hz: 200, flock: null };
  for (let i = 0; i < 5; i++) P.fingers.push({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 1 });

  // view-space (x right, y up, z toward you) -> world, inverse of the draw rotation
  function viewToWorld(vx, vy, vz, out) {
    const y1 = vy * P.cp + vz * P.sp;
    const z1 = -vy * P.sp + vz * P.cp;
    out.x = vx * P.cy - z1 * P.sy;
    out.y = y1;
    out.z = vx * P.sy + z1 * P.cy;
    return out;
  }
  const _v = { x: 0, y: 0, z: 0 };

  function resetFlowMode() {
    physEpoch++;
    if (P.flock) P.flock.dirty = true;
  }

  function seedPhys(pt, halfW, halfH) {
    // start from where the particle is on screen, spread through the depth
    viewToWorld(pt.x - halfW, halfH - pt.y, rand(-1, 1) * P.hz * 0.8, _v);
    pt.wx = _v.x; pt.wy = _v.y; pt.wz = _v.z;
    viewToWorld(pt.vx * 0.5, -pt.vy * 0.5, rand(-0.6, 0.6), _v);
    pt.wvx = _v.x; pt.wvy = _v.y; pt.wvz = _v.z;
    // each particle leans its orbits around its own axis (Orbit 3D)
    pt.oax = pt.formX; pt.oay = pt.formY; pt.oaz = pt.formZ;
    pt.physEpoch = physEpoch;
  }

  // ---- Flock: neighbourhood averages from a coarse 3D grid, O(particles) ----
  const FLOCK_CELL = 70;
  function flockGrid() {
    const nx = Math.max(3, Math.ceil(P.rc * 2.6 / FLOCK_CELL) + 1);
    const ny = Math.max(3, Math.ceil(P.hy * 2.6 / FLOCK_CELL) + 1);
    const nz = nx;
    let g = P.flock;
    if (!g || g.nx !== nx || g.ny !== ny) {
      const n = nx * ny * nz;
      g = P.flock = { nx, ny, nz, n, raw: new Float32Array(n * 7), sum: new Float32Array(n * 7), tmp: new Float32Array(n * 7) };
    }
