<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press Play Games</title>
<meta name="description" content="The games from the Press Play app, with Points, quests, achievements, the shop and the Playground.">
<meta name="theme-color" content="#0c0d10">
<link rel="icon" href="games/obby/icon.png">
<!--
  The Press Play games website. tools/build_games_site.py fills the PP:… slots below from www/index.html,
  so the Games screen and the Disc Clicker here are the app's own code, not copies.
  window.__ppWeb tells the shared scripts there is no media player: they leave out listening quests,
  app XP, EQ and background rewards.
-->
<style>
  :root{
    --bg:#0c0d10; --bg-elev:#16171b; --line:#232429; --text:#e8e8ea; --text-dim:#8b8c93;
    --accent:#6ee7d0; --accent-dim:#3a5f57; --danger:#e0667a;
  }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* the Games screen is the page itself here, not an overlay: the clicker tab, the Playground button and
     the Playground hub sit above it as they do above the app. It has nothing to go back to. */
  html body #pp-games{ position:relative; inset:auto; z-index:auto; min-height:100vh; box-sizing:border-box; }
  #pp-games > .ppg-head > .ppg-back{ visibility:hidden; }
  /* the Playground switch, under the Points tiles */
  .ppw-pg{ display:flex; align-items:center; gap:12px; margin:0 16px 14px; padding:10px 12px; border-radius:14px;
    background:linear-gradient(var(--bg-elev),var(--bg-elev)) padding-box, linear-gradient(120deg,#6ee7d0,#8b5cff 60%,#ff5fd8) border-box;
    border:1px solid transparent; }
  .ppw-pg[hidden]{ display:none; }
  .ppw-pg .e{ width:36px; height:36px; border-radius:10px; overflow:hidden; flex:none; }
  .ppw-pg .t{ flex:1; min-width:0; }
  .ppw-pg .t b{ display:block; font-size:14px; }
  .ppw-pg .t small{ color:var(--text-dim); font-size:12px; }
  .ppw-pg button{ font:600 13px/1 inherit; font-family:inherit; cursor:pointer; border-radius:999px; padding:8px 12px; }
  .ppw-open{ border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text); }
  .ppw-sw{ border:0; min-width:56px; background:rgba(255,255,255,.1); color:var(--text-dim); }
  .ppw-sw[aria-checked="true"]{ background:linear-gradient(90deg,#6ee7d0,#b79bff); color:#0c0d10; }
</style>
<script>
  window.__ppWeb = true;

  // App modes, website version: only the Playground, which is bought in the Points shop.
  // Same storage keys and event as the app (PPModeGate in www/index.html), so the shared scripts work unchanged.
  (function(){
    var K = 'ppModeGateV1', st = {};
    try { st = JSON.parse(localStorage.getItem(K)) || {}; } catch(e){}
    function save(){ try { localStorage.setItem(K, JSON.stringify(st)); } catch(e){} }
    window.PPModeGate = {
      state: function(){ return st; },
      unlocked: function(m){ return m === 'playground' && !!st.playground; },
      grant: function(m){
        if (m !== 'playground' || st.playground) return false;
        st.playground = true; save();
        try { window.dispatchEvent(new CustomEvent('ppgate', { detail: m })); } catch(e){}
        return true;
      },
      done: function(){}, check: function(){}, addClean: function(){}, legacy: function(){ return false; }
    };
    // a Playground switch left on without owning the mode is turned off before any script reads it
    try { if (localStorage.getItem('ppPlaygroundMode') === '1' && !st.playground) localStorage.setItem('ppPlaygroundMode', '0'); } catch(e){}
  })();

  // Toasts for the shared scripts. Uses the Points toast box once pp-points.js has made it.
  function showToast(msg){
    var box = document.getElementById('ppx-toast'); if (!box) return;
    var t = document.createElement('div'); t.className = 'ppx-t'; t.textContent = msg;
    box.appendChild(t);
    while (box.children.length > 3) box.removeChild(box.firstChild);
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 3600);
  }
</script>
<!--PP:games-style-->
</head>
<body>
<script>
  // the Playground's body class must be right before the Playground scripts read it
  try { if (localStorage.getItem('ppPlaygroundMode') === '1') document.body.classList.add('pp-playground'); } catch(e){}
</script>
<!--PP:games-js-->
<!--PP:clicker-->
<!--PP:shared-scripts-->
<script>
(function(){
  'use strict';
  var games = window.__ppGames; if (!games) return;
  var grid = games.grid;
  // the Games screen is the whole page (opening it also gives the daily-visit points)
  grid.classList.add('open', 'shown');

  // ---- Playground mode switch (the app has this in Settings → App mode) ----
  var MODE = 'ppPlaygroundMode';
  function isOn(){ try { return localStorage.getItem(MODE) === '1'; } catch(e){ return false; } }
  function owned(){ return !!(window.PPModeGate && PPModeGate.unlocked('playground')); }
  function setMode(on){
    try { localStorage.setItem(MODE, on ? '1' : '0'); } catch(e){}
    document.body.classList.toggle('pp-playground', on);
    if (on) try { window.PPClicker && PPClicker.show(); } catch(e){}
    render();
  }
  var row = document.createElement('div');
  row.className = 'ppw-pg';
  row.innerHTML = '<span class="e"></span><div class="t"><b>Press Play Playground</b><small></small></div>' +
    '<button type="button" class="ppw-open">Open</button><button type="button" class="ppw-sw" role="switch" aria-label="Playground mode"></button>';
  try { row.querySelector('.e').innerHTML = window.__ppEmblem ? window.__ppEmblem() : ''; } catch(e){}
  var strip = grid.querySelector('.ppx-strip'), sub = grid.querySelector('.ppg-sub');
  var after = strip || sub;
  after.parentNode.insertBefore(row, after.nextSibling);
  function render(){
    var on = isOn();
    row.hidden = !owned();
    row.querySelector('small').textContent = on ? 'On: every game exclusive is free.' : 'Off. Turn it on for orders, charms, the wheel and free exclusives.';
    row.querySelector('.ppw-open').hidden = !on;
    var sw = row.querySelector('.ppw-sw');
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    sw.textContent = on ? 'On' : 'Off';
  }
  row.querySelector('.ppw-sw').addEventListener('click', function(){ setMode(!isOn()); });
  row.querySelector('.ppw-open').addEventListener('click', function(){ try { PPPlayground.open(); } catch(e){} });
  // bought in the Points shop: switch it on straight away
  window.addEventListener('ppgate', function(e){ if (e.detail === 'playground') setTimeout(function(){ setMode(true); }, 300); });
  render();
})();
</script>
</body>
</html>
