name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Put the web app in www
        run: |
          mkdir -p www
          cp index.html vocal-separator.js www/
          if [ -f update-options.js ]; then cp update-options.js www/; fi

      - name: Install Capacitor and create the Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Allow more memory for the app
        run: |
          sed -i 's/<application/<application android:largeHeap="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: press-play-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
