<div id="pp-loader" role="status" aria-live="polite" aria-label="Loading">
  <div class="pp-ld-bars"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pp-ld-spin pp-ld-lite"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></div>
  <div class="pp-ld-spin pp-ld-plus"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></div>
  <div class="pp-ld-spin pp-ld-premium"><i></i><i></i><b></b></div>
  <div class="pp-ld-title">Press Play Media</div>
  <div class="pp-ld-sub">Loading library…</div>
</div>
<script>
(function(){
  var l=document.getElementById('pp-loader');
  try{
    var ed=localStorage.getItem('ppPlaygroundMode')==='1'?'playground':localStorage.getItem('ppLiteMode')==='1'?'lite':localStorage.getItem('ppPlusMode')==='1'?'plus':localStorage.getItem('ppPremiumMode')==='1'?'premium':'';
    if(ed&&l){
      l.setAttribute('data-ed',ed);
      var t=l.querySelector('.pp-ld-title');
      if(t)t.insertAdjacentHTML('beforeend','<span class="pp-ld-ed" data-ed="'+ed+'">'+{lite:'Lite',plus:'Plus',premium:'Premium',playground:'Playground'}[ed]+'</span>');
    }
  }catch(e){}
  setTimeout(function(){var x=document.getElementById('pp-loader');if(x)x.remove()},15000);
})();
</script>
